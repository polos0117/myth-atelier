<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>신화 무기 공방</title>
<!--
  오토 배틀러의 얼굴. 규칙은 lib/auto.js 에만 있다 — 여기는 상태를 그리고 단추를 엔진에 넘길 뿐이다.
  판은 이 브라우저(localStorage)에 남는다. 상태가 통째로 JSON 이라 그대로 넣고 꺼낸다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth30">
<style>
:root {--cc:var(--line)}
* {box-sizing:border-box}
html,body {margin:0;padding:0}
body {color:var(--text);font-size:15px}
.dex-page > #app {display:flex;flex-direction:column;min-height:0;height:100%}
.dex-page > #app > main {flex:1 1 auto;min-height:0}
.collection-scroll {display:block}
.dex-page .collection-scroll {padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.auto-page .collection-scroll:has(.at-dock) {padding-bottom:0}
/* 머리띠 — 라운드·체력·금 */
.at-strip {display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 0 4px;font:700 12px ui-monospace,monospace;letter-spacing:.06em;color:var(--muted)}
.at-strip b {color:var(--text);font-size:15px;margin-left:5px}
.at-strip .at-hp b {color:var(--signal)}
.at-strip .at-gold b {color:var(--gold)}
.at-strip .at-tools {margin-left:auto;display:flex;gap:6px}
/* 상점 단계의 바닥 바 — 라운드·금·레벨과 레벨 업·싸운다를 상점 곁에 둔다 */
.at-dock {position:sticky;bottom:0;z-index:6;margin:14px 0 0;padding:6px 10px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border:1px solid var(--line);border-bottom:0;border-top:2px solid var(--accent);border-radius:12px 12px 0 0;box-shadow:0 -10px 24px #0007}
.at-dock .at-strip {padding:4px 0 8px;gap:4px 12px}
.at-dock .at-strip b {font-size:14px}
.at-dock-act {display:flex;gap:8px}
.at-dock-act .at-btn {min-height:46px}
.at-dock-act #at-fight {flex:1}
.at-btn {min-height:40px;padding:8px 12px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;font-weight:700}
/* 덮개 화면 — 정보 닫기·다시 보기도 엄지가 닿는 크기로 */
@media (pointer:coarse), (max-width:599px) {.at-btn {min-height:44px}}
.at-btn.primary {background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-height:46px;font-size:14px}
:is([data-theme="daylight"],[data-theme="blossom"],[data-theme="sand"]) .at-btn.primary {color:#fff}
.at-btn:disabled {opacity:.45}
.sec {margin:16px 0 8px;font:700 11px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:var(--accent);display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.sec span {color:var(--muted);font-weight:400;letter-spacing:0}
.note {margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
/* 판 — 두 줄 세 칸. 상대 판은 뒷줄이 위, 내 판은 앞줄이 위라 마주 본다 */
.at-grid {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.at-cell {position:relative;min-height:88px;padding:6px 5px;background:var(--card);border:1px solid var(--cc);border-radius:10px;color:var(--text);font:inherit;font-size:12px;font-weight:700;text-align:center;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.at-cell.empty {background:var(--card2);color:var(--muted);border-style:dashed;font-weight:400}
.at-cell.on {outline:3px solid var(--accent);outline-offset:1px}
.at-cell.target {border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.at-cell img {position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.55}
.at-cell.them img {filter:grayscale(.3)}
.at-cell .nm {position:relative;font-size:12px;line-height:1.25;overflow-wrap:anywhere;text-shadow:0 1px 3px var(--bg)}
.at-cell .st {position:relative;color:var(--gold);font-size:10px;letter-spacing:.1em}
.at-cell .ct {position:absolute;top:5px;right:6px;font:700 10px ui-monospace,monospace;color:var(--accent)}
.at-cell .hpbar {position:relative;height:5px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.at-cell .hpbar u {display:block;height:100%;background:var(--ok);text-decoration:none}
.at-cell.dead {opacity:.4}
.at-cell.cursed {border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.at-row {display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:stretch;margin-bottom:6px}
.at-row > i {writing-mode:vertical-rl;text-orientation:upright;font:700 10px ui-monospace,monospace;letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;justify-content:center;width:18px}
/* 벤치 여섯 · 상점 다섯 */
.at-bench {display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
.at-bench .at-cell {min-height:72px}
.at-shop {display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.at-card {display:flex;flex-direction:column;gap:5px;padding:0;background:var(--card);border:1px solid var(--cc);border-radius:10px;overflow:hidden;text-align:left;color:var(--text);font:inherit}
.at-card .face {position:relative;display:block;width:100%;padding:0;border:0;aspect-ratio:2/3;max-height:120px;background:var(--card2);overflow:hidden;cursor:pointer}
.at-card .face img {display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.at-card .face .ph {position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font:10px ui-monospace,monospace}
.at-card .cap {padding:0 7px;font-size:12px;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.at-card .cap i {display:block;font:400 10px ui-monospace,monospace;font-style:normal;color:var(--muted)}
.at-card .buy {margin:0 7px 7px;min-height:36px;background:var(--accent-soft);color:var(--text);border:1px solid var(--line);border-radius:7px;font:inherit;font-size:12px;font-weight:700}
.at-card .buy:disabled {opacity:.4}
.at-card.gone {opacity:.35}
.at-card.gone .face {display:none}
/* 시너지 */
.at-syn-list {display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0;padding:0;list-style:none}
.at-syn {padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.at-syn.on {border-color:var(--cc);color:var(--text);background:var(--accent-soft)}
.at-syn b {display:flex;justify-content:space-between;gap:6px}
.at-syn small {font-size:11px;line-height:1.4}
.at-myths {display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.at-myth {min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);font:700 12px var(--display);cursor:pointer}
.at-myth.on {border-color:var(--cc);color:var(--text);background:var(--accent-soft);box-shadow:inset 0 -2px var(--cc)}
.at-myth:disabled {opacity:1;cursor:default}
.at-myth:disabled:not(.on) {opacity:.4}
.at-myth-n {font:700 11px ui-monospace,monospace;color:var(--muted)}
.at-pick {display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0;padding:8px 10px;background:var(--accent-soft);border-radius:9px;font-size:12px}
.at-pick .at-btn {margin-left:auto}
/* 카드 정보 — 판·벤치·상대·상점의 무기를 누르면. 별만큼 오른 체력·공격, 기술, 저주, 켜는 시너지 */
.at-info {margin:8px 0 0;padding:10px 12px;border:1px solid var(--cc);border-left:4px solid var(--cc);border-radius:10px;background:var(--card);font-size:12px}
.at-info h4 {margin:0 0 2px;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.at-info h4 .st {color:var(--gold);font-size:12px}
.at-info h4 small {font:400 11px ui-monospace,monospace;color:var(--muted)}
.at-info .at-btn {margin-left:auto;min-height:32px;padding:4px 10px}
.at-info dl {display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:8px 0 0}
.at-info dt {color:var(--muted);font:700 11px ui-monospace,monospace;white-space:nowrap;padding-top:1px}
.at-info dd {margin:0;line-height:1.5;overflow-wrap:anywhere}
.at-info dd small {display:block;color:var(--muted)}
.at-info dd .on {color:var(--ok);font-weight:700}
/* 로비 — 여섯의 체력·레벨·연승. 누르면 그 판을 본다 */
.at-lobby {display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.at-who {display:flex;flex-direction:column;gap:3px;min-width:0;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;font-size:12px;text-align:left;cursor:pointer}
.at-who b {font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-who small {font:10px ui-monospace,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at-who .bar {height:5px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.at-who .bar u {display:block;height:100%;background:var(--ok);text-decoration:none}
.at-who.low .bar u {background:var(--signal)}
.at-who.me {border-color:var(--accent);box-shadow:inset 0 -2px var(--accent)}
.at-who.opp {border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.at-who.out {opacity:.45}
.at-who[aria-pressed="true"] {background:var(--accent-soft)}
.at-scout {margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.at-level {display:inline-flex;align-items:center;gap:6px}
.at-level i {display:inline-block;width:60px;height:5px;border-radius:99px;background:var(--accent-soft);overflow:hidden;vertical-align:middle}
.at-level i u {display:block;height:100%;background:var(--gold);text-decoration:none}
.at-others {margin:8px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.at-others li b {color:var(--text);font-weight:600}
.at-card .cap i.left {display:inline;color:var(--muted)}
/* 결과 */
.at-result {padding:14px;border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:10px;background:var(--card);margin-top:12px}
.at-result h3 {margin:0 0 4px;font-size:18px;letter-spacing:-.02em}
.at-result p {margin:0;color:var(--muted);font-size:12px}
.at-log {margin:8px 0 0;padding:0;list-style:none;max-height:38vh;overflow:auto;font:12px/1.7 ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:9px;background:var(--card2);padding:8px 10px}
.at-log li b {color:var(--text);font-weight:600}
.at-log li.me b {color:var(--ok)}
.at-log li.them b {color:var(--signal)}
.at-end {padding:24px 14px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-top:12px}
.at-end h3 {margin:0 0 8px;font-size:22px}
.empty {padding:36px 0;text-align:center;color:var(--muted);font-size:13px}
/* 다시 보기 — 판 위에서 싸움이 돈다. 맞으면 붉게 번쩍이고 숫자가 떠오르고, 친 쪽은 앞으로 한 걸음, 기술은 이름이 뜬다 */
.at-play {display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--card)}
.at-play b {font-size:14px}
.at-play .clock {font:700 12px ui-monospace,monospace;color:var(--muted)}
.at-play .bar {flex:1 1 120px;height:4px;border-radius:99px;background:var(--accent-soft);overflow:hidden;min-width:80px}
.at-play .bar u {display:block;height:100%;background:var(--accent);text-decoration:none}
.at-play .at-btn[aria-pressed="true"] {border-color:var(--accent);color:var(--accent)}
.at-cell {transition:transform .16s ease-out}
.at-board[data-side="me"] .at-cell.fx-act {transform:translateY(-7px) scale(1.03)}
.at-board[data-side="them"] .at-cell.fx-act {transform:translateY(7px) scale(1.03)}
.at-cell .flash {position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#ff4d4d88,transparent 70%);animation:at-flash .38s ease-out forwards;pointer-events:none}
.at-cell .flash.crit {background:radial-gradient(circle at 50% 45%,#ffd24dcc,#ff4d4d55 45%,transparent 75%)}
.at-cell .flash.cover {background:radial-gradient(circle at 50% 45%,#8fc7ffcc,#3f7fd055 45%,transparent 75%)}
.at-pop.cover {color:#8fc7ff}
/* 이펙트 — 치명타 불똥과 판 흔들기, 기술의 빛 터짐, 쓰러질 때 파편. 전부 코드로 그린다 */
.at-arena.shake0 {animation:at-quake0 .26s linear}
.at-arena.shake1 {animation:at-quake1 .26s linear}
@keyframes at-quake0 {0%,100% {translate:0} 20% {translate:-5px 2px} 45% {translate:4px -2px} 70% {translate:-3px 1px}}
@keyframes at-quake1 {0%,100% {translate:0} 20% {translate:5px -2px} 45% {translate:-4px 2px} 70% {translate:3px -1px}}
.at-burst {position:absolute;left:50%;top:50%;width:min(70%,110px);aspect-ratio:1;z-index:1;border-radius:50%;pointer-events:none;translate:-50% -50%;mix-blend-mode:screen;
  background:radial-gradient(circle,#fffbe8 0 14%,#ffe08a99 15% 30%,transparent 58%),repeating-conic-gradient(from 8deg,#fff1b8 0 5deg,transparent 5deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);animation:at-burst .6s ease-out forwards}
.at-burst::after {content:'';position:absolute;inset:18%;border-radius:50%;border:3px solid #ffe08a;box-shadow:0 0 14px #ffd24d,inset 0 0 10px #ffd24d}
@keyframes at-burst {0% {opacity:0;scale:.3;rotate:0deg} 15% {opacity:1} 100% {opacity:0;scale:2.4;rotate:45deg}}
.at-bits {position:absolute;left:50%;top:45%;z-index:3;pointer-events:none}
.at-bits i {position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:2px;scale:var(--s);animation:at-bit .6s cubic-bezier(.2,.7,.3,1) forwards}
.at-bits.spark i {background:#fff4c2;box-shadow:0 0 8px 2px #ffb02e;border-radius:50%}
.at-bits.shard i {width:12px;height:6px;background:linear-gradient(135deg,#fff,var(--cc,#aaa) 60%);box-shadow:0 0 6px var(--cc,#fff),0 1px 2px #000a;animation-duration:.85s}
@keyframes at-bit {0% {opacity:1;transform:rotate(var(--a)) translateX(0) rotate(0deg)} 65% {opacity:1} 100% {opacity:0;transform:rotate(var(--a)) translateX(var(--r)) rotate(220deg)}}
.at-cell.fx-hurt {animation:at-shake .22s linear}
@keyframes at-flash {from {opacity:1} to {opacity:0}}
@keyframes at-shake {0%,100% {translate:0} 25% {translate:-3px 0} 75% {translate:3px 0}}
.at-pop {position:absolute;left:calc(50% + var(--dx,0px));top:calc(22% + var(--dy,0px));z-index:2;font:800 15px ui-monospace,monospace;color:#ff6b6b;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;animation:at-pop .75s ease-out forwards;white-space:nowrap}
.at-pop.crit {color:#ffd24d;font-size:18px}
.at-pop.tick {color:#e08aa8;font-size:12px}
.at-pop.heal {color:var(--ok)}
.at-pop.shield {color:#8fc7ff}
@keyframes at-pop {from {opacity:1;transform:translate(-50%,0)} to {opacity:0;transform:translate(-50%,-26px)}}
.at-cast {position:absolute;left:4px;right:4px;top:4px;z-index:2;padding:2px 4px;border-radius:6px;background:#000a;color:var(--gold);font-size:10px;line-height:1.3;overflow-wrap:anywhere;animation:at-flash 1s ease-in forwards;pointer-events:none}
.at-cell.fx-cast {box-shadow:0 0 0 2px var(--gold),0 0 18px #f3dc9a88}
.at-cell.fx-curse {box-shadow:0 0 0 2px #ff2d55,0 0 22px #c0143c}
.at-cell.fx-revive {box-shadow:0 0 0 2px #fff3c0,0 0 22px #f3dc9a}
.at-cell.stunned::after {content:'✶';position:absolute;top:4px;left:6px;color:#ffd24d;font-size:13px;animation:at-flash .9s ease-in-out infinite alternate}
.at-cell .hpbar i {position:absolute;right:0;top:0;height:100%;background:#8fc7ffcc}
.at-cell.dead {transition:opacity .4s}
@media (prefers-reduced-motion:reduce) {.at-cell,.at-cell.fx-hurt,.at-pop,.at-cast,.at-cell .flash {animation:none;transition:none} .at-arena {animation:none} .at-burst,.at-bits {display:none}}
@media(max-width:599px){
  .at-bench {grid-template-columns:repeat(5,minmax(0,1fr))}
  .at-lobby {grid-template-columns:repeat(3,minmax(0,1fr))}
  .at-grid {gap:4px}
  .at-cell {padding:4px 3px}
  .at-shop {grid-template-columns:repeat(3,minmax(0,1fr))}
  .at-shop .at-card:nth-child(n+4) {grid-column:span 1}
  .at-cell {min-height:74px;font-size:10px}
  .at-cell .nm {font-size:10px}
}
</style>

<body class="dex-page auto-page">
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=myth12';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, A = window.AtelierAuto;
const STORE = 'myth_auto_v2', V = 'f';

function Shell({ children }) {
  return html`<main>
    <${WorkspaceHeader} page="auto" />
    <div class="collection-scroll" tabindex="0">${children}</div>
  </main>`;
}
function useData() {
  const [state, set] = useState(null);
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    Promise.all([get('data/card.json'), get('data/skill.json'), get('data/synergy.json'), get('data/group.json'), IMG.load()])
      .then(([card, skill, synergy, group, img]) => set({ data: { cards: card.cards, skills: skill.skills, synergy }, group, img }))
      .catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}
/* 옛 판(두 줄 세 칸, 혼자 하던 판)은 이어 받지 않는다 — 새 판부터 */
function load() { try { const j = JSON.parse(localStorage.getItem(STORE)); return j && j.v === A.VERSION && j.board ? j : null; } catch { return null; } }
function save(st) { try { localStorage.setItem(STORE, JSON.stringify(st)); } catch {} }
function seed() { return (Date.now() ^ Math.floor(Math.random() * 1e9)) | 0; }

/* 카드 그림 — 있으면 깔고 없으면 이름만. 3성이면 각성 그림, 저주면 저주 그림.
   고른 스킨이 있으면 스킨의 상태 그림, 없으면 스킨 기본에 효과(.skin-fx)를 덮는다 */
function Art({ img, name, star, cursed }) {
  const art = IMG.dressOf(img[name], name, V, star || 1, !!cursed), file = art.file;
  const fx = art.fx && (cursed ? 'cursed' : star >= 3 ? 'awaken' : '');
  return file ? html`<img src=${IMG.thumbURL(file)} alt="" loading="lazy" class=${fx ? 'skin-' + fx : undefined} data-skin=${art.skin || undefined}
    onError=${e => { const t = e.currentTarget; if (t.dataset.f) return; t.dataset.f = '1'; t.src = IMG.imgURL(file); }} />${fx ? html`<i class=${'skin-fx ' + fx}></i>` : ''}` : null;
}
/* 터지는 조각 — 치명타는 금빛 불똥, 쓰러지면 파편. 그림 없이 작은 조각을 둥글게 흩뿌린다 */
function Burst({ kind, n }) {
  return html`<span class=${'at-bits ' + kind} aria-hidden="true">${Array.from({ length: n }, (_, i) => html`<i key=${i}
    style=${'--a:' + Math.round(i * 360 / n + (i % 2) * 17) + 'deg;--r:' + (kind === 'shard' ? 46 + (i * 13) % 26 : 30 + (i * 11) % 18) + 'px;--s:' + (0.75 + (i % 3) * 0.2)}></i>`)}</span>`;
}
function Stars({ n }) { return html`<span class="st">${W('auto.star').repeat(n)}</span>`; }

function Cell({ unit, index, zone, color, img, picked, target, onClick, side, hp, skills }) {
  if (!unit) return html`<button class=${'at-cell empty' + (target ? ' target' : '')} data-index=${index} data-zone=${zone}
    onClick=${onClick} disabled=${!onClick}>${W('auto.empty')}</button>`;
  const dead = hp && !hp.alive, fx = (hp && hp.fx) || [];
  /* 번쩍임·한 걸음은 짧게(q), 떠오르는 숫자·기술 이름은 길게 */
  const q = (hp && hp.q) || 1, has = k => fx.some(f => f.k === k && f.age <= q), last = k => fx.filter(f => k.includes(f.k) && f.age <= q).pop();
  const hit = last(['hurt', 'crit', 'cover']), cast = fx.filter(f => f.k === 'cast').pop(), die = fx.filter(f => f.k === 'die').pop();
  const cls = 'at-cell' + (picked ? ' on' : '') + (side ? ' ' + side : '') + (dead ? ' dead' : '') + (hp && hp.cursed ? ' cursed' : '')
    + (hp && hp.stunned ? ' stunned' : '') + (has('act') ? ' fx-act' : '') + (hit ? ' fx-hurt' : '') + (cast ? ' fx-cast' : '')
    + (has('curse') ? ' fx-curse' : '') + (has('revive') ? ' fx-revive' : '');
  const pct = hp ? Math.round(hp.hp / hp.maxHp * 100) : 0, sh = hp && hp.shield ? Math.min(100, Math.round(hp.shield / hp.maxHp * 100)) : 0;
  return html`<button class=${cls}
    data-index=${index} data-zone=${zone} data-name=${unit.name} data-star=${unit.star} data-cursed=${hp && hp.cursed ? '1' : undefined}
    data-hp=${hp ? hp.hp : undefined} style=${'--cc:' + (color || 'var(--line)')} onClick=${onClick} disabled=${!onClick}>
    <${Art} img=${img} name=${unit.name} star=${unit.star} cursed=${hp && hp.cursed} />
    ${hit && html`<i class=${'flash' + (hit.k === 'crit' ? ' crit' : hit.k === 'cover' ? ' cover' : '')} key=${'f' + hit.i}></i>`}
    ${hit && hit.k === 'crit' && html`<${Burst} kind="spark" n=${7} key=${'s' + hit.i} />`}
    ${cast && cast.age <= q * 2.5 && html`<i class="at-burst" key=${'b' + cast.i}></i>`}
    ${die && html`<${Burst} kind="shard" n=${10} key=${'d' + die.i} />`}
    ${cast && html`<span class="at-cast" key=${'c' + cast.i}>${(skills && skills[cast.skill] && skills[cast.skill].name) || ''}</span>`}
    ${fx.filter(f => f.n).map(f => html`<span class=${'at-pop ' + f.k} key=${'n' + f.i} style=${'--dx:' + ((f.i % 3) - 1) * 22 + 'px;--dy:' + ((f.i >> 1) % 2) * 12 + 'px'}>${f.n > 0 ? '+' + f.n : f.n}</span>`)}
    <span class="nm">${unit.name}</span>
    <${Stars} n=${unit.star} />
    ${hp && html`<span class="hpbar"><u style=${'width:' + pct + '%'}></u>${sh ? html`<i style=${'width:' + sh + '%'}></i>` : ''}</span>`}
  </button>`;
}

/* 판 그리기. side=them 이면 뒷줄이 위로 가서 두 판이 마주 본다 */
function Board({ cells, side, color, img, picked, targets, onCell, hpOf, skills }) {
  const rows = side === 'them' ? [2, 1, 0] : [0, 1, 2];
  return html`<div class="at-board" data-side=${side}>
    ${rows.map(r => html`<div class="at-row" key=${r}>
      <i>${W(r === 0 ? 'auto.board.front' : r === 1 ? 'auto.board.mid' : 'auto.board.back')}</i>
      <div class="at-grid">${[0, 1, 2, 3].map(c => {
        const i = r * A.COLS + c, u = cells[i];
        return html`<${Cell} key=${i} unit=${u} index=${i} zone="board" side=${side} img=${img}
          color=${u && color(u)} picked=${picked && u && u.id === picked} target=${targets && !u}
          hp=${u && hpOf && hpOf(u)} skills=${skills} onClick=${onCell && (() => onCell(i, u))} />`;
      })}</div>
    </div>`)}
  </div>`;
}

function Synergy({ data, group, units }) {
  const syn = A.synergies(data, units);
  const rows = [];
  for (const axis of ['myth', 'kind']) for (const k of group[axis].order) {
    const s = syn[axis][k], def = data.synergy[axis][k];
    if (!s.count) continue;
    const pct = v => def.effect === 'firstcrit' ? v : +(v * 100).toFixed(1);
    rows.push({ key: axis + '.' + k, name: group[axis].name[k], color: group[axis].color[k], ...s,
      title: def.name, text: def.text.replace('{a}', pct(def.value[0])).replace('{b}', pct(def.value[1])) });
  }
  rows.sort((a, b) => b.tier - a.tier || b.count - a.count);
  if (!rows.length) return null;
  return html`<p class="sec">${W('auto.synergy')}</p>
    <ul class="at-syn-list">${rows.map(r => html`<li key=${r.key} class=${'at-syn' + (r.tier ? ' on' : '')} data-key=${r.key} data-tier=${r.tier}
      style=${'--cc:' + r.color}>
      <b><span>${r.name} · ${r.title}</span><span>${r.tier ? W('auto.synergy.on', r) : W('auto.synergy.off', r)}</span></b>
      <small>${r.text}</small></li>`)}</ul>`;
}

/* 이번 판의 신화권 — 첫 라운드에 아무것도 사기 전이면 둘에서 다섯 권까지 다시 고를 수 있다 */
function Myths({ st, data, group, act }) {
  const min = A.MYTHS_MIN, max = A.MYTHS_MAX, free = st.round === 1 && !st.board.some(Boolean) && !st.bench.some(Boolean) && !st.xpBought;
  const cur = A.liveMyths(st, data);
  const [want, setWant] = useState(cur || []);
  if (!cur) return html`<p class="sec">${W('auto.myths')}<span>${W('auto.myths.all')}</span></p>`;
  const toggle = k => setWant(w => w.includes(k) ? w.filter(x => x !== k) : w.length < max ? w.concat(k) : w);
  const changed = want.length >= min && want.length <= max && want.slice().sort().join() !== cur.slice().sort().join();
  const say = { all: group.myth.order.length, n: cur.length, min, max };
  return html`<p class="sec">${W('auto.myths')}<span class="help">${free ? W('auto.myths.note', say) : W('auto.myths.locked', say)}</span></p>
    <div class="at-myths" role="group" aria-label=${W('auto.myths')}>
      ${group.myth.order.map(k => { const on = free ? want.includes(k) : cur.includes(k); return html`<button key=${k} type="button" class=${'at-myth' + (on ? ' on' : '')}
        data-myth=${k} aria-pressed=${on} disabled=${!free} style=${'--cc:' + group.myth.color[k]} onClick=${() => toggle(k)}>${group.myth.name[k]}</button>`; })}
      ${free && html`<span class="at-myth-n">${W('auto.myths.count', { n: want.length, min, max })}</span>
        <button type="button" class="at-btn" id="at-myths-apply" disabled=${!changed} onClick=${() => act('myths', want)}>${W('auto.myths.apply')}</button>`}
    </div>`;
}

/* 카드 정보 — 별만큼 오른 세기, 기술, 저주, 이 무기가 세는 시너지(지금 판 기준) */
function CardInfo({ data, group, name, star, units, onClose, children }) {
  const c = A.cardOf(data, name);
  if (!c) return null;
  const m = A.STAR_MULT[star] || 1, sk = data.skills[c.skill] || {}, syn = A.synergies(data, units || []);
  const axis = a => { const k = c[a], d = data.synergy[a][k], s = syn[a][k];
    return html`<b>${group[a].name[k]} · ${d.name}</b> <span class=${s.tier ? 'on' : ''}>${s.tier ? W('auto.synergy.on', s) : W('auto.synergy.off', s)}</span><small>${d.text.replace('{a}', d.effect === 'firstcrit' ? d.value[0] : +(d.value[0] * 100).toFixed(1)).replace('{b}', d.effect === 'firstcrit' ? d.value[1] : +(d.value[1] * 100).toFixed(1))}</small>`; };
  return html`<div class="at-info" data-info=${name} style=${'--cc:' + group.myth.color[c.myth]}>
    <h4>${c.name}<span class="st">${W('auto.star').repeat(star)}</span><small>${group.myth.name[c.myth]} · ${group.kind.name[c.kind]} · ${W('card.cost.n', { n: c.cost })}</small>
      ${onClose && html`<button class="at-btn" id="at-info-close" onClick=${onClose}>${W('auto.scout.close')}</button>`}</h4>
    ${children}
    <dl>
      <dt>${W('card.stats')}</dt><dd>${W('card.hp')} ${Math.round(c.hp * m)} · ${W('card.atk')} ${Math.round(c.atk * m)} · ${W('card.spd')} ${W('card.spd.n', { n: c.spd })}${star > 1 ? html`<small>${W('auto.info.star', { n: star, m })}</small>` : ''}</dd>
      <dt>${W('card.range')}</dt><dd>${W('range.' + c.range)}</dd>
      <dt>${W('card.skill')}</dt><dd><b>${sk.name}</b><small>${sk.text}</small></dd>
      ${c.curse && html`<dt>${W('card.curse')}</dt><dd><b>${W('card.curse.n', { at: Math.round(c.curse.at * 100), atk: Math.round(c.curse.atk * 100), skill: Math.round(c.curse.skill * 100), bleed: Math.round(c.curse.bleed * 100) })}</b><small>${c.curse.text}</small></dd>`}
      <dt>${W('card.myth')}</dt><dd>${axis('myth')}</dd>
      <dt>${W('card.kind')}</dt><dd>${axis('kind')}</dd>
      ${c.wielder && html`<dt>${W('card.wielder')}</dt><dd>${c.wielder}${c.text ? html`<small>${c.text}</small>` : ''}</dd>`}
    </dl>
  </div>`;
}

/* 로비 — 여섯. 살아 있는 이는 체력 차례, 떨어진 이는 순위 차례. 누르면 그 판을 아래에 본다 */
const nameOf = p => p.id === 0 ? W('auto.lobby.me') : W('auto.bot.' + p.name);
function Lobby({ st, data, group, img, oppId, scout, setScout, onInfo }) {
  const list = A.players(st).slice().sort((a, b) => (b.alive - a.alive) || (a.alive ? b.hp - a.hp : a.place - b.place) || a.id - b.id);
  const color = u => group.myth.color[A.cardOf(data, u.name).myth];
  const seen = scout != null && A.playerOf(st, scout);
  const streak = p => p.streak >= 2 ? W('auto.streak.win', { n: p.streak }) : p.streak <= -2 ? W('auto.streak.lose', { n: -p.streak }) : '';
  return html`<p class="sec">${W('auto.lobby')}<span>${W('auto.lobby.note', { n: A.alivePlayers(st).length, total: A.PLAYERS })}</span></p>
    <div class="at-lobby" role="group" aria-label=${W('auto.lobby')}>${list.map(p => html`<button key=${p.id} type="button" data-player=${p.id}
      class=${'at-who' + (p.id === 0 ? ' me' : '') + (p.id === oppId ? ' opp' : '') + (!p.alive ? ' out' : '') + (p.alive && p.hp <= 30 ? ' low' : '')}
      aria-pressed=${scout === p.id} onClick=${() => setScout(scout === p.id ? null : p.id)}>
      <b>${nameOf(p)}</b>
      <span class="bar"><u style=${'width:' + p.hp + '%'}></u></span>
      <small>${p.alive ? W('auto.lobby.hp', { hp: p.hp, level: p.level }) : W('auto.lobby.out', { n: p.place })}${p.id === oppId ? ' · ' + W('auto.lobby.opp') : ''}${streak(p) ? ' · ' + streak(p) : ''}</small>
    </button>`)}</div>
    ${seen && html`<div class="at-scout" data-scout=${seen.id}>
      <p class="sec" style="margin-top:0">${W('auto.scout', { name: nameOf(seen) })}<span>${W('auto.board.cap', { n: A.onBoard(seen), cap: seen.level })}</span>
        <button class="at-btn" id="at-scout-close" style="margin-left:auto" onClick=${() => setScout(null)}>${W('auto.scout.close')}</button></p>
      <${Board} cells=${seen.board} side="them" color=${color} img=${img} onCell=${(i, u) => u && onInfo({ ...u, who: seen.id })} />
      <${Synergy} data=${data} group=${group} units=${A.boardUnits(seen)} />
    </div>`}`;
}

function Plan({ st, data, group, img, act }) {
  const [pick, setPick] = useState(null);   /* 고른 유닛 id */
  const [why, setWhy] = useState('');
  const [scout, setScout] = useState(null);
  const [info, setInfo] = useState(null);   /* 남의 무기·상점 무기 정보 {name, star, who} */
  const color = u => group.myth.color[A.cardOf(data, u.name).myth];
  const picked = pick && A.find(st, pick);
  if (pick && !picked) setPick(null);
  const cap = A.cap(st);
  const tryDo = r => { setWhy(r.ok ? '' : (r.why && W('auto.why.' + r.why) !== 'auto.why.' + r.why ? W('auto.why.' + r.why) : '')); return r.ok; };
  const onCell = zone => (i, u) => {
    if (picked) {
      if (u && u.id === pick) { setPick(null); return; }
      if (tryDo(act('move', pick, zone, i))) setPick(null);
      return;
    }
    if (u) { setPick(u.id); setInfo(null); }
  };
  const showInfo = x => { setPick(null); setInfo(x); };
  /* 정보가 볼 판 — 내 무기면 내 판, 남의 무기면 그 사람의 판으로 시너지를 센다 */
  const infoUnits = x => x && x.who != null && x.who !== 0 ? (x.who === 'enemy' ? e.units : A.boardUnits(A.playerOf(st, x.who))) : A.boardUnits(st);
  const e = st.enemy, opp = e && e.who != null ? A.playerOf(st, e.who) : null;
  const need = A.xpNeed(st.level);
  const streak = st.streak >= 2 ? W('auto.streak.win', { n: st.streak }) : st.streak <= -2 ? W('auto.streak.lose', { n: -st.streak }) : '';
  return html`
    <div class="at-strip">
      <span>${W('auto.income', { n: A.income(st.gold, st.streak) })}${streak ? ' · ' + streak : ''}</span>
      <span class="at-tools">
        <button class="at-btn" id="at-auto" title=${W('auto.autoplan.note')} onClick=${() => { act('autoplan'); setPick(null); }}>${W('auto.autoplan')}</button>
        <button class="at-btn" id="at-new" title=${W('auto.new.note')} onClick=${() => act('new')}>${W('auto.new')}</button>
      </span>
    </div>

    <${Myths} key=${st.seed + ':' + (st.myths || []).join()} st=${st} data=${data} group=${group} act=${act} />
    <${Lobby} st=${st} data=${data} group=${group} img=${img} oppId=${opp ? opp.id : null} scout=${scout} setScout=${setScout} onInfo=${showInfo} />
    ${info && info.who != null && info.who !== 'enemy' && info.who !== 'shop' && html`<${CardInfo} data=${data} group=${group} name=${info.name} star=${info.star} units=${infoUnits(info)} onClose=${() => setInfo(null)} />`}

    <p class="sec">${e.pve ? W('auto.enemy.pve') : e.ghost ? W('auto.enemy.ghost', { name: nameOf(opp) }) : W('auto.enemy.player', { name: nameOf(opp) })}
      <span>${e.pve ? W('auto.enemy.pve.note', { n: A.pveReward(st.round), myth: group.myth.name[st.pve.myth] }) : e.ghost ? W('auto.enemy.ghost.note') : W('auto.enemy.player.note', { level: opp.level, hp: opp.hp, base: A.stageDamage(st.round) })}</span></p>
    <${Board} cells=${boardCells(e.units)} side="them" color=${color} img=${img} onCell=${(i, u) => u && showInfo({ ...u, who: 'enemy' })} />
    ${info && info.who === 'enemy' && html`<${CardInfo} data=${data} group=${group} name=${info.name} star=${info.star} units=${e.units} onClose=${() => setInfo(null)} />`}

    <p class="sec">${W('auto.board')}<span>${W('auto.board.cap', { n: A.onBoard(st), cap })}</span></p>
    <${Board} cells=${st.board} side="me" color=${color} img=${img} picked=${pick} targets=${!!picked} onCell=${onCell('board')} />

    <p class="sec">${W('auto.bench')}</p>
    <div class="at-bench">${st.bench.map((u, i) => html`<${Cell} key=${i} unit=${u} index=${i} zone="bench" img=${img}
      color=${u && color(u)} picked=${picked && u && u.id === pick} target=${!!picked && !u} onClick=${() => onCell('bench')(i, u)} />`)}</div>
    ${picked ? html`<${CardInfo} data=${data} group=${group} name=${picked.unit.name} star=${picked.unit.star} units=${A.boardUnits(st)}>
        <div class="at-pick">
          <span class="help">${W('auto.pick.note')}</span>
          <button class="at-btn" id="at-sell" onClick=${() => { act('sell', pick); setPick(null); }}>${W('auto.sell', { n: A.value(A.cardOf(data, picked.unit.name), picked.unit.star) })}</button>
        </div></${CardInfo}>` : html`<p class="note help">${W('auto.bench.note')}</p>`}
    ${why && html`<p class="note" role="status">${why}</p>`}

    <${Synergy} data=${data} group=${group} units=${A.boardUnits(st)} />

    <p class="sec">${W('auto.shop')}<span class="help">${W('auto.shop.note')}</span>
      <button class="at-btn" id="at-reroll" style="margin-left:auto" disabled=${st.gold < A.REROLL} onClick=${() => act('reroll')}>${W('auto.reroll', { n: A.REROLL })}</button></p>
    <div class="at-shop">${st.shop.map((name, i) => {
      const c = name && A.cardOf(data, name);
      if (!c) return html`<div key=${i} class="at-card gone"><span class="cap">${W('auto.sold')}</span></div>`;
      const file = IMG.dressOf(img[name], name, V, 1, false).file;
      return html`<div key=${i} class="at-card" data-name=${name} style=${'--cc:' + group.myth.color[c.myth]}>
        <button type="button" class="face" data-info-slot=${i} title=${W('auto.info.open')} onClick=${() => showInfo({ name, star: 1, who: 'shop' })}>${file ? html`<img src=${IMG.thumbURL(file)} alt="" loading="lazy" />` : html`<span class="ph">${W('art.none')}</span>`}</button>
        <span class="cap">${c.name}<i>${group.myth.name[c.myth]} · ${group.kind.name[c.kind]} · ${W('range.short.' + c.range)}</i><i class="left">${W('auto.shop.left', { n: st.pool[name] })}</i></span>
        <button class="buy" data-slot=${i} disabled=${st.gold < c.cost} onClick=${() => tryDo(act('buy', i))}>${W('auto.buy')} · ${W('card.cost.n', { n: c.cost })}</button>
      </div>`;
    })}</div>

    ${info && info.who === 'shop' && html`<${CardInfo} data=${data} group=${group} name=${info.name} star=1 units=${A.boardUnits(st)} onClose=${() => setInfo(null)} />`}

    <p class="note help">${W('auto.fight.note')} ${W('auto.saved')}</p>
    <div class="at-dock">
      <div class="at-strip">
      <span class="at-round">${W('auto.round', { n: st.round })}<b>${st.pve ? W('auto.round.pve') : W('auto.round.pvp')}</b></span>
      <span class="at-hp">${W('auto.hp')}<b>${st.hp}</b></span>
      <span class="at-gold">${W('auto.gold')}<b>${st.gold}</b></span>
      <span class="at-level">${W('auto.level')}<b>${st.level}</b>${need ? html`<i title=${W('auto.level.xp', { xp: st.xp, need })}><u style=${'width:' + Math.round(st.xp / need * 100) + '%'}></u></i><small>${W('auto.level.xp', { xp: st.xp, need })}</small>` : html`<small>${W('auto.level.max')}</small>`}</span>
      </div>
      <div class="at-dock-act">
        <button class="at-btn" id="at-xp" title=${W('auto.xp.note', { n: A.XP_GAIN })} disabled=${st.gold < A.XP_COST || !need} onClick=${() => tryDo(act('xp'))}>${W('auto.xp.buy', { n: A.XP_COST })}</button>
        <button class="at-btn primary" id="at-fight" onClick=${() => act('fight')}>${W('auto.fight')}</button>
      </div>
    </div>`;
}
function boardCells(list) {
  const cells = new Array(A.CELLS).fill(null);
  for (const u of list) cells[u.row * A.COLS + u.col] = { id: 't' + u.row + u.col, name: u.name, star: u.star };
  return cells;
}

/* 다시 보기 속도 — 싸움 시간 1 이 화면의 0.8초. 2배속은 이 브라우저에 남는다 */
const PLAY_SEC = 0.8, SPEED_STORE = 'myth_auto_speed', SEEN_STORE = 'myth_auto_seen';
const readSpeed = () => { try { return localStorage.getItem(SPEED_STORE) === '2' ? 2 : 1; } catch { return 1; } };
const seenKey = st => st.seed + ':' + st.result.round + ':' + st.history.length;
const wasSeen = st => { try { return sessionStorage.getItem(SEEN_STORE) === seenKey(st); } catch { return false; } };
const markSeen = st => { try { sessionStorage.setItem(SEEN_STORE, seenKey(st)); } catch {} };
const calm = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };

function Result({ st, data, group, img, act }) {
  const r = st.result, color = u => group.myth.color[A.cardOf(data, u.name).myth];
  const name = id => { const e = r.ents.find(x => x.id === id); return e ? e.name : ''; };
  const side = id => { const e = r.ents.find(x => x.id === id); return e ? e.side : ''; };
  const line = e => W('auto.log.' + e.k, { a: name(e.a), b: name(e.b), d: e.d, hp: e.hp, me: e.me, them: e.them,
    skill: e.skill && data.skills[e.skill] ? data.skills[e.skill].name : e.skill });
  const done = st.phase === 'won' || st.phase === 'lost';
  /* 마지막 쓰러짐의 파편이 보이게 끝에 반 박자를 더 돈다 */
  const end = r.beats ? r.beats + 0.5 : 0;
  /* 새 싸움이면 처음부터 돈다. 새로고침으로 다시 온 것이거나 움직임을 줄이는 설정이면 끝난 판을 바로 보인다 */
  const [t, setT] = useState(() => (wasSeen(st) || calm() || !r.log) ? end : -0.4);
  const [speed, setSpeed] = useState(readSpeed);
  const playing = t < end;
  useEffect(() => {
    if (!playing) { markSeen(st); return; }
    let raf, last = performance.now();
    const step = now => { const dt = Math.min(0.1, (now - last) / 1000); last = now;
      setT(x => Math.min(end, x + dt / PLAY_SEC * speed)); raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [playing, speed]);
  const now = A.replayAt(r, Math.max(0, t), playing ? 0.8 * speed / PLAY_SEC : -1);
  for (const e of Object.values(now)) e.q = 0.3 * speed / PLAY_SEC;
  const at = (sd, row, col) => Object.values(now).find(e => e.side === sd && e.row === row && e.col === col);
  const hpThem = u => at('them', +u.id[1], +u.id[2]);
  const hpMe = u => { const i = st.board.indexOf(u); return at('me', Math.floor(i / A.COLS), i % A.COLS); };
  const toggleSpeed = () => { const v = speed === 2 ? 1 : 2; setSpeed(v); try { localStorage.setItem(SPEED_STORE, String(v)); } catch {} };
  const alive = sd => Object.values(now).filter(e => e.side === sd && e.alive).length;
  /* 방금 치명타가 났으면 두 판이 함께 흔들린다. 번호의 홀짝으로 클래스를 바꿔 매번 다시 흔든다 */
  const crit = playing ? Object.values(now).flatMap(e => e.fx).filter(f => f.k === 'crit' && f.age <= 0.3 * speed / PLAY_SEC).pop() : null;
  const [info, setInfo] = useState(null);
  return html`
    <div class="at-strip">
      <span class="at-round">${W('auto.round', { n: r.round })}<b>${r.pve ? W('auto.round.pve') : W('auto.round.pvp')}</b></span>
      <span class="at-hp">${W('auto.hp')}<b>${playing ? st.hp + r.lost : st.hp}</b></span>
      <span class="at-gold">${W('auto.gold')}<b>${playing ? st.gold - (r.gain || 0) : st.gold}</b></span>
      <span>${W('auto.alive', { n: playing ? r.before : r.alive, total: A.PLAYERS })}</span>
    </div>
    ${playing ? html`<div class="at-play" role="status">
        <b>${W('auto.play')}</b>
        <span class="clock">${W('auto.play.left', { me: alive('me'), them: alive('them') })}</span>
        <span class="bar"><u style=${'width:' + Math.round(Math.max(0, t) / (end || 1) * 100) + '%'}></u></span>
        <button class="at-btn" id="at-speed" aria-pressed=${speed === 2} onClick=${toggleSpeed}>${W('auto.play.fast')}</button>
        <button class="at-btn" id="at-skip" onClick=${() => setT(end)}>${W('auto.play.skip')}</button>
      </div>` : html`
      <div class="at-result" data-winner=${r.winner} style=${'--cc:' + (r.winner === 'me' ? 'var(--ok)' : r.winner === 'them' ? 'var(--signal)' : 'var(--line)')}>
        <h3>${r.winner === 'me' ? (r.pve ? W('auto.result.pve', { n: r.gain }) : W('auto.result.me')) : r.winner === 'them' ? W('auto.result.them', { n: r.lost }) : W('auto.result.draw', { n: r.lost })}</h3>
        <p>${W('auto.result.beats', { n: r.beats })} · ${W('auto.result.left', r.left)}
          ${r.log && html` · <button class="at-btn" id="at-replay" style="padding:4px 12px" onClick=${() => setT(-0.4)}>${W('auto.play.again')}</button>`}</p>
      </div>
      ${(r.others || []).length ? html`<ul class="at-others">${r.others.map((o, i) => html`<li key=${i}>${o.pve
          ? html`<b>${nameOf(A.playerOf(st, o.a))}</b> ${W('auto.others.pve.' + o.winner)}`
          : html`<b>${nameOf(A.playerOf(st, o.a))}</b> ${W('auto.others.' + o.winner)} <b>${nameOf(A.playerOf(st, o.b))}</b>${o.ghost ? ' (' + W('auto.others.ghost') + ')' : ''}`}
          ${o.lostA ? html` · ${nameOf(A.playerOf(st, o.a))} −${o.lostA}` : ''}${o.lostB ? html` · ${nameOf(A.playerOf(st, o.b))} −${o.lostB}` : ''}</li>`)}</ul>` : ''}
      ${done ? html`<div class="at-end">
          <h3>${st.phase === 'won' ? W('auto.won') : W('auto.lost', { place: st.place, n: r.round })}</h3>
          <p class="note">${W('auto.end.note', { n: r.round, total: A.PLAYERS, place: st.place })}</p>
          <button class="at-btn primary" id="at-new" onClick=${() => act('new')}>${W('auto.new')}</button>
        </div>` : html`<p class="sec" style="margin-top:14px"><button class="at-btn primary" id="at-next" style="flex:1" onClick=${() => act('next')}>${W('auto.next')}</button></p>`}`}

    <div class=${'at-arena' + (crit ? ' shake' + (crit.i % 2) : '')}>
    <p class="sec">${r.pve ? W('auto.enemy.pve') : r.ghost ? W('auto.enemy.ghost', { name: nameOf(A.playerOf(st, r.opp)) }) : W('auto.enemy.player', { name: nameOf(A.playerOf(st, r.opp)) })}</p>
    <${Board} cells=${boardCells(st.enemy.units)} side="them" color=${color} img=${img} hpOf=${hpThem} skills=${data.skills} onCell=${(i, u) => u && setInfo({ ...u, side: 'them' })} />
    ${info && info.side === 'them' && html`<${CardInfo} data=${data} group=${group} name=${info.name} star=${info.star} units=${st.enemy.units} onClose=${() => setInfo(null)} />`}
    <p class="sec">${W('auto.board')}</p>
    <${Board} cells=${st.board} side="me" color=${color} img=${img} hpOf=${hpMe} skills=${data.skills} onCell=${(i, u) => u && setInfo({ ...u, side: 'me' })} />
    ${info && info.side === 'me' && html`<${CardInfo} data=${data} group=${group} name=${info.name} star=${info.star} units=${A.boardUnits(st)} onClose=${() => setInfo(null)} />`}
    </div>

    ${!playing && html`<p class="sec">${W('auto.log')}<span>${r.log.length}</span></p>
    <ul class="at-log">${r.log.map((e, i) => html`<li key=${i} class=${side(e.a || e.b)}><b>${e.t}</b> ${line(e)}</li>`)}</ul>`}`;
}

function App() {
  const loaded = useData();
  const [st, setSt] = useState(load);
  useEffect(() => { if (loaded && loaded.data && !st) setSt(A.newGame(loaded.data, seed())); }, [loaded]);
  if (!loaded) return html`<${Shell}><p class="empty">${W('ui.loading')}</p><//>`;
  if (loaded.error) return html`<${Shell}><p class="empty">${W('ui.error', { message: loaded.error })}</p><//>`;
  if (!st) return html`<${Shell}><p class="empty">${W('ui.loading')}</p><//>`;
  const { data, group, img } = loaded;
  const act = (what, ...args) => {
    let r = { ok: true };
    const next = what === 'new' ? A.newGame(data, seed()) : JSON.parse(JSON.stringify(st));
    if (what === 'buy') r = A.buy(next, data, args[0]);
    if (what === 'sell') r = A.sell(next, data, args[0]);
    if (what === 'reroll') r = A.reroll(next, data);
    if (what === 'xp') r = A.buyXp(next, data);
    if (what === 'move') r = A.move(next, args[0], args[1], args[2]);
    if (what === 'fight') r = A.fight(next, data);
    if (what === 'next') r = A.next(next, data);
    if (what === 'autoplan') A.autoPlan(next, data);
    if (what === 'myths') r = A.setMyths(next, data, args[0]);
    if (r.ok) { save(next); setSt(next); }
    return r;
  };
  return html`<${Shell}>
    ${st.phase === 'plan'
      ? html`<${Plan} key=${'p' + st.round} st=${st} data=${data} group=${group} img=${img} act=${act} />`
      : html`<${Result} st=${st} data=${data} group=${group} img=${img} act=${act} />`}
  <//>`;
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

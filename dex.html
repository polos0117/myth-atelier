<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>신화 무기 공방</title>
<!--
  도감. 무기 한 자루 = 카드 한 장 = 그림 한 장. 폼도 시트도 없다.
  각성 그림이 있으면 3성일 때 그것으로 바뀐다 — 도감에서는 단추로 견준다.

  화면은 data/img.json 에 적힌 것만 그린다. 그림 저장소에 파일이 있어도
  tools/register-images.py 를 거치기 전에는 없는 것으로 본다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth36">
<style>
/* 색·밀도 토막은 lib/workspace.css 한 곳에 있다. 여기는 뼈대만 —
   workspace.css 의 .dex-page 규칙이 이 뼈대에 살을 붙인다. */
:root {--cc:var(--line)}
* {box-sizing:border-box}
html,body {margin:0;padding:0}
body {color:var(--text);font-size:15px}
/* 목록은 껍데기가 정한 자리(.collection-scroll)에서만 구른다. #app 도 같이
   늘어나야 main 이 제 높이를 받고 .collection-scroll 이 0 이 되지 않는다 */
.dex-page > #app {display:flex;flex-direction:column;min-height:0;height:100%}
.dex-page > #app > main {flex:1 1 auto;min-height:0}
.collection-scroll {display:block}
.dex-page .collection-scroll {padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.grid {display:grid;gap:var(--gap)}
.dex-page .grid {grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
/* 칸은 위에서부터 쌓는다 — 버튼은 내용을 세로 가운데에 두어, 같은 줄에 긴 이름이 있으면
   짧은 이름 칸의 그림과 글이 통째로 내려가 줄이 어긋났다. 이름 자리는 늘 두 줄로 잡는다 */
.cell {display:flex;flex-direction:column;justify-content:flex-start;width:100%;padding:0;text-align:left;color:inherit;font:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.face {display:block;flex:none;position:relative;width:100%;aspect-ratio:2/3;background:var(--card2);overflow:hidden}
.face img {display:block;width:100%;height:100%;object-fit:contain;object-position:center top}
.ph {display:flex;align-items:center;justify-content:center;height:100%;padding:6px;
  color:var(--muted);font:10px/1.4 ui-monospace,monospace;letter-spacing:.06em;text-align:center}
.cap {display:block;flex:1;font-weight:700;overflow-wrap:anywhere}
.cap .cnm {display:block;min-height:2.8em;max-height:2.8em;overflow:hidden;word-break:keep-all}
.cap i {display:block;margin-top:3px;font:400 11px ui-monospace,monospace;font-style:normal;color:var(--muted)}
.cap .cost {float:right;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 10px ui-monospace,monospace}
.search-row {display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.dex-museum {display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;text-decoration:none;border-color:var(--gold);color:var(--gold)}
.dex-museum::before {content:'🏛';font-size:13px}
@media (max-width:479px) {.search-row {grid-template-columns:1fr 1fr} .search-row input {grid-column:1/-1}}
.search-row input {width:100%;background:var(--card);border:1px solid var(--line);
  color:var(--text);font:inherit;border-radius:8px;padding:9px 11px;min-width:0}
.search-row input::placeholder {color:var(--muted)}
.dex-reset {background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:12px;min-height:40px}
.dex-view-row {display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.dex-view-row .dex-reset {white-space:nowrap}
.dex-view-row .sec {margin:0;flex-wrap:wrap;min-width:0}
.dex-view-row button {flex-shrink:0;min-height:44px}
.dex-view-row button[aria-pressed="true"] {border-color:var(--accent);color:var(--accent)}
.dex-filters {margin:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px}
.dex-filters summary {cursor:pointer;display:flex;align-items:center;min-height:44px;font-weight:700;font-size:13px}
.dex-filter-grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.dex-filter-grid label {display:grid;gap:5px;min-width:0;color:var(--muted);font-size:12px}
.dex-filter-grid select {width:100%;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);padding:6px;font:inherit}
@media(min-width:720px){.dex-filter-grid {grid-template-columns:repeat(6,minmax(0,1fr))}}
.sw {display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px}
.sw button {flex:1 1 auto;background:var(--card);border:0;border-radius:6px;color:var(--muted);
  font:inherit;font-weight:700;font-size:12px;min-height:40px;padding:6px 10px}
.sw button.on {background:var(--accent-soft);color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.sw button:disabled {opacity:.45}
/* 화풍 고르개 — 열넷을 단추로 늘어놓으면 글자 벽이다. 셀렉트 하나와, 본문에 썸네일 줄 */
.style-pick {display:grid;gap:5px;padding:0 0 8px;font-size:12px;color:var(--muted)}
.style-pick select {width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);font:inherit;font-size:13px}
.style-strip {display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding:2px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.style-cell {flex:0 0 108px;width:108px;padding:0;overflow:hidden;text-align:center;background:var(--card2);color:var(--muted);border:1px solid var(--line);border-radius:10px;font:inherit;scroll-snap-align:start}
.style-cell .face {max-height:150px}
.style-cell.on {border-color:var(--accent);color:var(--text);box-shadow:inset 0 -3px var(--accent)}
.style-cell b {display:block;padding:6px 4px 7px;font-size:11px;line-height:1.3;overflow-wrap:anywhere}
.sec {margin:18px 0 8px;font:700 12px/1.6 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.sec span {color:var(--muted);font-weight:400;letter-spacing:0;margin-left:8px}
.note {margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
.bar {display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.bar h2 {flex:1 1 auto;margin:0;font-size:19px;letter-spacing:-.02em;overflow-wrap:anywhere}
.bar h2 small {display:block;font:400 11px ui-monospace,monospace;color:var(--muted);letter-spacing:.06em}
.bar .n {flex:none;font:700 11px ui-monospace,monospace;color:var(--accent);white-space:nowrap}
.back {flex:none;min-height:40px;padding:8px 12px;background:var(--card2);color:var(--text);
  border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;font-weight:700}
/* 2:3 을 그대로 두면 한 장이 화면을 다 먹는다. 화면 높이의 절반 아래로 묶고 contain 으로 담는다 */
.big {position:relative;width:100%;aspect-ratio:2/3;max-height:46dvh;overflow:hidden;
  background:var(--card2);border:1px solid var(--line);border-radius:12px}
.big img {display:block;width:100%;height:100%;object-fit:contain}
.big .ph {font-size:12px}
.facts {display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;
  margin:0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.facts dt {margin:0;color:var(--muted);font-size:11px;white-space:nowrap;align-self:center}
.facts dd {margin:0;font-size:13px;overflow-wrap:anywhere}
.facts dd b {font-weight:700}
.facts dd small {display:block;color:var(--muted);font-size:12px;line-height:1.5}
/* 세기 — 숫자만 늘어놓으면 어느 쪽이 높은지 안 읽힌다. 막대를 같이 둔다 */
.bars {display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 8px;align-items:center;
  margin:0;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.bars span {color:var(--muted);font-size:11px;white-space:nowrap}
.bars i {display:block;height:7px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bars i u {display:block;height:100%;background:var(--accent);text-decoration:none}
.bars b {font:700 12px ui-monospace,monospace;text-align:right;min-width:3ch}
.tag {display:inline-block;margin-right:6px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--cc);color:var(--text);font:700 11px ui-monospace,monospace;vertical-align:middle}
.gal {display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.gal img {display:block;width:100%;border:1px solid var(--line);border-radius:8px}
.gal .cell.skin {display:flex;flex-direction:column;gap:4px;text-align:left}
.gal .cell.skin .cap {font-size:11px;font-weight:700;color:var(--muted)}
.gal .cell.skin.worn img {border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 14px var(--halo)}
.gal .cell.skin.worn .cap {color:var(--gold)}
.gal .cell.skin.locked img {filter:grayscale(.85) brightness(.7)}
.gal .cell.skin.locked .cap {color:var(--muted)}
.skin-state {margin-top:8px}
.hall-toggle {margin-top:8px;align-items:center}
.hall-toggle .hall-n {padding:0 10px;font:700 11px ui-monospace,monospace;color:var(--muted)}
.dex-hall {display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto;font:700 11px ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.cell.hall-on .face::after {content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px var(--gold);pointer-events:none}
.hall-mark {position:absolute;right:6px;top:6px;padding:2px 7px;border-radius:4px;background:var(--gold);color:var(--on-accent);font:700 10px var(--display)}
.skin-wear {margin-top:8px}
.empty {padding:36px 0;text-align:center;color:var(--muted);font-size:13px}
/* 크게 보기 — 큰 그림을 누르면 화면을 덮는다. 원본을 contain 으로, 좌우 화살표로 같은 화풍의 다른 컷 */
.big button.zoom {display:block;width:100%;height:100%;padding:0;border:0;background:transparent;cursor:zoom-in}
.zoom-layer {position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#0b0d12f2;color:#fff}
.zoom-layer .zoom-bar {display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;font:12px ui-monospace,monospace;letter-spacing:.06em}
.zoom-layer .zoom-bar b {flex:1 1 auto;font-weight:600;overflow-wrap:anywhere}
.zoom-layer .zoom-bar button,.zoom-layer .zoom-bar .zoom-open,.zoom-layer .zoom-nav button {display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 12px;border:1px solid #ffffff40;border-radius:10px;background:#ffffff14;color:#fff;font:inherit;font-size:13px;text-decoration:none;cursor:pointer;white-space:nowrap}
.zoom-layer .zoom-bar .zoom-open:hover,.zoom-layer .zoom-bar button:hover {background:#ffffff2a}
.zoom-layer .zoom-body {flex:1 1 auto;min-height:0;position:relative;display:grid;place-items:center;padding:0 8px 8px}
.zoom-layer .zoom-body img {max-width:100%;max-height:100%;object-fit:contain;display:block;cursor:zoom-out}
.zoom-layer .zoom-nav {position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 6px;pointer-events:none}
.zoom-layer .zoom-nav button {pointer-events:auto;opacity:.85}
.zoom-layer .zoom-nav button:disabled {opacity:.2}
/* 큰 그림 넘기기 — 덮개를 안 열어도 좌우 화살표·방향키·밀기로 같은 줄의 컷을 넘긴다. 세로 굴림은 그대로(pan-y) */
.big,.zoom-layer .zoom-body {touch-action:pan-y;user-select:none;-webkit-user-select:none}
.big img,.zoom-layer .zoom-body img {-webkit-user-drag:none}
.big-nav {position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 4px;pointer-events:none}
.big-nav button {pointer-events:auto;display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0;border:1px solid #ffffff40;border-radius:999px;background:#0009;color:#fff;font:400 22px/1 var(--display);cursor:pointer}
.big-nav button:disabled {opacity:.2;cursor:default}
.big-nav button.to-card {border-color:var(--gold);color:var(--gold)}
/* 무기 넘기기 — 큰 그림 바로 아래 한 줄: ‹ 앞 무기 이름 · 무기 몇 / 전체 · 다음 무기 이름 ›.
   머리는 굴러가지 않는 자리라 거기 두면 휴대폰에서 그림 자리가 줄어든다(긴 이름은 두 배로 높아졌다) */
.card-nav {display:flex;align-items:center;gap:8px;margin-top:8px}
.card-nav button {flex:1 1 0;min-width:0;min-height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);font:700 12px var(--display);cursor:pointer}
.card-nav button span {min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis} .card-nav button b {flex:none;font:400 18px/1 var(--display)}
.card-nav #dex-card-next {justify-content:flex-end}
.card-nav button:disabled {opacity:.35;cursor:default}
.card-nav .card-count {flex:none;font:700 11px ui-monospace,monospace;color:var(--muted);white-space:nowrap}
.big-count {position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:999px;background:#000a;color:#fff;font:700 11px ui-monospace,monospace;pointer-events:none}
/* 최근 추가 — 새로 들어온 그림 줄. 제 안에서만 가로로 구른다(페이지는 넘치지 않는다) */
.dex-recent {min-width:0;margin:0 0 6px}
.dex-recent .sec {margin-top:0}
.recent-strip {display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding:4px 4px 12px;scrollbar-width:thin;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.recent-cell {flex:0 0 92px;width:92px;display:flex;flex-direction:column;min-height:44px;padding:0;text-align:left;background:transparent;color:var(--text);border:0;border-radius:3px;font:inherit;cursor:pointer;scroll-snap-align:start}
.recent-cell .face {border-radius:3px}
.recent-cell:hover .face {outline:1px solid var(--accent);outline-offset:2px}
.dex-page .recent-cell:focus-visible {outline-offset:1px}
.recent-cell b {display:block;padding:7px 0 0;font:600 12px/1.45 var(--gallery-serif);overflow-wrap:anywhere;word-break:keep-all}
.recent-cell i {display:block;font:400 11px/1.5 var(--face);font-style:normal;color:var(--muted)}
/* 새 — 지난번 다녀간 뒤에 들어온 그림. 이 브라우저에만 남는다 */
.new-mark {position:absolute;left:6px;top:6px;padding:2px 7px;border-radius:4px;background:var(--accent);color:var(--on-accent);font:700 10px/1.4 var(--display);pointer-events:none}
.sw .new-mark {position:static;display:inline-block;margin-left:6px;vertical-align:1px}
.gal .cell {position:relative}
.dex-view-tools {display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
/* 움직임(lib/scene-motion.js) — 각성 그림 위에 옅게 떠도는 입자 칸. 넘기기 화살표 아래에 깔린다 */
.big-motion {position:absolute;inset:0;pointer-events:none}
.motion-toggle {margin-top:8px}
/* 즐겨찾기 — 신전 단추 위의 하트(지금 보이는 그림 한 장), 담은 수는 공방 모음으로 가는 작은 링크 */
.fav-toggle {margin-top:8px;align-items:center}
.dex-page .fav-toggle button {min-height:44px}
.fav-toggle button span {font-size:15px;line-height:1;margin-right:5px}
.fav-toggle .fav-count {display:inline-flex;align-items:center;min-height:44px;padding:0 10px;color:var(--muted);font:700 11px ui-monospace,monospace;text-decoration:none}
.fav-toggle .fav-count:hover {color:var(--text)}
.fav-toggle button:focus-visible,.fav-toggle .fav-count:focus-visible {outline:2px solid var(--gold);outline-offset:2px}
.fav-toast {position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;max-width:calc(100vw - 32px);padding:9px 16px;border-radius:999px;background:var(--text);color:var(--bg);font:700 13px/1.35 var(--display);text-align:center;pointer-events:none}
.fav-toast:empty {display:none}
/* 도트 — 상세의 작은 무대(바닥 위를 거닌다, 누르면 반응), 목록 칸의 「도트」 표(「새」·「모심」은 왼쪽이라 오른쪽 아래) */
.dex-dot {margin:14px 0 6px}.dex-dot[hidden] {display:none}
.dex-dot-stage {position:relative;height:150px;overflow:hidden;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,var(--card) 0,var(--card) 74%,color-mix(in srgb,var(--gold) 22%,var(--card)) 74%,var(--card) 100%)}
.dot-badge {position:absolute;right:5px;bottom:5px;z-index:2;padding:2px 7px;border-radius:999px;background:#120f16d9;color:var(--gold);font:800 10px/1.4 var(--display);letter-spacing:.04em;pointer-events:none}
</style>

<body class="dex-page">
<div id="app"></div>
<script type="module">
/* Fragment 는 h 에 안 붙어 있다. h.Fragment 로 부르면 preact 가 진짜 태그를 만들어
   격자(.facts) 칸을 하나 잡아먹는다. 따로 들여온다 */
import { h, render, Fragment } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useLayoutEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader, UndoToast } from './lib/workspace-ui.js?v=myth15';
import { modalFocus } from './lib/gallery.js?v=1';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, MOTION = window.AtelierMotion;
const FILTER_STORE = 'myth_dex_filters_v1', COMPACT_STORE = 'myth_dex_compact_v1';
/* 지금 만드는 것은 여성체뿐이다. 파일 이름에는 _f 를 적어 두므로 나중에 m 을 더해도 옛 파일의 뜻이 안 바뀐다 */
const V = 'f';
const MAX = { hp: 1300, atk: 105 };   /* 막대의 꽉 찬 값. 카탈로그에서 가장 큰 값이다 */

/* 들어온 날 — img.json 의 added {파일 이름: "YYYY-MM-DD"}(tools/register-images.py 가 적는다). 날짜가 없는 파일은 줄에도 표시에도 안 든다.
   최근 추가는 오늘까지 RECENT_DAYS 일 안에 든 그림, 새것부터 RECENT_MAX 장.
   새 표시 — 이 브라우저가 지난번에 다녀간 때 본 자료의 가장 늦은 날짜(d)와 그날 이미 있던 파일(seen)을 적어 두고,
   그 뒤에 든 것(d 보다 늦거나, d 날인데 seen 에 없는 것)에 붙인다. 시계가 아니라 자료의 날짜끼리 견주므로 시간대가 달라도 안 어긋난다.
   처음 오면 견줄 것이 없어 표시가 없다. 적기는 떠날 때(pagehide·숨김) — 머무는 동안은 표시가 그대로다 */
const SEEN_STORE = 'myth_dex_seen_v1', RECENT_DAYS = 7, RECENT_MAX = 24;
function dayOf(t) { const d = new Date(t), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function readSeen() {
  try { const j = JSON.parse(localStorage.getItem(SEEN_STORE)); return j && typeof j.d === 'string' ? { d: j.d, seen: new Set(Array.isArray(j.seen) ? j.seen : []) } : null; }
  catch { return null; }
}
function writeSeen(added) {
  const d = Object.values(added).reduce((a, b) => (b > a ? b : a), '');
  try { localStorage.setItem(SEEN_STORE, JSON.stringify({ at: Date.now(), d, seen: Object.keys(added).filter(f => added[f] === d) })); } catch {}
}
/* 한 카드의 그림 전부를 도감 상세가 여는 꼴로 — 화풍마다 액션 → 각성 → 저주 → 특별 → 일상 → 스킨 */
function cardShots(c, entry) {
  const out = [];
  for (const style of IMG.styleKeys(entry || {})) {
    const b = IMG.styleMap(entry)[style] || {}, sk = IMG.skinsOf(b, V), a = IMG.awakenOf(b, V), cu = IMG.cursedOf(b, V);
    if (b[V]) out.push({ file: b[V], style, cut: 'portrait' });
    if (a) out.push({ file: a, style, cut: 'awaken' });
    if (cu) out.push({ file: cu, style, cut: 'cursed' });
    IMG.cuts(b, 'extra', V).forEach((file, i) => out.push({ file, style, cut: 'extra', index: i + 1 }));
    IMG.cuts(b, 'casual', V).forEach((file, i) => out.push({ file, style, cut: 'casual', index: i + 1 }));
    for (const k of c.skins || []) for (const state of ['base', 'awaken', 'cursed'])
      if (sk[k.key] && sk[k.key][state]) out.push({ file: sk[k.key][state], style, cut: 'skin', key: k.key, name: k.name, state });
  }
  return out;
}
function useFresh(st) {
  const [prev] = useState(readSeen);
  const added = st.added;
  useEffect(() => {
    if (!added) return;
    const save = () => writeSeen(added), hide = () => { if (document.visibilityState === 'hidden') save(); };
    addEventListener('pagehide', save); document.addEventListener('visibilitychange', hide);
    return () => { removeEventListener('pagehide', save); document.removeEventListener('visibilitychange', hide); };
  }, [added]);
  return useMemo(() => {
    if (!st.cards) return { recent: [], cards: new Set(), isNew: () => false };
    const isNew = f => { const d = f && added[f]; return !!(prev && d && (d > prev.d || (d === prev.d && !prev.seen.has(f)))); };
    const since = (() => { const t = new Date(); t.setDate(t.getDate() - (RECENT_DAYS - 1)); return dayOf(t); })();
    const recent = sorted(st.cards, st.group).flatMap(c => cardShots(c, st.img[c.name]).map(s => ({ ...s, card: c, day: added[s.file] })))
      .filter(s => s.day && s.day >= since)
      .sort((a, b) => (a.day < b.day ? 1 : a.day > b.day ? -1 : 0))
      .slice(0, RECENT_MAX);
    const cards = new Set(prev ? st.cards.filter(c => IMG.allShotsOf(st.img[c.name]).some(isNew)).map(c => c.name) : []);
    return { recent, cards, isNew };
  }, [st, prev]);
}
const NewMark = () => html`<span class="new-mark">${W('dex.new')}</span>`;
function whenOf(day) { const [, m, d] = day.split('-').map(Number); return W('dex.recent.when', { m, d }); }

/* 썸네일을 먼저 걸고 없으면 원본으로 되돌아간다 */
function Pic({ file, full, alt }) {
  const [failed, setFailed] = useState(false), image = useRef();
  useLayoutEffect(() => { setFailed(false); if (image.current) delete image.current.dataset.fallback; }, [file]);
  if (failed) return html`<span class="image-status" role="status">${W('gallery.image.error')}</span>`;
  return html`<img ref=${image} width="800" height="1200" decoding="async" loading=${full ? 'eager' : 'lazy'} alt=${alt || ''}
    src=${full ? IMG.imgURL(file) : IMG.thumbURL(file)}
    onError=${e => {
      const t = e.currentTarget;
      if (full || t.dataset.fallback) { setFailed(true); return; }
      t.dataset.fallback = '1';
      t.src = IMG.imgURL(file);
    }} />`;
}

/* 껍데기. lib/workspace.css 의 .dex-page 규칙이 화면을 100dvh 로 잠그고
   .collection-scroll 한 곳만 구르게 한다. 굴리면 main 에 dex-scrolled 가 붙어 검색 도구만 간결해진다 */
function Shell({ head, children }) {

    <${WorkspaceHeader} page="dex" />

function useDex() {
  const [state, set] = useState({ loading: true });
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    /* 움직임 입자 표는 없어도 도감이 선다 — 그때는 입자 없이 켄 번스·넘기기만 */
    Promise.all([get('data/card.json'), get('data/style.json'), get(IMG.DATA), get('data/group.json'), get('data/skill.json'), get('data/motion.json').catch(() => null)])
      .then(([card, style, imgDoc, group, skill, motion]) => {
        const styleName = {};
        for (const r of style.styles || []) styleName[r.key] = r.name;
        set({ cards: card.cards || [], styleName, img: (imgDoc && imgDoc.img) || {}, added: (imgDoc && imgDoc.added) || {}, group, skill: skill.skills || {}, motion: motion || {} });
      }).catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}

const DEFAULTS = { q: '', myth: '', kind: '', cost: '', style: '', art: 'any', skin: 'any' };
/* 신기 결투에서 이 무기로 이긴 적이 있나 — 결투의 stats.cards 열쇠는 카드 id(이름 또는 이름@판) */
function wonInDuel(name) {
  try { const j = JSON.parse(localStorage.getItem('myth_duel_v1')), cards = (j && j.profile && j.profile.stats && j.profile.stats.cards) || {};
    return Object.keys(cards).some(k => (k === name || k.indexOf(name + '@') === 0) && cards[k].won > 0); } catch (e) { return false; }
}
function normalize(f) {
  const out = { ...DEFAULTS };
  for (const k of Object.keys(DEFAULTS)) if (f && typeof f[k] === 'string') out[k] = f[k];
  return out;
}
/* 주소 — 거르기(기본값이 아닌 것만)와 보고 있는 무기(?card=)가 주소에 실린다. 주소를 나누거나 새로 고쳐도 같은 화면이다.
   주소에 거르기가 있으면 그것이 이 브라우저에 남은 거르기보다 앞선다 */
const URL_KEYS = Object.keys(DEFAULTS);
function readURL() {
  try {
    const q = new URLSearchParams(location.search), has = URL_KEYS.filter(k => q.has(k));
    return { card: q.get('card'), filters: has.length ? normalize(Object.fromEntries(has.map(k => [k, q.get(k)]))) : null };
  } catch { return { card: null, filters: null }; }
}
function urlOf(filters, card) {
  const q = new URLSearchParams(), f = normalize(filters);
  for (const k of URL_KEYS) if (f[k] !== DEFAULTS[k]) q.set(k, f[k]);
  if (card) q.set('card', card);
  const s = q.toString();
  return location.pathname + (s ? '?' + s : '') + location.hash;
}
/* 목록 차례: 신화권 차례 → 값 높은 것 → 이름. 시너지 축이 눈에 먼저 들어오게 */
function sorted(cards, group) {
  const order = group.myth.order || [];
  return cards.slice().sort((a, b) => (order.indexOf(a.myth) - order.indexOf(b.myth)) || (b.cost - a.cost) || a.name.localeCompare(b.name, 'ko'));
}
/* only — 새 그림만(Set). 이 방문 동안만 쓰는 거르기라 주소·저장에 안 남는다 */
function select(st, f, only) {
  const q = f.q.trim().toLowerCase();
  return sorted(st.cards, st.group).filter(c => {
    if (only && !only.has(c.name)) return false;
    if (f.myth && st.group.myth.order.includes(f.myth) && c.myth !== f.myth) return false;   /* 옛 열쇠(east)는 거르지 않는다 */
    if (f.kind && c.kind !== f.kind) return false;
    if (f.cost && String(c.cost) !== f.cost) return false;
    const entry = st.img[c.name];
    const file = IMG.portraitOf(entry, V, f.style || undefined);
    const has = f.style ? !!(IMG.styleMap(entry)[f.style] && IMG.styleMap(entry)[f.style][V]) : !!file;
    if (f.art === 'yes' && !has) return false;
    if (f.art === 'no' && has) return false;
    /* 스킨 — 카드 자료에 스킨이 있는 것, 그중 스킨 그림까지 있는 것 */
    if (f.skin === 'yes' && !(c.skins || []).length) return false;
    if (f.skin === 'art' && !(c.skins || []).some(k => IMG.skinSets(entry || {}, V)[k.key])) return false;
    if (q && !(c.name.toLowerCase().includes(q) || (c.en || '').toLowerCase().includes(q) || (c.wielder || '').toLowerCase().includes(q) || (c.skins || []).some(k => k.name.toLowerCase().includes(q)))) return false;
    return true;
  });
}

/* 즐겨찾기 — 목록은 다른 탭(공방 모음)에서 빼도 따라온다. 알림 자리는 늘 깔아 둔다(화면 읽기 프로그램이 새로 생긴 칸의 말을 놓치기 쉽다) */
const FAV = window.AtelierFavorites, FAV_HUB = '/favorites.html';
function useFavorites() {

  useEffect(() => (FAV ? FAV.onChange(setList) : undefined), []);
  return list;
}
/* 도트 자료 — 한 번만 받는다(목록 표). 상세의 무대는 AtelierSprite.mount 가 같은 자료로 */
const SP = window.AtelierSprite;
function useSprites() {
  const [sp, setSp] = useState(null);
  useEffect(() => { let live = true; SP && SP.load('data/sprites.json').then(d => { if (live && d && d.actors) setSp(d); }, () => {}); return () => { live = false; }; }, []);
  return sp;
}
/* 도트 — 이 무기의 도트가 있으면 작은 무대 한 줄(거닐고, 누르면 반응). 없거나 그림을 못 받으면 아무것도 없다 */
function DotRow({ card }) {
  const box = useRef(null), [on, setOn] = useState(false);
  useEffect(() => {
    if (!SP || !box.current) return;
    let live = true, a = null;
    SP.mount(box.current, card.name, { label: W('dex.dot.actor', { name: card.name }) }).then(x => { if (!live) { if (x) x.destroy(); return; } a = x; setOn(!!x); });
    return () => { live = false; if (a) a.destroy(); setOn(false); };
  }, [card.name]);
  return html`<section class="dex-dot" hidden=${!on} data-card=${card.name} aria-labelledby="dex-dot-title">
    <p class="sec" id="dex-dot-title">${W('dex.dot.title')}<span>${W('dex.dot.note')}</span></p>
    <div class="dex-dot-stage" ref=${box}></div></section>`;
}
function useNote() {
  const [msg, setMsg] = useState(''), t = useRef(0);
  useEffect(() => () => clearTimeout(t.current), []);
  return [msg, s => { setMsg(s); clearTimeout(t.current); t.current = setTimeout(() => setMsg(''), 2000); }];
}

function Facts({ card, group, skill }) {
  const sk = skill[card.skill] || { name: card.skill, text: '' };
  const rows = [
    [W('card.myth'), html`<span class="tag" style=${'--cc:' + (group.myth.color[card.myth] || 'var(--line)')}>${group.myth.name[card.myth] || card.myth}</span>`],
    [W('card.kind'), html`<span class="tag" style=${'--cc:' + (group.kind.color[card.kind] || 'var(--line)')}>${group.kind.name[card.kind] || card.kind}</span>`],
    [W('card.cost'), html`<b>${W('card.cost.n', { n: card.cost })}</b>`],
    [W('card.range'), W('range.' + card.range)],
    [W('card.skill'), html`<b>${sk.name}</b><small>${sk.text}</small>`],
    card.curse && [W('card.curse'), html`<b>${W('card.curse.n', { at: Math.round(card.curse.at * 100), atk: Math.round(card.curse.atk * 100), skill: Math.round(card.curse.skill * 100), bleed: Math.round(card.curse.bleed * 100) })}</b><small>${card.curse.text}</small><small>${W('card.curse.note')}</small>`],
    card.wielder && [W('card.wielder'), card.wielder],
    card.text && [W('card.text'), card.text],
  ].filter(Boolean);
  const bars = [['hp', card.hp, MAX.hp], ['atk', card.atk, MAX.atk]];
  return html`
    <dl class="facts">
      ${rows.map(([k, v]) => html`<${Fragment} key=${k}><dt>${k}</dt><dd>${v}</dd><//>`)}
    </dl>
    <p class="sec">${W('card.stats')}</p>
    <div class="bars" role="group" aria-label=${W('card.stats')}>
      ${bars.map(([k, n, max]) => html`<${Fragment} key=${k}>
        <span>${W('card.' + k)}</span>
        <i><u style=${'width:' + Math.round(n / max * 100) + '%'}></u></i>
        <b>${n}</b><//>`)}
      <span>${W('card.spd')}</span>
      <i><u style=${'width:' + Math.round((1 - (card.spd - 0.5) / 1.0) * 100) + '%'}></u></i>
      <b>${W('card.spd.n', { n: card.spd })}</b>
    </div>`;
}

function Detail({ card, entry, styleName, group, skill, motion: motionTable, selection, nav, onGo, onClose, isNew }) {
  const keys = IMG.styleKeys(entry || {});
  const [wantStyle, setStyle] = useState(selection?.style || '');
  /* 처음 열 때는 상태 그림(각성·저주·일상)이 가장 많은 화풍을 고른다. 같으면 앞의 것 */
  const richest = keys.slice().sort((a, b) => IMG.shotsOf(IMG.styleMap(entry)[b], V).length - IMG.shotsOf(IMG.styleMap(entry)[a], V).length || keys.indexOf(a) - keys.indexOf(b))[0];
  const style = keys.indexOf(wantStyle) >= 0 ? wantStyle : (richest || '');
  const bucket = (style && IMG.styleMap(entry)[style]) || {};
  const portrait = bucket[V] || null, awaken = IMG.awakenOf(bucket, V), cursed = IMG.cursedOf(bucket, V);
  const casual = IMG.cuts(bucket, 'casual', V), extra = IMG.cuts(bucket, 'extra', V);
  /* 스킨 — 화풍을 가리지 않는다. 이름은 카드 자료에서, 기본 그림이 있는 것만. 각성·저주는 있으면 */
  const skinSet = IMG.skinSets(entry || {}, V);
  const skins = (card.skins || []).filter(k => skinSet[k.key]).map(k => ({ file: skinSet[k.key].base, cut: 'skin', key: k.key, name: k.name, state: 'base' }));
  const skinShots = skins.flatMap(k => [k].concat(['awaken', 'cursed'].filter(x => skinSet[k.key][x]).map(x => ({ ...k, file: skinSet[k.key][x], state: x }))));
  const [worn, setWorn] = useState(() => IMG.skinPick(card.name));
  /* 스킨 해금 — 신기 결투에서 이 무기(기본·각성·저주판 어느 것이든)로 이긴 적이 있어야 입는다. 결투의 저장(myth_duel_v1)을 읽을 뿐 여기서 고치진 않는다 */
  const unlocked = wonInDuel(card.name);
  const [hall, setHall] = useState(() => IMG.hallPicks());
  const inHall = hall.includes(card.name), hallFull = !inHall && hall.length >= IMG.HALL_MAX, temple = W('theme.' + IMG.hallTheme());
  const enshrine = () => { IMG.toggleHall(card.name); setHall(IMG.hallPicks()); };
  const wear = key => { if (!unlocked && key) return; IMG.setSkinPick(card.name, key); setWorn(key); };
  /* 크게 보기 — 같은 화풍의 컷 전부를 한 줄로: 액션 → 각성 → 저주 → 특별 → 일상 → 스킨 */
  const shots = [].concat(portrait ? [{ file: portrait, cut: 'portrait' }] : [], awaken ? [{ file: awaken, cut: 'awaken' }] : [],
    cursed ? [{ file: cursed, cut: 'cursed' }] : [], extra.map((f, i) => ({ file: f, cut: 'extra', index: i + 1 })), casual.map((f, i) => ({ file: f, cut: 'casual', index: i + 1 })), skinShots);
  /* 무기를 넘어 왔으면 그 끝(first/last)의 컷에서 시작한다 — 앞 무기로 가면 마지막 컷, 다음 무기로 가면 첫 컷(액션이 없으면 첫 스킨) */
  const [focus, setFocus] = useState(() => {
    const edge = selection?.at === 'last' ? shots[shots.length - 1] : selection?.at === 'first' ? shots[0] : null;
    if (edge) return edge.cut === 'portrait' ? null : edge;
    return selection?.file && selection.cut !== 'portrait' ? selection : null;
  });
  const shown = focus || (portrait ? { file: portrait, cut: 'portrait' } : null);
  const [zoom, setZoom] = useState(!!selection?.zoom);
  /* 무기를 넘어 왔으면 누른 자리(큰 그림 또는 무기 줄)를 화면의 같은 높이에 둔다 — 새로 그려지며 맨 위로 튀면
     휴대폰에서 무기 줄이 화면 밖으로 밀려난다. 굴린 값을 그대로 옮기지 않는 건 무기마다 그림 위의 줄(화풍 비교)과 머리 높이(화풍 셀렉트)가 달라서 */
  useLayoutEffect(() => { const k = selection?.keep, sc = document.querySelector('.collection-scroll'), el = k && document.querySelector(k.sel);
    if (sc && el) sc.scrollTop += el.getBoundingClientRect().top - k.y; }, []);
  const zoomAt = shown ? Math.max(0, shots.findIndex(x => x.file === shown.file)) : 0;
  /* 한 칸 — 컷 줄 안이면 컷, 줄 끝을 넘으면 앞·다음 무기로(크게 보기는 열린 채) */
  const prevCard = nav && nav.prev, nextCard = nav && nav.next;
  const canPrev = zoomAt > 0 || !!prevCard, canNext = (shown && zoomAt < shots.length - 1) || !!nextCard;
  const move = d => { const n = shown && shots[zoomAt + d]; if (n) return setFocus(n.cut === 'portrait' ? null : n);
    if (d < 0 && prevCard) onGo(prevCard, 'last', zoom, '.big'); if (d > 0 && nextCard) onGo(nextCard, 'first', zoom, '.big'); };
  useLayoutEffect(() => { document.body.classList.toggle('zoomed', zoom); return () => document.body.classList.remove('zoomed'); }, [zoom]);
  /* 큰 그림도 방향키로 넘긴다. 덮개가 열려 있으면 덮개 몫이고, 셀렉트 같은 입력칸에 있을 땐 그 칸 몫 */
  const liveMove = useRef(); liveMove.current = { move, zoom };
  useEffect(() => {
    const key = e => { const f = liveMove.current; if (f.zoom || e.altKey || e.ctrlKey || e.metaKey || (e.target.closest && e.target.closest('input, select, textarea'))) return;
      if (e.key === 'ArrowLeft') f.move(-1); if (e.key === 'ArrowRight') f.move(1); };
    addEventListener('keydown', key);
    return () => removeEventListener('keydown', key);
  }, []);
  const swipe = useSwipe(d => liveMove.current.move(d), () => setZoom(true));

  useLayoutEffect(() => { if (!selection?.zoom) document.getElementById("detail-title")?.focus({ preventScroll: true }); }, []);
  /* 움직임(lib/scene-motion.js, docs/SCENE_MOTION.md) — 큰 그림에 켄 번스. 기본 ↔ 각성(스킨이면 그 스킨의 기본 ↔ 각성)은 열리기,
     각성으로 갈 때만 이 무기의 입자(data/motion.json → IMG.particlesOf)가 터지고, 각성 그림 위에는 그 입자가 옅게 떠돈다.
     다른 컷으로는 넘기기. 크게 보기에는 아무것도 안 붙이고, 열려 있는 동안 큰 그림의 움직임도 쉰다 */
  const kind = IMG.particlesOf(card, motionTable);
  const bigRef = useRef(null), layerRef = useRef(null), lastShown = useRef(null), ambient = useRef(null);
  const [motion, setMotion] = useState(() => !!MOTION && MOTION.enabled());
  useEffect(() => MOTION ? MOTION.subscribe(setMotion) : undefined, []);
  const motionLocked = !MOTION || MOTION.reduced();
  const awake = s => !!s && (s.cut === 'awaken' || (s.cut === 'skin' && s.state === 'awaken'));
  const pairOf = s => !s ? null : s.cut === 'skin' ? (s.state === 'cursed' ? null : 'skin:' + s.key) : s.cut === 'portrait' || s.cut === 'awaken' ? 'base' : null;
  const bigImg = () => bigRef.current && bigRef.current.querySelector('.zoom img');
  useLayoutEffect(() => {
    const prev = lastShown.current, now = shown && { file: shown.file, pair: pairOf(shown), awake: awake(shown), at: zoomAt };
    lastShown.current = now;
    const img = bigImg();
    if (!MOTION || !img || !now || zoom) return;
    const kb = { el: img, seed: now.file };
    if (!prev || prev.file === now.file) { MOTION.kenBurns(img, { seed: now.file }); return; }
    const from = MOTION.ghost(img, IMG.imgURL(prev.file), { fit: 'contain', transform: getComputedStyle(img).transform });
    MOTION.stop(img);
    if (now.pair && now.pair === prev.pair && now.awake !== prev.awake)
      MOTION.reveal(from, img, { kind: now.awake ? kind : null, removeFrom: true, key: 'dex-big', seed: now.file, kenBurns: kb });
    else MOTION.turn(from, img, { direction: now.at < prev.at ? 'previous' : 'next', removeFrom: true, key: 'dex-big', kenBurns: kb });
  }, [shown && shown.file]);
  /* 크게 보기를 열면 큰 그림은 쉬고, 닫으면 지금 그림에서 다시 */
  const zoomed = useRef(zoom);
  useEffect(() => {
    if (zoomed.current === zoom) return; zoomed.current = zoom;
    const img = bigImg();
    if (!MOTION || !img) return;
    if (zoom) { MOTION.cancel('dex-big'); MOTION.stop(img); } else MOTION.kenBurns(img, { seed: shown && shown.file });
    if (ambient.current) ambient.current[zoom ? 'pause' : 'resume']();
  }, [zoom]);
  useEffect(() => {
    if (!MOTION || !kind || !awake(shown) || !layerRef.current) return;
    const c = MOTION.particles(layerRef.current, kind, { density: 0.5, alpha: 0.6, max: 36, seed: shown.file });
    if (zoomed.current) c.pause();
    ambient.current = c;
    return () => { c.destroy(); if (ambient.current === c) ambient.current = null; };
  }, [shown && shown.file, kind]);
  useEffect(() => () => { if (MOTION) { MOTION.cancel('dex-big'); const img = bigImg(); if (img) MOTION.stop(img); } }, []);
  /* 즐겨찾기 — 큰 그림에 떠 있는 바로 그 그림(기본·각성·저주·일상·스킨 무엇이든). link 에 ?card=&pic= 를 적어 공방 모음에서 누르면 이 그림으로 다시 연다 */
  const favs = useFavorites(), [favMsg, sayFav] = useNote();
  const faved = !!shown && favs.some(x => x.a === 'myth' && x.file === shown.file);
  const toggleFav = () => {
    if (!FAV || !shown) return;
    const q = new URLSearchParams(); q.set('card', card.name); q.set('pic', shown.file);
    const on = FAV.toggle({ a: 'myth', key: card.name, file: shown.file, title: card.name, sub: shotLabel(shown),
      thumb: IMG.thumbURL(shown.file), full: IMG.imgURL(shown.file), link: new URL('dex.html', location.href).pathname + '?' + q.toString() });
    sayFav(W(on ? 'dex.fav.added' : faved ? 'dex.fav.removed' : 'dex.fav.blocked'));
  };
  const head = html`
    <div class="bar">
      <button class="back" onClick=${onClose}>${W('ui.back')}</button>
      <h2 id="detail-title" tabindex="-1">${card.name}<small>${card.en}</small></h2>
      <span class="n">${W('card.cost.n', { n: card.cost })}</span>
    </div>
`;

  return html`<${Shell} head=${head}>
    <div class="detail-spread"><section class="artwork-panel">
    ${shown ? html`
      <p class="sec">${shotLabel(shown)}<span class=${['awaken', 'cursed', 'skin'].includes(shown.cut) ? 'help' : ''}>${shown.cut === 'awaken' ? W('dex.awaken.note') : shown.cut === 'cursed' ? W('dex.cursed.note') : shown.cut === 'skin' ? W('dex.skin.note') : (styleName[style] || '')}</span></p>
      <div class="big" ref=${bigRef} data-particles=${kind || undefined} ...${swipe}><button type="button" class="zoom" aria-label=${W('dex.zoom')} onClick=${() => setZoom(true)}><${Pic} full file=${shown.file} alt=${card.name} /></button>
        <div class="big-motion" ref=${layerRef} aria-hidden="true"></div>
        ${(shots.length > 1 || prevCard || nextCard) && html`<div class="big-nav">
          <button type="button" class=${'big-prev' + (zoomAt <= 0 && prevCard ? ' to-card' : '')} disabled=${!canPrev} onClick=${() => move(-1)} aria-label=${zoomAt <= 0 && prevCard ? W('dex.card.prev') + ' · ' + prevCard.name : W('dex.zoom.prev')}>‹</button>
          <button type="button" class=${'big-next' + (zoomAt >= shots.length - 1 && nextCard ? ' to-card' : '')} disabled=${!canNext} onClick=${() => move(1)} aria-label=${zoomAt >= shots.length - 1 && nextCard ? W('dex.card.next') + ' · ' + nextCard.name : W('dex.zoom.next')}>›</button>
        </div>`}${shots.length > 1 && html`<span class="big-count" aria-live="polite">${zoomAt + 1} / ${shots.length}</span>`}</div>
      ${shown.cut === 'skin' && html`<div class="sw skin-state" role="group" aria-label=${W('dex.skin')}>${['base', 'awaken', 'cursed'].map(x => html`<button key=${x} type="button"
        class=${shown.state === x ? 'on' : ''} data-skin-state=${x} disabled=${!skinSet[shown.key][x]}
        onClick=${() => setFocus({ ...shown, file: skinSet[shown.key][x], state: x })}>${W(x === 'base' ? 'dex.cut.portrait' : 'dex.cut.' + x)}${isNew(skinSet[shown.key][x]) && html`<${NewMark} />`}</button>`)}</div>
      <div class="sw skin-wear"><button type="button" class=${worn === shown.key ? 'on' : ''} data-wear=${shown.key} disabled=${!unlocked && worn !== shown.key}
        onClick=${() => wear(worn === shown.key ? null : shown.key)}>${worn === shown.key ? W('dex.skin.using') : unlocked ? W('dex.skin.use') : W('dex.skin.locked.how')}</button></div>`}
    ` : html`<div class="big"><span class="ph">${W('art.none')}</span></div>`}
    ${nav && html`<div class="card-nav" role="group" aria-label=${W('dex.card.count', { n: nav.index + 1, total: nav.total })}>
      <button type="button" id="dex-card-prev" disabled=${!prevCard} title=${prevCard ? prevCard.name : ''} aria-label=${W('dex.card.prev') + (prevCard ? ' · ' + prevCard.name : '')}
        onClick=${() => onGo(prevCard, 'first', false, '.card-nav')}><b>‹</b><span>${prevCard ? prevCard.name : W('dex.card.prev')}</span></button>
      <span class="card-count">${W('dex.card.count', { n: nav.index + 1, total: nav.total })}</span>
      <button type="button" id="dex-card-next" disabled=${!nextCard} title=${nextCard ? nextCard.name : ''} aria-label=${W('dex.card.next') + (nextCard ? ' · ' + nextCard.name : '')}
        onClick=${() => onGo(nextCard, 'first', false, '.card-nav')}><span>${nextCard ? nextCard.name : W('dex.card.next')}</span><b>›</b></button>
    </div>`}
    ${zoom && shown && html`<${Zoom} card=${card} shots=${shots} at=${zoomAt} canPrev=${canPrev} canNext=${canNext} onMove=${move} onClose=${() => setZoom(false)} />`}

</section>
    <section class="story-panel"><p class="editorial-kicker">${group.myth.name[card.myth]} · ${group.kind.name[card.kind]}</p><p class="persona">${card.text || card.name}</p>    ${keys.length > 1 && html`<label class="style-pick" for="dex-style-pick">${W('dex.style')}
      <select id="dex-style-pick" value=${style} onChange=${e => { setStyle(e.currentTarget.value); setFocus(null); }}>
        ${keys.map(k => html`<option key=${k} value=${k}>${styleName[k] || k}</option>`)}
      </select></label>`}
    ${keys.length > 1 && html`
      <p class="sec">${W('dex.style.compare')}<span>${W('art.count', { n: keys.length })}</span></p>
      <div class="style-strip" role="group" aria-label=${W('dex.style.compare')}>
        ${keys.map(k => { const b = IMG.styleMap(entry)[k] || {}, f = b[V]; return html`<button key=${k} class=${'style-cell' + (k === style ? ' on' : '')} data-style=${k}
          disabled=${!f} onClick=${() => { setStyle(k); setFocus(null); }}>
          <span class="face">${f ? html`<${Pic} file=${f} alt=${styleName[k] || k} />` : html`<span class="ph">${W('art.none')}</span>`}${isNew(f) && html`<${NewMark} />`}</span>
          <b>${styleName[k] || k}</b></button>`; })}
      </div>`}
    <div class="sw" role="group" aria-label=${W('dex.cut.portrait')}>
      <button class=${shown && shown.cut === 'portrait' ? 'on' : ''} disabled=${!portrait} data-cut="portrait"
        onClick=${() => setFocus(null)}>${W('dex.cut.portrait')}${isNew(portrait) && html`<${NewMark} />`}</button>
      <button class=${shown && shown.cut === 'awaken' ? 'on' : ''} disabled=${!awaken} data-cut="awaken"
        onClick=${() => setFocus({ file: awaken, cut: 'awaken' })}>${W('dex.cut.awaken')}${isNew(awaken) && html`<${NewMark} />`}</button>
      <button class=${shown && shown.cut === 'cursed' ? 'on' : ''} disabled=${!cursed} data-cut="cursed"
        onClick=${() => setFocus({ file: cursed, cut: 'cursed' })}>${W('dex.cut.cursed')}${isNew(cursed) && html`<${NewMark} />`}</button>
    </div>
    ${shown && html`<div class="sw fav-toggle" role="group" aria-label=${W('dex.fav')}>
      <button type="button" class=${faved ? 'on' : ''} id="dex-fav" aria-pressed=${faved} disabled=${!FAV} title=${W('dex.fav.note')}
        onClick=${toggleFav}><span aria-hidden="true">${faved ? '\u2665' : '\u2661'}</span>${W('dex.fav')}</button>
      ${favs.length > 0 && html`<a class="fav-count" id="dex-fav-count" href=${FAV_HUB}>${W('dex.fav.count', { n: favs.length })}</a>`}
    </div>`}
    <div class="fav-toast" role="status" aria-live="polite">${favMsg}</div>
    <div class="sw hall-toggle" role="group" aria-label=${W('dex.hall')}>
      <button type="button" class=${inHall ? 'on' : ''} data-hall=${inHall ? 'on' : 'off'} aria-pressed=${inHall} disabled=${hallFull} title=${W('dex.hall.note')}
        onClick=${enshrine}>${inHall ? W('dex.hall.remove', { temple }) : hallFull ? W('dex.hall.full', { temple, max: IMG.HALL_MAX }) : W('dex.hall.add', { temple })}</button>
      <span class="hall-n">${W('dex.hall.count', { temple, n: hall.length, max: IMG.HALL_MAX })}</span>
    </div>
    <div class="sw motion-toggle"><button type="button" id="dex-motion" aria-pressed=${motion} disabled=${motionLocked} title=${W(motionLocked ? 'motion.reduced' : 'motion.note')}
      onClick=${() => MOTION.setEnabled(!motion)}>${W(motion ? 'motion.off' : 'motion.on')}</button></div>

<${DotRow} key=${card.name} card=${card} />
</section></div><section class="other-art">
    ${extra.length > 0 && html`
      <p class="sec">${W('dex.extra')}<span>${W('art.count', { n: extra.length })}</span></p>
      <div class="gal">${extra.map((f, i) => html`<button key=${f} class="cell" data-cut="extra"
        onClick=${() => setFocus({ file: f, cut: 'extra', index: i + 1 })}><${Pic} file=${f} alt=${W('dex.cut.extra')} />${isNew(f) && html`<${NewMark} />`}</button>`)}</div>`}
    ${skins.length > 0 && html`
      <p class="sec">${W('dex.skin')}<span>${W('art.count', { n: skins.length })}</span></p>
      <div class="gal">${skins.map(k => html`<button key=${k.key} class=${'cell skin' + (worn === k.key ? ' worn' : '') + (unlocked ? '' : ' locked')} data-cut="skin" data-skin=${k.key}
        onClick=${() => setFocus(k)}><${Pic} file=${k.file} alt=${k.name} />${isNew(k.file) && html`<${NewMark} />`}<span class="cap">${k.name}${worn === k.key ? ' · ' + W('dex.skin.on') : unlocked ? '' : ' · ' + W('dex.skin.locked')}</span></button>`)}</div>`}
    ${casual.length > 0 && html`
      <p class="sec">${W('dex.casual')}<span>${W('art.count', { n: casual.length })}</span></p>
      <div class="gal">${casual.map((f, i) => html`<button key=${f} class="cell" data-cut="casual"
        onClick=${() => setFocus({ file: f, cut: 'casual', index: i + 1 })}><${Pic} file=${f} alt=${W('dex.cut.casual')} />${isNew(f) && html`<${NewMark} />`}</button>`)}</div>`}
</section><section class="reading-notes">
    <p class="sec">${W('kind.card')}</p>
    <${Facts} card=${card} group=${group} skill=${skill} />

</section>
  <//>`;
}

/* 밀어 넘기기 — 가로로 40px 넘게, 세로보다 확실히 많이 끌면 한 칸(손가락이 왼쪽으로 가면 다음).
   10px 넘게 끈 손가락 뒤에 따라오는 click 은 삼킨다 — 크게 보기를 열거나 닫지 않게. 화살표 단추에서 시작한 건 단추 몫 */
function useSwipe(onMove, onTap) {
  const live = useRef(); live.current = { onMove, onTap };
  const ate = useRef(0);
  return {
    onPointerDown: e => {
      ate.current = 0; /* 새 손가락 — 터치로 민 뒤엔 click 이 안 오므로 삼키기 표시가 다음 탭까지 남지 않게 */
      if ((e.pointerType === 'mouse' && e.button !== 0) || e.target.closest('.big-nav button, .zoom-nav button')) return;
      const x = e.clientX, y = e.clientY, id = e.pointerId;
      const up = u => { if (u.pointerId !== id) return; removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
        if (u.type !== 'pointerup') return;
        const dx = u.clientX - x, dy = u.clientY - y;
        if (Math.hypot(dx, dy) > 10) ate.current = Date.now();
        if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy) * 1.5) live.current.onMove(dx < 0 ? 1 : -1);
        else if (e.pointerType === 'touch' && Math.hypot(dx, dy) <= 10 && live.current.onTap) { ate.current = Date.now(); live.current.onTap(); } };
      addEventListener('pointerup', up); addEventListener('pointercancel', up);
    },
    onClickCapture: e => { if (Date.now() - ate.current < 500) { ate.current = 0; e.preventDefault(); e.stopPropagation(); } },
    onDragStart: e => e.preventDefault(),
  };
}

/* 크게 보기. shots 는 같은 화풍의 컷 전부 [{file, cut, index}], at 은 지금 것 */
function Zoom({ card, shots, at, canPrev, canNext, onMove, onClose, defs }) {
 const layer=useRef(),live=useRef();live.current={onMove,onClose};
 useLayoutEffect(()=>modalFocus(layer.current,()=>live.current.onClose(),'.big .zoom'),[]);
 useLayoutEffect(()=>{const key=e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();live.current.onMove(e.key==='ArrowLeft'?-1:1);}};addEventListener('keydown',key);return()=>removeEventListener('keydown',key);},[]);
 const swipe=useSwipe(d=>live.current.onMove(d)),shot=shots[at];
 /* 원본 크기 — 그림을 제 픽셀 크기로 펼쳐 손가락·휠로 구석구석 본다. 예전엔 그림 파일을 새 창으로 열었는데,
    홈 화면 앱(허브 범위 /)에서는 같은 앱 창에 그림만 떠서 돌아올 길이 없었다(2026-10-20). 넘기면 다시 화면에 맞춘다 */
 const [actual,setActual]=useState(false);
 useEffect(()=>setActual(false),[shot&&shot.file]);
 return html`<div ref=${layer} class="zoom-layer" role="dialog" aria-modal="true" aria-label=${W('gallery.zoom')}>
  <div class="zoom-bar"><b>${card.name} · ${shotLabel(shot,defs)}</b><span aria-live="polite">${at+1} / ${shots.length}</span><button type="button" class="zoom-open" aria-pressed=${actual} onClick=${()=>setActual(v=>!v)}>${W(actual?'gallery.fit':'gallery.original')}</button><button class="zoom-close" data-dialog-close onClick=${onClose} aria-label=${W('gallery.close')}>✕</button></div>
  <div class=${'zoom-body'+(actual?' actual':'')} ...${actual?{}:swipe}><${Pic} full file=${shot.file} alt=${card.name+' · '+shotLabel(shot,defs)} /><div class="zoom-nav"><button class="zoom-prev" disabled=${!canPrev} onClick=${()=>onMove(-1)} aria-label=${W('gallery.previous')}>‹</button><button class="zoom-next" disabled=${!canNext} onClick=${()=>onMove(1)} aria-label=${W('gallery.next')}>›</button></div></div>
  <div class="zoom-footer"><span class="viewer-keyboard">${W('gallery.viewer.hint')}</span><span class="viewer-touch">${W('gallery.viewer.touch')}</span></div>
 </div>`;
}

function shotLabel(shot) {
  if (shot.cut === 'skin') return W('dex.cut.skin', { name: shot.name }) + (shot.state && shot.state !== 'base' ? ' · ' + W('dex.cut.' + shot.state) : '');
  const cut = W('dex.cut.' + shot.cut);
  return shot.index ? W('dex.cut.number', { cut, n: shot.index }) : cut;
}

function List({ st, filters, onFilter, onOpen, compact, onCompact, restore, fresh, newOnly, onNewOnly }) {
  const sprites = useSprites();
  const f = normalize(filters);
  const [filtersOpen, setFiltersOpen] = useState(false);
  /* 상세에서 돌아오면 열기 전에 굴려 둔 자리로. 상세에서 다른 무기로 넘어갔으면 그 무기 칸이 보이게 한 번 더 민다 */
  useLayoutEffect(() => {
    const r = restore && restore.current, sc = document.querySelector('.collection-scroll');
    if (!r || !sc) return;
    restore.current = null;
    sc.scrollTop = r.top;
    if (!r.card) return;
    const el = [...sc.querySelectorAll('.grid > .cell')].find(x => x.dataset.card === r.card);
    if (!el) return;
    el.focus({ preventScroll: true });
    if (r.card === r.from) return;
    const a = el.getBoundingClientRect(), b = sc.getBoundingClientRect();
    if (a.top < b.top || a.bottom > b.bottom) sc.scrollTop += a.top - b.top - Math.max(0, (b.height - a.height) / 2);
  }, []);
  const shown = useMemo(() => select(st, f, newOnly && fresh.cards), [st, filters, newOnly, fresh]);
  const update = (key, value) => onFilter(normalize({ ...f, [key]: value }));
  const all = ['', W('dex.filter.all')];
  const pick = (key, options) => html`<label for=${'dex-' + key}>${W('dex.filter.' + key)}
    <select id=${'dex-' + key} value=${f[key]} onChange=${e => update(key, e.currentTarget.value)}>
      ${options.map(([v, label]) => html`<option key=${v} value=${v}>${label}</option>`)}
    </select></label>`;
  const head = html`<div class="search-row">
    <input type="search" name="q" autocomplete="off" spellcheck=${false} value=${f.q} placeholder=${W('dex.filter.search')} aria-label=${W('dex.filter.search')}
      onInput=${e => update('q', e.currentTarget.value)} />
    <button class="dex-reset" id="dex-reset" onClick=${() => { onFilter(normalize()); onNewOnly(false); }}>${W('dex.filter.reset')}</button>
    <a class="dex-reset dex-museum" id="dex-museum" href="museum.html" title=${W('museum.open.note')}>${W('museum.open')}</a>
  </div>`;
  const images = shown.filter(c => IMG.portraitOf(st.img[c.name], V, f.style || undefined)).length;
  const [hall, setHall] = useState(() => IMG.hallPicks());
  const temple = W('theme.' + IMG.hallTheme());
  /* 비우기 — 모신 무기 열둘까지를 한 번에 내린다. 바로 비우되 열 초 동안 되돌릴 수 있다 */
  const [cleared, setCleared] = useState(null);
  const clearHall = () => { const prev = hall.slice(); IMG.setHallPicks([]); setHall([]); setCleared({ prev, theme: IMG.hallTheme(), key: Date.now() }); };
  return html`<${Shell} head=${head}>
    <section class="gallery-intro"><div><h2>${W('gallery.title')}</h2></div><p>${W('gallery.note')}</p></section>
    ${fresh.recent.length > 0 && html`<section class="dex-recent" aria-labelledby="dex-recent-title">
      <p class="sec" id="dex-recent-title">${W('dex.recent')}<span>${W('dex.recent.count', { days: RECENT_DAYS, n: fresh.recent.length })}</span></p>
      <div class="recent-strip" role="group" aria-labelledby="dex-recent-title">${fresh.recent.map(r => html`<button type="button" key=${r.file} class="recent-cell" data-card=${r.card.name} data-file=${r.file}
        onClick=${() => onOpen({ card: r.card, style: r.style, file: r.file, cut: r.cut, index: r.index, key: r.key, name: r.name, state: r.state })}>
        <span class="face"><${Pic} file=${r.file} />${fresh.isNew(r.file) && html`<${NewMark} />`}</span>
        <b>${r.card.name}</b><i>${shotLabel(r)}</i><i>${whenOf(r.day)}</i></button>`)}</div>
    </section>`}
    <div class="genre-strip" role="group" aria-label=${W('dex.filter.myth')}>${[all,...st.group.myth.order.map(k=>[k,st.group.myth.name[k]])].map(([key,label])=>html`<button type="button" aria-pressed=${f.myth===key} onClick=${()=>update('myth',key)}>${label}</button>`)}</div>
    <details class="dex-filters" open=${filtersOpen} onToggle=${e=>setFiltersOpen(e.currentTarget.open)}>
      <summary>${W('dex.filter.title')}</summary>
      <div class="dex-filter-grid">
        ${pick('myth', [all, ...st.group.myth.order.map(k => [k, st.group.myth.name[k]])])}
        ${pick('kind', [all, ...st.group.kind.order.map(k => [k, st.group.kind.name[k]])])}
        ${pick('cost', [all, ...[1, 2, 3, 4, 5].map(n => [String(n), W('card.cost.n', { n })])])}
        ${pick('style', [all, ...Object.entries(st.styleName)])}
        ${pick('art', ['any', 'yes', 'no'].map(k => [k, W('dex.filter.art.' + k)]))}
        ${pick('skin', ['any', 'yes', 'art'].map(k => [k, W('dex.filter.skin.' + k)]))}
      </div>
      <span class="dex-hall" title=${W('dex.hall.note')}>${W('dex.hall.count', { temple, n: hall.length, max: IMG.HALL_MAX })}
        <button class="dex-reset" id="dex-hall-clear" disabled=${!hall.length} onClick=${clearHall}>${W('dex.hall.clear', { temple })}</button></span>
    </details>
    ${cleared && html`<${UndoToast} key=${cleared.key} text=${W('dex.hall.cleared', { temple, n: cleared.prev.length })}
      onUndo=${() => { IMG.setHallPicks(cleared.prev, cleared.theme); setHall(IMG.hallPicks()); setCleared(null); }} onDone=${() => setCleared(null)} />`}
    <div class="dex-view-row"><p class="sec" role="status">${W('kind.card')}<span>${W('dex.filter.count', { cards: shown.length, images })}</span></p>

      <span class="dex-view-tools">${(fresh.cards.size > 0 || newOnly) && html`<button class="dex-reset" id="dex-new-only" aria-pressed=${!!newOnly} onClick=${() => onNewOnly(v => !v)}>${W('dex.new.only', { n: fresh.cards.size })}</button>`}
      <button class="dex-reset" id="dex-size" aria-pressed=${compact} onClick=${onCompact}>${W(compact ? 'dex.view.normal' : 'dex.view.small')}</button></span>
    </div>
    ${shown.length === 0
      ? html`<p class="empty">${W('dex.filter.empty')}</p>`
      : html`<div class="grid">${shown.map(c => {
          const entry = st.img[c.name], file = IMG.portraitOf(entry, V, f.style || undefined);
          const bucket = file && (IMG.styleMap(entry)[f.style] || Object.values(IMG.styleMap(entry)).find(b => b[V]));
          const states = file ? [W('art.done')].concat(IMG.awakenOf(bucket, V) ? [W('art.awaken.done')] : [], IMG.cursedOf(bucket, V) ? [W('art.cursed.done')] : []).join(' ') : W('art.missing');
          const enshrined = hall.includes(c.name);
          return html`<button key=${c.name} class=${'cell' + (enshrined ? ' hall-on' : '')} data-card=${c.name} data-new=${fresh.cards.has(c.name) ? '1' : undefined} data-myth=${c.myth} data-kind=${c.kind} data-hall=${enshrined ? 'on' : undefined}
            style=${'--cc:' + (st.group.myth.color[c.myth] || 'var(--line)')}
            onClick=${() => onOpen({ card: c, style: f.style, file, cut: 'portrait' })}>
            <span class="face">${file
              ? html`<${Pic} file=${file} alt=${c.name} />`
              : html`<span class="ph">${W('art.none')}</span>`}${enshrined ? html`<span class="hall-mark">${W('dex.hall.on')}</span>` : ''}${fresh.cards.has(c.name) ? html`<${NewMark} />` : ''}${SP && sprites && SP.actorFor(sprites, c.name) ? html`<span class="dot-badge" title=${W('dex.dot.label')}>${W('dex.dot.badge')}</span>` : ''}</span>
            <span class="cap"><span class="cnm"><span class="cost">${W('card.cost.n', { n: c.cost })}</span>${c.name}</span>
              <i>${st.group.myth.name[c.myth]} · ${st.group.kind.name[c.kind]}</i>
              <i>${states}</i>
            </span>
          </button>`;
        })}</div>`}
  <//>`;
}

function App() {
  const st = useDex();
  const fresh = useFresh(st);
  const [newOnly, setNewOnly] = useState(false);
  /* 신전 고르기는 지금 테마의 신전 몫이다 — 테마가 바뀌면 다시 읽는다 */
  const [theme, setTheme] = useState(() => IMG.hallTheme());
  useEffect(() => { const on = () => setTheme(IMG.hallTheme()); addEventListener('atelier-appearance', on); return () => removeEventListener('atelier-appearance', on); }, []);
  const [open, setOpen] = useState(null);
  /* dex.html?card=<이름> — 박물관의 "도감에서 보기"나 나눈 주소가 그 무기의 상세로 바로 연다.
     목록 칸의 주소에서 card 를 먼저 지우고 상세 칸을 쌓는다 — 뒤로 가기면 card 없는 목록 주소 */
  const [asked] = useState(() => readURL().card);
  useEffect(() => { if (asked && st.cards) { const c = st.cards.find(x => x.name === asked);
    /* ?pic= — 즐겨찾기(공방 모음)에서 온 주소. 그 그림의 화풍·컷으로 연다 */
    const pic = new URLSearchParams(location.search).get('pic'), shot = c && pic && cardShots(c, st.img[c.name]).find(s => s.file === pic);
    if (c) { try { history.replaceState(null, '', urlOf(filtersNow.current, null)); } catch {} openShot(shot ? { ...shot, card: c } : { card: c, cut: 'portrait' }); } } }, [st.cards]);
  const [compact, setCompact] = useState(() => {
    try { return localStorage.getItem(COMPACT_STORE) === 'true'; } catch { return false; }
  });
  useEffect(() => {
    document.body.classList.toggle('dex-compact', compact);
    try { localStorage.setItem(COMPACT_STORE, String(compact)); } catch {}
    return () => document.body.classList.remove('dex-compact');
  }, [compact]);
  const [filters, setFilters] = useState(() => {
    const fromURL = readURL().filters;
    if (fromURL) return fromURL;
    try { return normalize(JSON.parse(localStorage.getItem(FILTER_STORE))); } catch { return normalize(); }
  });
  useEffect(() => { try { localStorage.setItem(FILTER_STORE, JSON.stringify(filters)); } catch {} }, [filters]);
  const filtersNow = useRef(filters); filtersNow.current = filters;
  /* 거르기·무기를 바꾸면 지금 칸의 주소를 고쳐 쓴다(기록은 안 쌓는다). 상세를 닫으면 card 가 빠진다 */
  const openName = open && open.card && open.card.name;
  /* 자료가 오기 전에는 손대지 않는다 — 그새 고쳐 쓰면 바로 연 ?card= 가 열리기 전에 지워진다 */
  useEffect(() => { if (!st.cards) return; try { history.replaceState(history.state, '', urlOf(filters, openName)); } catch {} }, [filters, openName, !!st.cards]);
  /* 목록 자리 — 열 때 굴린 값과 연 무기를 적어 두고, 닫을 때 List 가 그 자리로 돌아간다 */
  const listTop = useRef(0), from = useRef(null), restore = useRef(null), openNow = useRef(null);
  openNow.current = open;
  /* 휴대폰 뒤로 가기 — 상세를 열 때 기록을 한 칸 쌓아 두고, 뒤로 가기(popstate)면 그 칸을 내리며 목록으로.
     "목록으로" 단추도 같은 칸을 내린다(history.back). 그 popstate 는 이미 닫았으니 한 번 건너뛴다.
     무기를 넘겨도 칸은 하나 그대로 — 뒤로 가기 한 번이면 목록이다. 박물관에서 ?card= 로 바로 열었어도 같다 */
  const pushed = useRef(false), skipPop = useRef(false);
  const shut = () => { restore.current = { top: listTop.current, card: openNow.current?.card?.name, from: from.current }; setOpen(null); };
  function openShot(shot) {
    const sc = document.querySelector('.collection-scroll');
    listTop.current = sc ? sc.scrollTop : 0; from.current = shot.card.name;
    setOpen(shot);
    if (!pushed.current) { try { history.pushState({ dex: 'card' }, '', urlOf(filtersNow.current, shot.card.name)); pushed.current = true; skipPop.current = false; } catch {} }
  }
  const close = () => {
    shut();
    if (pushed.current) { pushed.current = false; skipPop.current = true; try { history.back(); } catch { skipPop.current = false; } }
  };
  const liveShut = useRef(); liveShut.current = shut;
  const liveOpen = useRef(); liveOpen.current = shot => setOpen(shot);
  const cardsNow = useRef(null); cardsNow.current = st.cards;
  useEffect(() => {
    const pop = () => { if (skipPop.current) { skipPop.current = false; return; } if (pushed.current) { pushed.current = false; liveShut.current(); return; }
      /* 앞으로 가기로 상세 칸에 다시 오면 그 무기를 연다 */
      const want = readURL().card, c = want && cardsNow.current && cardsNow.current.find(x => x.name === want);
      if (c && history.state && history.state.dex === 'card') { pushed.current = true; liveOpen.current({ card: c, cut: 'portrait' }); } };
    addEventListener('popstate', pop);
    return () => removeEventListener('popstate', pop);
  }, []);

  if (st.error) return html`<${Shell} head=${null}><p class="empty">${W('ui.error', { message: st.error })}</p><//>`;
  if (!st.cards) return html`<${Shell} head=${null}><p class="empty">${W('ui.loading')}</p><//>`;

  const card = st.cards.find(c => c.name === open?.card?.name);
  if (card) {
    /* 무기 넘기기의 차례 — 지금 거르기의 목록 차례에서 그림(기본 또는 스킨)이 있는 무기만. 거른 목록에 없는 무기(박물관에서 바로 연 것)면 전체 목록 */
    const f = normalize(filters);
    const hasArt = c => { const e = st.img[c.name]; if (!e) return false; const sk = IMG.skinSets(e, V);
      return !!IMG.portraitOf(e, V, f.style || undefined) || (c.skins || []).some(k => sk[k.key]); };
    let ring = select(st, f, newOnly && fresh.cards).filter(hasArt);
    if (!ring.some(c => c.name === card.name)) ring = sorted(st.cards, st.group).filter(c => c.name === card.name || hasArt(c));
    const index = ring.findIndex(c => c.name === card.name);
    const nav = index < 0 ? null : { index, total: ring.length, prev: ring[index - 1] || null, next: ring[index + 1] || null };
    const go = (c, at, zoom, sel) => { const sc = document.querySelector('.collection-scroll'), el = sel && document.querySelector(sel);
      const keep = sc && el ? { sel, y: el.getBoundingClientRect().top } : null;
      setOpen({ card: c, style: f.style, cut: 'portrait', at, zoom, keep }); };
    return html`<${Detail} key=${card.name + ':' + theme} card=${card} entry=${st.img[card.name] || null}
      selection=${open} nav=${nav} onGo=${go} styleName=${st.styleName} group=${st.group} skill=${st.skill} motion=${st.motion}
      onClose=${close} isNew=${fresh.isNew} />`;
  }
  return html`<${List} key=${theme} st=${st} filters=${filters} onFilter=${setFilters} onOpen=${openShot} restore=${restore}
    compact=${compact} onCompact=${() => setCompact(v => !v)} fresh=${fresh} newOnly=${newOnly} onNewOnly=${setNewOnly} />`;
}

render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

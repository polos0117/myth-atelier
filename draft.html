<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>신화 무기 공방</title>
<!-- 신기 드래프트 — 우리 근본. 규칙은 lib/draft.js 가 갖고, 여기는 그리기와 저장뿐이다.
     판과 전적은 이 브라우저(localStorage)에 남는다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth32">
<style>
.dex-page > #app {display:flex;flex-direction:column;min-height:0;height:100%}
.dex-page > #app > main {flex:1 1 auto;min-height:0}
.collection-scroll {display:block}
.note {margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
.empty {padding:36px 0;text-align:center;color:var(--muted);font-size:13px}
.at-myths {display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.at-myth {min-height:36px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--muted);font:700 12px var(--display);cursor:pointer}
.at-myth.on {border-color:var(--cc);color:var(--text);background:var(--accent-soft);box-shadow:inset 0 -2px var(--cc)}
.at-myth-n {font:700 11px ui-monospace,monospace;color:var(--muted)}
.df-myths {grid-column:1 / -1}
/* 이펙트 — 팩 펼치기, 날아가기, 미리보기 빛, 인연 띠, 짝·결속·적 지명 반짝임, 결과 발표. 전부 코드로 */
.df-card.deal {animation:df-deal .5s cubic-bezier(.2,.8,.3,1) backwards;animation-delay:var(--d,0ms);transform-origin:50% 60%}
@keyframes df-deal {0% {opacity:0;transform:perspective(700px) translateY(-24px) rotateY(90deg)} 60% {opacity:1;transform:perspective(700px) translateY(2px) rotateY(-8deg)} 100% {opacity:1;transform:none}}
.df-card {box-shadow:0 0 calc(var(--g,0) * 16px) calc(var(--g,0) * 1px) color-mix(in srgb,var(--gold) calc(var(--g,0) * 70%),transparent)}
.df-card.best::after {content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,#fff3 48%,transparent 60%) 0 0/250% 100%;animation:df-sheen 2.4s ease-in-out infinite}
@keyframes df-sheen {0%,40% {background-position:120% 0} 100% {background-position:-120% 0}}
.df-ghost {transition:none!important;animation:none!important;box-shadow:0 0 24px var(--halo)}
.df-bond {position:relative;margin:4px 0 8px;overflow:hidden;border-radius:6px;animation:df-unfurl .55s cubic-bezier(.2,.8,.3,1) both}
.df-bond .df-fired {display:block;padding:10px 14px;font:700 13px var(--display);background:linear-gradient(90deg,#d9b45a33,#f3dc9a55,#d9b45a33);border-color:var(--gold);box-shadow:0 0 18px var(--halo)}
.df-bond::after {content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff8 50%,transparent 70%) 0 0/300% 100%;animation:df-sweep 1.1s .3s ease-out both;pointer-events:none}
.df-bond.feud .df-fired {background:linear-gradient(90deg,#5a101c,#8e1b2b,#5a101c);border-color:#ff6b84;color:#ffd6dd;box-shadow:0 0 18px #c0143c88}
.df-bond.feud::after {background:repeating-linear-gradient(115deg,transparent 0 18px,#ff6b84aa 18px 20px,transparent 20px 44px);animation:df-crack .5s .2s steps(4) both}
@keyframes df-unfurl {from {opacity:0;clip-path:inset(0 50% 0 50%)} to {opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes df-sweep {from {background-position:120% 0} to {background-position:-120% 0}}
@keyframes df-crack {from {opacity:0} 50% {opacity:1} to {opacity:.35}}
.df-pair.own {border-color:color-mix(in srgb,var(--gold) 60%,var(--line))}
.df-pair.fresh {animation:df-in .7s cubic-bezier(.2,.8,.3,1) both}
.df-pair.fresh.own {animation:df-in .7s cubic-bezier(.2,.8,.3,1) both,df-own 1.2s .2s ease-out both}
.df-pair.bond {position:relative;overflow:hidden}
.df-pair.bond::after {content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#f3dc9a99 50%,transparent 70%) 0 0/300% 100%;animation:df-sweep 1s .45s ease-out both;pointer-events:none}
.df-pair.took {animation:df-took 1.1s ease-out both}
@keyframes df-in {0% {opacity:0;transform:translateX(-14px) scale(.96);box-shadow:0 0 0 1px var(--gold),0 0 18px var(--halo)} 60% {opacity:1;transform:none} 100% {box-shadow:none}}
@keyframes df-own {0% {box-shadow:0 0 0 2px #fff3c0,0 0 30px 6px #f3dc9a} 100% {box-shadow:0 0 0 0 transparent}}
@keyframes df-took {0% {background:color-mix(in srgb,var(--signal,#ff6b84) 35%,var(--card2));box-shadow:0 0 0 1px var(--signal,#ff6b84)} 100% {background:var(--card2);box-shadow:none}}
.df-rows li.up {animation:df-up .9s ease-out both}
.df-rows li.up b {animation:df-pop .5s ease-out both}
@keyframes df-up {0% {background:#f3dc9a44;color:var(--text)} 100% {background:transparent}}
@keyframes df-pop {0% {transform:scale(1.5);color:var(--gold)} 100% {transform:none}}
.df-reveal {animation:df-rise .55s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--d,0ms)}
@keyframes df-rise {from {opacity:0;transform:translateY(18px) scale(.97)} to {opacity:1;transform:none}}
.df-confetti {position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.df-confetti i {position:absolute;top:-20px;left:var(--x);width:7px;height:12px;border-radius:2px;background:hsl(var(--h) 85% 62%);box-shadow:0 0 6px hsl(var(--h) 90% 60% / .7);
  animation:df-fall 2.8s cubic-bezier(.3,.6,.4,1) both;animation-delay:calc(var(--d) + 1.6s);rotate:var(--r)}
@keyframes df-fall {0% {opacity:0;transform:translateY(0) rotate(0)} 10% {opacity:1} 100% {opacity:0;transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce) {.df-card.deal,.df-bond,.df-bond::after,.df-pair,.df-pair::after,.df-rows li,.df-rows li b,.df-reveal,.df-card.best::after {animation:none!important} .df-confetti {display:none}}
.df-myths-now {margin:4px 0 0}
</style>
<script src="lib/workspace-theme.js?v=myth8"></script>
<script src="lib/words.js?v=myth41"></script>
<script src="lib/fresh.js?v=4"></script>
<script src="lib/img.js?v=myth6"></script>
<script src="lib/draft.js?v=3"></script>
</head>
<body class="dex-page df-page">
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=myth13';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, D = window.AtelierDraft;
const STORE = 'myth_draft_v1', REC = 'myth_draft_rec_v1', HANDOFF = 'myth_handoff_v1', V = 'f';

function Shell({ children }) {
  return html`<main>
    <${WorkspaceHeader} page="draft" />
    <div class="collection-scroll" tabindex="0">${children}</div>
  </main>`;
}
function useData() {
  const [state, set] = useState(null);
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    Promise.all([get('data/card.json'), get('data/wielder.json'), get('data/draft.json'), get('data/group.json'), IMG.load()])
      .then(([card, wielder, draft, group, img]) => set({ data: { cards: card.cards, wielders: wielder.wielders, draft }, group, img }))
      .catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}
function load() { try { const j = JSON.parse(localStorage.getItem(STORE)); return j && j.teams ? j : null; } catch { return null; } }
function save(st) { try { if (st) localStorage.setItem(STORE, JSON.stringify(st)); else localStorage.removeItem(STORE); } catch {} }
function recLoad() { try { return JSON.parse(localStorage.getItem(REC)) || { games: 0, first: 0, second: 0, third: 0, best: 0 }; } catch { return { games: 0, first: 0, second: 0, third: 0, best: 0 }; } }
function recSave(r) { try { localStorage.setItem(REC, JSON.stringify(r)); } catch {} }
function seed() { return (Date.now() ^ Math.floor(Math.random() * 1e9)) | 0; }
const signed = n => (n > 0 ? '+' : '') + n;
const calm = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };
/* 집은 카드가 내 편성 칸으로 날아간다 — 카드 모양을 떠서 화면 위에 띄우고 옮긴 뒤 지운다. 화면이 다시 그려져도 상관없다 */
function flyToTeam(name) {
  if (calm()) return;
  const from = document.querySelector('.df-pack .df-card[data-name="' + CSS.escape(name) + '"]'), to = document.querySelector('.df-panel[data-seat="0"]');
  if (!from || !to || !from.animate) return;
  const a = from.getBoundingClientRect(), b = to.getBoundingClientRect(), ghost = from.cloneNode(true);
  ghost.classList.add('df-ghost'); ghost.removeAttribute('data-name');
  Object.assign(ghost.style, { position: 'fixed', left: a.left + 'px', top: a.top + 'px', width: a.width + 'px', height: a.height + 'px', margin: 0, zIndex: 50, pointerEvents: 'none' });
  document.body.appendChild(ghost);
  const dx = b.left + 24 - a.left, dy = b.top + 40 - a.top, k = Math.min(1, 60 / a.width);
  ghost.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + dx * 0.55 + 'px,' + (dy * 0.55 - 40) + 'px) scale(.7) rotate(-6deg)', opacity: 1, offset: 0.55 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ') rotate(0deg)', opacity: 0 }], { duration: 560, easing: 'cubic-bezier(.3,.7,.3,1)' }).onfinish = () => ghost.remove();
}

/* 카드 한 장 — 무기는 그림, 주인은 이름표. 색 테두리는 신화권 */
function Card({ data, group, img, type, name, delta, on, onClick, compact, deal, glow }) {
  const c = type === 'weapon' ? D.weapon(data, name) : D.wielder(data, name);
  const file = type === 'weapon' ? IMG.dressOf(img[name], name, V, 1, false).file : null;
  const color = group.myth.color[c.myth];
  return html`<button type="button" class=${'df-card ' + type + (on ? ' on' : '') + (deal != null ? ' deal' : '') + (glow > 0.99 ? ' best' : '')} data-name=${name} data-type=${type}
    style=${'--cc:' + color + (deal != null ? ';--d:' + deal * 55 + 'ms' : '') + (glow != null ? ';--g:' + glow.toFixed(2) : '')} onClick=${onClick} disabled=${!onClick}>
    <span class="face">${file ? html`<img src=${IMG.thumbURL(file)} alt="" loading="lazy" />` : html`<span class="ph">${name}</span>`}</span>
    <span class="cap"><b>${name}</b>
      <i>${type === 'weapon' ? group.myth.name[c.myth] + ' · ' + group.kind.name[c.kind] + ' · ' + W('draft.stat.weapon', { n: D.wp(c) })
        : W('draft.stat.wielder', { n: D.pw(c), myth: group.myth.name[c.myth] }) + ' · ' + W('draft.favor', { kind: group.kind.name[c.favor] })}</i>
      ${type === 'weapon' && !compact ? html`<i>${W('draft.owner', { name: c.wielder })}</i>` : ''}
      ${delta !== undefined ? html`<span class=${'dl' + (delta < 0 ? ' neg' : '')}>${W('draft.preview', { delta: signed(delta) })}</span>` : ''}
    </span></button>`;
}

function Rows({ rows, total, group, live }) {
  /* 결속·인연 줄의 값이 오르면 그 줄이 튀며 빛난다 — 앞 값과 견준다 */
  const prev = useRef(null), was = prev.current || {};
  const keyOf = r => r.k + ':' + (r.axis || '') + ':' + (r.key || r.name || '');
  useEffect(() => { const m = {}; rows.forEach(r => { m[keyOf(r)] = r.v; }); prev.current = m; });
  const label = r => r.k === 'pairs' ? W('draft.score.pairs', { n: r.n }) : r.k === 'solo' ? W('draft.score.solo', { n: r.n })
    : r.k === 'syn' ? W('draft.score.syn.' + r.axis, { key: group[r.axis].name[r.key], n: r.n }) : W('draft.score.' + r.k, { name: r.name });
  const up = r => live && prev.current && (r.k === 'syn' || r.k === 'pledge') && (was[keyOf(r)] == null || r.v > was[keyOf(r)]);
  return html`<ul class="df-rows">${rows.map((r, i) => html`<li key=${keyOf(r) + (up(r) ? ':' + r.v : '')} class=${(r.k === 'feud' ? 'feud' : '') + (up(r) ? ' up' : '')}><span>${label(r)}</span><b>${signed(r.v)}</b></li>`)}
    <li class="total"><span>${W('draft.score.total')}</span><b>${total}</b></li></ul>`;
}
function Thumb({ data, img, type, name }) {
  if (!name) return html`<i>·</i>`;
  const file = type === 'weapon' ? IMG.dressOf(img[name], name, V, 1, false).file : null;
  return file ? html`<img src=${IMG.thumbURL(file)} alt="" loading="lazy" />` : html`<i>${name.charAt(0)}</i>`;
}
function TeamPanel({ st, data, group, img, ti, title, open, fresh, bond, took, live }) {
  const t = st.teams[ti], ev = D.evaluate(data, t);
  const pairs = ev.units, has = (list, u) => list && (list.includes(u.w) || list.includes(u.o));
  const own = u => u.w && u.o && D.weapon(data, u.w).wielder === u.o;
  const cls = u => 'df-pair' + (own(u) ? ' own' : '') + (has(fresh, u) ? ' fresh' : '') + (has(bond, u) ? ' bond' : '') + (has(took, u) ? ' took' : '');
  return html`<section class="df-panel" data-seat=${ti}>
    <h3>${title} · ${W('draft.team.pairs', { n: pairs.filter(u => u.w && u.o).length })}</h3>
    ${pairs.length ? html`<ul class="df-pairs">${pairs.map((u, i) => html`<li key=${(u.w || '') + '|' + (u.o || '') + (has(fresh, u) || has(took, u) ? '|n' + st.log.length : '')} class=${cls(u)}>
      <span class="tn"><${Thumb} data=${data} img=${img} type="weapon" name=${u.w} /><${Thumb} data=${data} img=${img} type="wielder" name=${u.o} /></span>
      <span class="nm">${u.w || W('draft.unpaired')} · ${u.o || W('draft.unpaired')}${u.sync ? html`<small>${W('draft.sync', { n: u.sync })}</small>` : ''}</span>
      <span class="sc">${Math.round(u.s)}</span></li>`)}</ul>` : html`<p class="note">${W('draft.team.empty')}</p>`}
    ${open ? html`<${Rows} rows=${ev.rows} total=${ev.total} group=${group} live=${live} />` : ''}
  </section>`;
}

/* 판의 신화권 — 기본은 무작위 셋. 둘에서 다섯까지 켜거나 전부 */
function randomMyths(group, n) { const k = group.myth.order.slice(); for (let i = k.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [k[i], k[j]] = [k[j], k[i]]; } return k.slice(0, n); }
function Setup({ onStart, rec, onErase, group }) {
  const [lv, setLv] = useState(1), [rr, setRr] = useState(1);
  const [myths, setMyths] = useState(() => randomMyths(group, D.MYTHS_DEFAULT));
  const all = myths === 'all', min = D.MYTHS_MIN, max = D.MYTHS_MAX;
  const toggle = k => setMyths(m => { const w = m === 'all' ? [] : m; return w.includes(k) ? w.filter(x => x !== k) : w.length < max ? w.concat(k) : w; });
  const ready = all || (myths.length >= min && myths.length <= max);
  return html`<div class="df-setup">
    <div class="rn-head"><h2>${W('draft.setup.title')}</h2><p class="help">${W('draft.setup.note')}</p></div>
    <div class="rn-choice">
      <div class="df-opt"><b>${W('draft.lv')}</b><p class="help">${W('draft.lv.note')}</p>
        <div class="df-seg" role="group">${[0, 1, 2].map(i => html`<button key=${i} type="button" data-lv=${i} aria-pressed=${lv === i} onClick=${() => setLv(i)}>${W('draft.lv.' + i)}</button>`)}</div></div>
      <div class="df-opt"><b>${W('draft.rr')}</b><p class="help">${W('draft.rr.note')}</p>
        <div class="df-seg" role="group">${[0, 1, 3].map(n => html`<button key=${n} type="button" data-rr=${n} aria-pressed=${rr === n} onClick=${() => setRr(n)}>${W('draft.rr.n', { n })}</button>`)}</div></div>
      <div class="df-opt df-myths"><b>${W('draft.myths')}</b><p class="help">${W('draft.myths.note', { min, max, all: group.myth.order.length })}</p>
        <div class="at-myths" role="group" aria-label=${W('draft.myths')}>
          ${group.myth.order.map(k => { const on = all || myths.includes(k); return html`<button key=${k} type="button" class=${'at-myth' + (on ? ' on' : '')} data-myth=${k}
            aria-pressed=${on} style=${'--cc:' + group.myth.color[k]} onClick=${() => toggle(k)}>${group.myth.name[k]}</button>`; })}
          <span class="at-myth-n">${all ? W('draft.myths.all') : W('auto.myths.count', { n: myths.length, min, max })}</span>
          <button type="button" class="rn-btn quiet" data-myths="random" onClick=${() => setMyths(randomMyths(group, D.MYTHS_DEFAULT))}>${W('draft.myths.random')}</button>
          <button type="button" class="rn-btn quiet" data-myths="all" aria-pressed=${all} onClick=${() => setMyths('all')}>${W('draft.myths.all')}</button>
        </div></div>
    </div>
    <div class="df-bar"><button type="button" class="rn-btn primary" disabled=${!ready} onClick=${() => onStart({ lv, rr, myths: all ? null : myths })}>${W('draft.start')}</button>
      <span class="df-records">${W('draft.records')} — ${W('draft.records.line', rec)}</span>
      ${rec.games ? html`<button type="button" class="rn-btn quiet" onClick=${onErase}>${W('draft.records.erase')}</button>` : ''}</div>
  </div>`;
}

function Board({ st, data, group, img, act }) {
  const [sel, setSel] = useState(null);
  const type = D.typeNow(st, data), total = D.schedule(data).length;
  const previews = {}; (st.pack || []).forEach(n => { previews[n] = D.preview(st, data, n).delta; });
  const choose = n => { if (sel === n) { setSel(null); flyToTeam(n); act(x => D.pick(x, data, n)); } else setSel(n); };
  /* 팩이 바뀔 때마다(새 라운드·보급) 카드가 한 장씩 뒤집히며 깔린다 */
  const packKey = st.round + ':' + st.rerolls[0] + ':' + (st.pack || []).join();
  const best = Math.max(1, ...Object.values(previews));
  /* 인연 — 방금 집어 맺어진 인연. 악연이면 붉게 */
  const fb = st.feedback, pg = fb && fb.fired.length ? D.pledges(data, st.teams[0]).filter(g => fb.fired.includes(g.n)) : [];
  const bond = pg.length ? pg.flatMap(g => g.got) : null;
  /* 적이 막 가져간 것 — 내 마지막 지명 뒤의 적 기록 */
  let mine = -1; st.log.forEach((l, i) => { if (l.ti === 0 && !l.rr) mine = i; });
  const took = ti => st.log.slice(mine + 1).filter(l => l.ti === ti && !l.rr).map(l => l.c);
  return html`<div>
    <div class="df-top"><div><span class="df-round">${W('draft.round', { n: st.round + 1, total })}</span><h2>${W('draft.pack.' + type)}</h2></div>
      <div class="df-seats">${D.turnSeq(st).map((s, i) => html`<span key=${i} class=${'df-seat' + (i === st.si ? ' on' : '')}>${W('draft.seat.' + s)}</span>`)}</div></div>
    <p class="note df-myths-now">${W('draft.myths')} — ${st.myths ? st.myths.map(k => group.myth.name[k]).join(' · ') : W('draft.myths.all')}</p>
    ${pg.length ? html`<div class=${'df-bond' + (pg.every(g => g.feud) ? ' feud' : '')} key=${'bond' + st.log.length} role="status">
      <span class="df-fired">${W('draft.fired', { list: fb.fired.join(' · ') })}</span></div>` : ''}
    <div class="df-layout map-stage" ...${IMG.mapStage(group, st.myths ? st.myths[0] : null)}>
      <div>
        <p class="note help">${W('draft.pack.note')}</p>
        <div class="df-pack" key=${packKey}>${(st.pack || []).map((n, i) => html`<${Card} key=${n} data=${data} group=${group} img=${img} type=${type} name=${n} delta=${previews[n]}
          deal=${i} glow=${Math.max(0, previews[n]) / best} on=${sel === n} onClick=${() => choose(n)} />`)}</div>
        <div class="df-bar">
          <button type="button" class="rn-btn primary" data-pick="1" disabled=${!sel} onClick=${() => sel && choose(sel)}>${W('draft.pick')}</button>
          <button type="button" class="rn-btn" data-resupply="1" disabled=${st.rerolls[0] < 1 || st.round >= total - 1} onClick=${() => { setSel(null); act(x => D.resupply(x, data)); }}>${W('draft.resupply')}</button>
          <span class="note">${W('draft.resupply.left', { n: st.rerolls[0] })}</span></div>
      </div>
      <div class="df-side">
        <${TeamPanel} st=${st} data=${data} group=${group} img=${img} ti=${0} title=${W('draft.team.title')} open=${true} live=${true} fresh=${fb ? [fb.c] : null} bond=${bond} />
        ${[1, 2].map(ti => html`<${TeamPanel} key=${ti} st=${st} data=${data} group=${group} img=${img} ti=${ti} title=${W('draft.seat.' + ti)} took=${took(ti)} />`)}
        <section class="df-panel"><h3>${W('draft.log.title')}</h3><ol class="df-log">${st.log.slice().reverse().slice(0, 14).map((l, i) => html`<li key=${i}><span>R${l.r}</span><b>${W('draft.seat.' + l.ti)}</b>${l.rr ? W('draft.log.rr') : l.c}</li>`)}</ol></section>
      </div>
    </div>
  </div>`;
}

/* 출정 — 내 짝 여섯과 적 두 편의 짝을 던전에 넘긴다. 상대는 강한 짝부터, 보스는 1등 적의 최고의 짝(내가 1등이면 2등의) */
function handoff(st, data, res) {
  const mine = res.evs[0].ev.units.filter(u => u.w && u.o).map(u => ({ w: u.w, o: u.o, s: Math.round(u.s) }));
  const rivals = res.sorted.filter(x => x.ti !== 0);
  const foes = [];
  rivals.forEach(x => x.ev.units.filter(u => u.w && u.o).forEach(u => foes.push({ w: u.w, o: u.o, s: Math.round(u.s) })));
  foes.sort((a, b) => a.s - b.s);
  const top = rivals[0].ev.units.filter(u => u.w && u.o)[0];
  const boss = top ? { w: top.w, o: top.o } : null;
  const rest = boss ? foes.filter(f => !(f.w === boss.w && f.o === boss.o)) : foes;
  try { localStorage.setItem(HANDOFF, JSON.stringify({ pairs: mine, foes: rest, boss, rank: res.rank, seed: st.seed })); } catch {}
  location.href = 'run.html';
}
/* 금가루 — 1등이면 위에서 흩날린다 */
function Confetti() {
  return html`<div class="df-confetti" aria-hidden="true">${Array.from({ length: 36 }, (_, i) => html`<i key=${i}
    style=${'--x:' + ((i * 37) % 100) + '%;--d:' + ((i * 53) % 900) + 'ms;--r:' + ((i * 71) % 360) + 'deg;--h:' + [42, 48, 36, 54][i % 4]}></i>`)}</div>`;
}
function useCount(to, ms) {
  const [v, setV] = useState(() => calm() ? to : 0);
  useEffect(() => { if (calm()) { setV(to); return; } let raf, t0 = performance.now();
    const step = now => { const k = Math.min(1, (now - t0) / ms); setV(Math.round(to * (1 - Math.pow(1 - k, 3)))); if (k < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step); return () => cancelAnimationFrame(raf); }, [to]);
  return v;
}
function Score({ to, delay }) { const [go, setGo] = useState(false); useEffect(() => { const h = setTimeout(() => setGo(true), calm() ? 0 : delay); return () => clearTimeout(h); }, []);
  const v = useCount(go ? to : 0, 900); return html`<small>${v}</small>`; }
function Result({ st, data, group, img, onAgain }) {
  const res = D.result(st, data);
  const best = res.evs[0].ev.units.filter(u => u.w && u.o)[0];
  /* 3등부터 차례로 열린다 — 화면 차례(1·2·3등)는 그대로, 나타나는 때만 뒤에서부터 */
  const order = i => (res.sorted.length - 1 - i) * 650;
  return html`<div>
    ${res.rank === 0 && !calm() ? html`<${Confetti} />` : ''}
    <div class="rn-end df-reveal" style=${'--d:' + (res.sorted.length * 650) + 'ms'}><h2>${W('draft.result.rank', { rank: res.rank + 1 })}</h2>
      <p>${W('draft.result.gap', { n: res.gap })}${best ? ' · ' + W('draft.result.mvp') + ': ' + best.w + ' × ' + best.o + ' ' + Math.round(best.s) : ''}</p>
      <div class="rn-bar" style="justify-content:center"><button type="button" class="rn-btn primary" data-sortie="1" onClick=${() => handoff(st, data, res)}>${W('draft.sortie')}</button>
        <button type="button" class="rn-btn" data-again="1" onClick=${onAgain}>${W('draft.again')}</button></div>
      <p class="note help">${W('draft.sortie.note')}</p></div>
    <div class="df-result">${res.sorted.map((x, i) => html`<div key=${x.ti} class=${'df-panel df-reveal' + (x.ti === 0 ? ' me' : '')} style=${'--d:' + order(i) + 'ms'}>
      <h4>${W('draft.seat.' + x.ti)}<${Score} to=${x.ev.total} delay=${order(i)} /></h4>
      <${TeamPanel} st=${st} data=${data} group=${group} img=${img} ti=${x.ti} title=${W('draft.seat.' + x.ti)} open=${true} /></div>`)}</div>
  </div>`;
}

function App() {
  const loaded = useData();
  const [st, setSt] = useState(load), [rec, setRec] = useState(recLoad);
  if (!loaded) return html`<${Shell}><p class="empty">${W('ui.loading')}</p></${Shell}>`;
  if (loaded.error) return html`<${Shell}><p class="empty">${W('ui.error', { message: loaded.error })}</p></${Shell}>`;
  const { data, group, img } = loaded;
  const act = fn => {
    const next = JSON.parse(JSON.stringify(st)); const r = fn(next);
    if (!r || r.ok !== false) {
      if (next.phase === 'done' && !next.recorded) {
        next.recorded = true; const res = D.result(next, data), r2 = { ...rec };
        r2.games++; r2[['first', 'second', 'third'][res.rank]]++; r2.best = Math.max(r2.best, res.evs[0].ev.total); recSave(r2); setRec(r2);
      }
      save(next); setSt(next);
    }
  };
  const again = () => { save(null); setSt(null); };
  let body;
  if (!st) body = html`<${Setup} group=${group} rec=${rec} onStart=${o => { const s = D.newGame(data, seed(), o); save(s); setSt(s); }} onErase=${() => { const r = { games: 0, first: 0, second: 0, third: 0, best: 0 }; recSave(r); setRec(r); }} />`;
  else if (st.phase === 'done') body = html`<${Result} st=${st} data=${data} group=${group} img=${img} onAgain=${again} />`;
  else body = html`<${Board} st=${st} data=${data} group=${group} img=${img} act=${act} />`;
  return html`<${Shell}>${body}
    ${st && st.phase !== 'done' ? html`<div class="df-bar"><span class="note">${W('draft.saved')}</span><button type="button" class="rn-btn quiet" data-abandon="1" onClick=${again}>${W('draft.abandon')}</button></div>` : ''}
  </${Shell}>`;
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

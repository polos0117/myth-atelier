<title>신화 무기 공방</title>
<!--
  신기 결투의 얼굴. 규칙은 lib/duel.js 에만 있다 — 여기는 상태를 그리고 단추를 엔진에 넘길 뿐이다.
  프로필과 진행 중인 판은 이 브라우저(localStorage 의 myth_duel_v1)에 남는다. 상태가 통째로 JSON 이라 그대로 넣고 꺼낸다.
  설계: docs/superpowers/specs/2026-10-02-duel-game-design.md
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth30">
<style>
:root {--cc:var(--line)}
* {box-sizing:border-box}
html,body {margin:0;padding:0}
body {color:var(--text);font-size:15px}
.dex-page > #app {display:flex;flex-direction:column;min-height:0;height:100%}
.dex-page > #app > main {flex:1 1 auto;min-height:0}
.collection-scroll {display:block}
.dex-page .collection-scroll {padding-bottom:calc(44px + env(safe-area-inset-bottom))}
.du-screen {display:block;min-height:120px}
.du-btn {min-height:44px;padding:8px 14px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.du-btn.primary {background:var(--accent);color:var(--on-accent);border-color:var(--accent);min-height:46px;font-size:14px}
:is([data-theme="daylight"],[data-theme="blossom"],[data-theme="sand"]) .du-btn.primary {color:#fff}
.du-btn:disabled {opacity:.45;cursor:default}
.sec {margin:16px 0 8px;font:700 11px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:var(--accent);display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.sec span {color:var(--muted);font-weight:400;letter-spacing:0}
.note {margin:6px 0 10px;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
/* 첫 고르기 — 열한 권 */
.du-myths {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0 14px}
@media (min-width:600px) {.du-myths {grid-template-columns:repeat(4,minmax(0,1fr))}}
.du-myth {min-height:56px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-left:5px solid var(--mc);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-weight:700;font-size:13px;text-align:left;cursor:pointer}
.du-myth.on {outline:3px solid var(--accent);outline-offset:1px}
.du-myth small {display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
/* 로비 머리 */
.du-head {display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 0 4px;font:700 12px ui-monospace,monospace;letter-spacing:.04em;color:var(--muted)}
.du-head b {color:var(--text);font-size:14px}
.du-deck[data-ok="false"] b {color:var(--signal)}
.du-tools {display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.du-lv {display:flex;gap:4px;border:1px solid var(--line);border-radius:8px;padding:4px;margin:6px 0}
.du-lv button {flex:1;min-height:44px;background:var(--card);border:0;border-radius:6px;color:var(--muted);font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.du-lv button.on {background:var(--accent-soft);color:var(--text);box-shadow:inset 0 -2px var(--accent)}
.du-conquered {margin:8px 0;padding:10px 12px;border:1px solid var(--gold);border-radius:8px;color:var(--gold);font-weight:700;text-align:center;font-size:13px}
.du-bosses {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px) {.du-bosses {grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px) {.du-bosses {grid-template-columns:repeat(4,minmax(0,1fr))}}
.du-boss {display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;align-items:center;min-height:92px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.du-boss .face {width:52px;aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:var(--card2)}
.du-boss b {display:block;font-size:14px;overflow-wrap:anywhere}
.du-boss small {display:block;color:var(--muted);font-size:11px;margin-top:3px}
.du-boss:disabled {opacity:.45;cursor:default}
/* 덱 짜기 */
.du-main-pick {display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.du-main-pick button {min-height:44px;padding:0 10px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--mc);border-radius:8px;color:var(--muted);font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.du-main-pick button.on {color:var(--text);background:var(--accent-soft);border-color:var(--accent)}
.du-rule {display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 2px;font:700 12px ui-monospace,monospace;color:var(--muted)}
.du-rule span.bad {color:var(--signal)}
.du-why {margin:2px 0 8px;color:var(--signal);font-size:12px;line-height:1.5}
.du-why:empty {display:none}
.grid {display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:8px}
@media (min-width:600px) {.grid {grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}}
.cell {display:flex;flex-direction:column;justify-content:flex-start;width:100%;min-height:44px;padding:0;text-align:left;color:inherit;font:inherit;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;cursor:pointer}
.cell.in {outline:3px solid var(--accent);outline-offset:-3px}
.face {display:block;flex:none;position:relative;width:100%;aspect-ratio:2/3;background:var(--card2);overflow:hidden}
.face img {display:block;width:100%;height:100%;object-fit:cover;object-position:center top}
.ph {display:block;height:100%;background:linear-gradient(160deg,var(--card2),var(--card))}
.cap {display:block;flex:1;padding:6px 8px 8px;font-weight:700;font-size:12px;overflow-wrap:anywhere}
.cap .cnm {display:block;min-height:2.8em;max-height:2.8em;overflow:hidden;word-break:keep-all;line-height:1.4}
.cap i {display:block;margin-top:3px;font:400 11px ui-monospace,monospace;font-style:normal;color:var(--muted)}
.du-var {position:absolute;top:6px;right:6px;padding:2px 7px;border-radius:999px;font:700 10px ui-monospace,monospace;letter-spacing:.04em;background:var(--card2);color:var(--text);box-shadow:0 1px 4px #0006}
.du-var[data-variant="awaken"] {background:var(--gold);color:#221a06}
.du-var[data-variant="cursed"] {background:var(--signal);color:#fff}
.du-var[data-variant="weather"] {background:#3d7bd6;color:#fff}
.du-pw {position:absolute;left:6px;bottom:6px;min-width:26px;padding:2px 6px;border-radius:7px;text-align:center;font:800 13px ui-monospace,monospace;background:#000a;color:#fff}
.du-pw.hero {background:var(--gold);color:#221a06}
.du-pw.wx {background:#3d7bd6}
.du-tag {display:inline-block;margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 10px ui-monospace,monospace}
/* ── 대결 ── */
.du-mull .grid {grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
@media (min-width:600px) {.du-mull .grid {grid-template-columns:repeat(10,minmax(0,1fr))}}
.du-mull .cap {display:none}
.du-card.swapped {outline:3px solid var(--gold);outline-offset:-3px}
.du-mull-left {margin:8px 0;font:700 12px ui-monospace,monospace;color:var(--muted)}
.du-foe {display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0 4px;font:700 11px ui-monospace,monospace;letter-spacing:.04em;color:var(--muted)}
.du-foe .face {width:30px;aspect-ratio:2/3;border-radius:5px;overflow:hidden;background:var(--card2);flex:none}
.du-foe b {color:var(--text);font-size:13px;margin-right:4px}
.du-foe-hand,.du-foe-grave,.du-foe-faction {white-space:nowrap}
.du-foe-faction[data-used="true"] {text-decoration:line-through;opacity:.6}
.du-row {display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;align-items:stretch;margin-bottom:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.du-row[data-side="me"] {border-color:var(--accent-soft)}
.du-row[data-weather="true"] {background:linear-gradient(90deg,#3d7bd633,var(--card) 60%)}
.du-row-head {display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 10px ui-monospace,monospace;letter-spacing:.04em;color:var(--muted);text-align:center}
.du-row-sum {font-size:15px;color:var(--text)}
.du-wx {padding:1px 5px;border-radius:999px;background:#3d7bd6;color:#fff;font-size:10px;animation:du-pop .4s}
.du-units {display:flex;gap:4px;overflow-x:auto;min-height:70px;align-items:center;padding:1px}
.du-units:empty {min-height:52px}   /* 빈 줄은 낮게 — 덮개에서 첫 화면에 막대의 단추까지 든다 */
.du-unit {position:relative;flex:none;width:44px;height:66px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--card2);color:var(--text);font:inherit;cursor:pointer;perspective:300px}
.du-unit.hero {border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.du-unit.cursed {border-color:var(--signal)}
.du-unit.shield::after {content:'';position:absolute;inset:-3px;border:2px solid #7fc8ff;border-radius:9px;pointer-events:none}
.du-art {position:absolute;inset:0;border-radius:5px;overflow:hidden;transform-style:preserve-3d;transition:none}
.du-art .du-face {position:absolute;inset:0;backface-visibility:hidden}
.du-art .du-face.back {transform:rotateY(180deg)}
.du-art img,.du-art .ph {width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.du-unit.variant .du-art {transform:rotateY(180deg)}
.du-unit.variant.flip .du-art {animation:du-flip .55s ease-out forwards}
@keyframes du-flip {from {transform:rotateY(0)} to {transform:rotateY(180deg)}}
@keyframes du-pop {from {transform:scale(.4);opacity:0} to {transform:scale(1);opacity:1}}
.du-unit .du-pw {left:2px;bottom:2px;min-width:20px;padding:1px 4px;font-size:11px;border-radius:5px}
.du-pw.dim {opacity:.6;background:#3d7bd6}
.du-fx {position:absolute;left:50%;top:-4px;z-index:3;transform:translateX(-50%);font:800 13px ui-monospace,monospace;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;animation:du-float .8s ease-out forwards}
.du-fx[data-kind="rise"] {color:var(--gold)} .du-fx[data-kind="dmg"] {color:#ff7a7a} .du-fx[data-kind="buff"] {color:#8fe39a} .du-fx[data-kind="shield"] {color:#7fc8ff} .du-fx[data-kind="dead"] {color:#ccc}
@keyframes du-float {from {opacity:1;transform:translate(-50%,0)} to {opacity:0;transform:translate(-50%,-28px)}}
.du-bar {position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:6px 0;padding:8px 10px;border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:10px;background:var(--bg);font:700 12px ui-monospace,monospace;color:var(--muted)}
.du-score {display:flex;align-items:baseline;gap:6px;font-size:12px}
.du-score b {font-size:20px;color:var(--text)} .du-score b[data-side="foe"] {color:var(--signal)}
.du-first-bonus {color:var(--gold);font-size:11px}
.du-flags span {margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px}
.du-bar-act {display:flex;gap:6px;margin-left:auto}
.du-last-round {flex-basis:100%;color:var(--text);font-size:12px}
.du-turn[data-turn="me"] {color:var(--gold)}
/* 손패는 바닥에 붙는 칸 — 덮개 화면에서 판을 굴려도 손패가 늘 보인다 */
.du-dock {position:sticky;bottom:0;z-index:6;margin-top:10px;padding:2px 10px calc(6px + env(safe-area-inset-bottom));background:var(--bg);border:1px solid var(--line);border-bottom:0;border-top:2px solid var(--accent);border-radius:12px 12px 0 0;box-shadow:0 -10px 24px #0007}
.du-dock .sec {margin:4px 0 2px}
.duel-page .collection-scroll:has(.du-dock) {padding-bottom:0}
.du-hand {display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity}
.du-hand .du-card {flex:none;width:72px;scroll-snap-align:start}
.du-hand .cap {padding:3px 4px 4px;font-size:10px} .du-hand .cnm {min-height:2.6em;max-height:2.6em;line-height:1.3} .du-hand .cap i {display:none}
.du-hand .du-var {top:3px;right:3px;padding:1px 4px;font-size:9px}
.du-detail {position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88dvh;overflow:auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:2px solid var(--accent);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px #000a}
.du-detail-body {display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.du-detail .face {border-radius:10px}
.du-detail h4 {margin:0 0 6px;font:700 17px var(--display)}
.du-detail dl {margin:0;font-size:12px;line-height:1.5} .du-detail dt {color:var(--muted);margin-top:4px} .du-detail dd {margin:0;color:var(--text)}
.du-detail .lore {margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
.du-detail-act {display:flex;gap:8px;margin-top:12px} .du-detail-act #du-play {flex:1}
.du-banner {position:fixed;left:50%;top:38%;z-index:60;transform:translate(-50%,-50%);max-width:calc(100vw - 32px);padding:14px 24px;background:var(--card);border:1px solid var(--gold);border-radius:12px;color:var(--text);font:700 16px var(--display);text-align:center;line-height:1.4;box-shadow:0 10px 30px #000a;animation:du-banner 1.2s forwards;pointer-events:none}
@keyframes du-banner {0% {opacity:0;transform:translate(-50%,-40%)} 15% {opacity:1;transform:translate(-50%,-50%)} 80% {opacity:1} 100% {opacity:0}}
@media (prefers-reduced-motion:reduce) {.du-unit.variant.flip .du-art {animation:none;transform:rotateY(180deg)} .du-fx,.du-wx,.du-banner {animation:none}}
/* ── 결과 · 전적 ── */
.du-result h2 {margin:14px 0 4px;font:700 26px var(--display);letter-spacing:.04em}
.du-result[data-result="win"] h2 {color:var(--gold)} .du-result[data-result="lose"] h2 {color:var(--signal)}
.du-rounds {list-style:none;margin:6px 0 12px;padding:0;display:flex;gap:8px;flex-wrap:wrap;font:700 13px ui-monospace,monospace;color:var(--muted)}
.du-rounds li {padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card)} .du-rounds li b {color:var(--text)}
.du-reveal {display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 14px;padding:14px;border:1px solid var(--gold);border-radius:14px;background:var(--card)}
.du-reveal .du-card {width:min(220px,70vw);cursor:default;animation:du-pop .5s}
.du-reveal .du-card .cap {font-size:13px}
.du-reward-none {margin:10px 0;color:var(--muted);font-size:13px}
.du-result-act {display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.du-stats {margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:12px;background:var(--card)}
.du-stats-head {display:flex;align-items:center;justify-content:space-between;gap:8px} .du-stats-head h3 {margin:0;font:700 16px var(--display)}
.du-stats-line {margin:8px 0;font:700 13px ui-monospace,monospace;color:var(--text)}
.du-stats-tables {display:grid;grid-template-columns:1fr;gap:10px} @media (min-width:600px) {.du-stats-tables {grid-template-columns:repeat(3,minmax(0,1fr))}}
.du-stats table {width:100%;border-collapse:collapse;font-size:12px} .du-stats th {text-align:left;color:var(--accent);font:700 11px ui-monospace,monospace;letter-spacing:.08em;padding:4px 0}
.du-stats td {padding:3px 0;border-top:1px solid var(--line);color:var(--muted)} .du-stats td.win {text-align:right;color:var(--text);font:700 12px ui-monospace,monospace}
.du-stats-nums {display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font:700 12px ui-monospace,monospace;color:var(--muted)}
.du-stats-cards .grid {grid-template-columns:repeat(3,minmax(0,1fr))} @media (min-width:600px) {.du-stats-cards .grid {grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}}
.du-stats-cards .cell {cursor:default} .du-stats-cards .cap i {display:none}
.du-stat {position:absolute;right:4px;bottom:4px;padding:2px 6px;border-radius:6px;background:#000a;color:#fff;font:700 10px ui-monospace,monospace}
.du-stats-factions {list-style:none;margin:6px 0 0;padding:0;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.du-stats-empty {margin:8px 0;color:var(--muted);font-size:13px}
/* ── 줄 표시 — 카드와 판의 줄이 같은 색 ── */
:root {--row-melee:#d9574f;--row-reach:#d9a94a;--row-ranged:#4a8fd9}
.du-row-tag {position:absolute;right:4px;bottom:4px;white-space:nowrap;padding:2px 6px;border-radius:6px;font:700 10px ui-monospace,monospace;letter-spacing:.02em;color:#fff;background:#000a;border-left:4px solid var(--rc)}
.du-row-tag[data-row="melee"],.du-pw.wx[data-row="melee"] {--rc:var(--row-melee)} .du-row-tag[data-row="reach"],.du-pw.wx[data-row="reach"] {--rc:var(--row-reach)} .du-row-tag[data-row="ranged"],.du-pw.wx[data-row="ranged"] {--rc:var(--row-ranged)}
.du-pw.wx {background:var(--rc,#3d7bd6)}
.du-row-head[data-row="melee"] {--rc:var(--row-melee)} .du-row-head[data-row="reach"] {--rc:var(--row-reach)} .du-row-head[data-row="ranged"] {--rc:var(--row-ranged)}
.du-row-head {border-left:4px solid var(--rc);border-radius:4px}
.du-row-head > span:first-child {color:var(--rc)}
.du-hand .du-row-tag {right:3px;bottom:3px;padding:1px 4px;font-size:9px}
.du-detail .du-row-tag {position:static;display:inline-block;margin-left:6px;vertical-align:middle}
/* ── 규칙 한눈에 · 첫 판 길잡이 ── */
.du-rules {margin:10px 0;padding:12px 14px;border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:12px;background:var(--card)}
.du-rules-head {display:flex;align-items:center;justify-content:space-between;gap:8px} .du-rules-head h3 {margin:0;font:700 16px var(--display)}
.du-rules-grid {display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px} @media (min-width:600px) {.du-rules-grid {grid-template-columns:repeat(2,minmax(0,1fr))}}
.du-rule-card {padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--card2)}
.du-rule-card b {display:block;margin-bottom:4px;font:700 14px var(--display)} .du-rule-card p {margin:0;font-size:12px;line-height:1.6;color:var(--muted);word-break:keep-all}
.du-rules-act {display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.du-board .du-rules {position:fixed;left:12px;right:12px;top:10%;z-index:70;max-height:80dvh;overflow:auto;box-shadow:0 14px 40px #000b}
.du-guide {display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;margin:6px 0 0;padding:4px 10px 8px;border:1px solid var(--gold);border-radius:10px;background:var(--accent-soft);font-size:12px;line-height:1.5;color:var(--text);word-break:keep-all}
.du-guide small {grid-column:1;grid-row:1;justify-self:start;padding:2px 6px;border-radius:999px;background:var(--gold);color:#221a06;font:700 10px ui-monospace,monospace}
.du-guide p {grid-column:1/-1;grid-row:2;margin:0}
.du-guide .du-btn {grid-column:2;grid-row:1;justify-self:end;min-height:44px;padding:4px 10px;font-size:11px;background:transparent;border-color:transparent;color:var(--muted)}
.du-help {min-width:44px;padding:0 10px}
</style>

<body class="dex-page duel-page">
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=myth12';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, A = window.AtelierDuel;
const STORE = 'myth_duel_v1';

function Shell({ children }) {
  return html`<main>
    <${WorkspaceHeader} page="duel" />
    <div class="collection-scroll" tabindex="0">${children}</div>
  </main>`;
}
function useData() {
  const [state, set] = useState(null);
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    Promise.all([get('data/card.json'), get('data/skill.json'), get('data/group.json'), get('data/duel.json'), IMG.load()])
      .then(([card, skill, group, duel, img]) => set({ data: { cards: card.cards, skills: skill.skills, img, duel }, group }))
      .catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}
/* 저장 하나 — {v, profile, match}. v 가 다르면 판은 버리고 프로필만 살린다(upgradeProfile) */
function load() {
  try {
    const j = JSON.parse(localStorage.getItem(STORE));
    if (!j || !j.profile) return { profile: null, match: null };
    return { profile: A.upgradeProfile(j.profile), match: j.v === A.VERSION && j.match ? j.match : null };
  } catch { return { profile: null, match: null }; }
}
function save(profile, match) { try { localStorage.setItem(STORE, JSON.stringify({ v: A.VERSION, profile, match })); } catch {} }
function seed() { return (Date.now() ^ Math.floor(Math.random() * 1e9)) | 0; }
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 저장에 모르는 카드 id 가 있을 수 있다 — 이름이 바뀌었거나 변형판의 그림이 내려간 뒤. 컬렉션·덱에서는 걸러 내고, 그런 판은 버린다 */
function sanitise(data, profile, match) {
  const D = A.cardsOf(data), known = id => !!D.cards[id];
  let changed = false;
  if (profile) {
    const owned = profile.owned.filter(known), deck = profile.deck.filter(known);
    if (owned.length !== profile.owned.length || deck.length !== profile.deck.length) { profile = { ...profile, owned, deck }; changed = true; }
  }
  if (match) {
    const ids = [];
    for (const side of ['me', 'foe']) { const sd = match[side] || {}; ids.push(...(sd.hand || []), ...(sd.deck || []), ...(sd.grave || [])); for (const r of A.ROWS) ids.push(...((sd.rows && sd.rows[r]) || []).map(u => u.id)); }
    if (!ids.every(known)) { match = null; changed = true; }
  }
  return { profile, match, changed };
}

/* 그림 — 썸네일을 먼저, 없으면 원본. 파일이 없으면 빈 자리 */
function Thumb({ file, cls }) {
  if (!file) return html`<span class=${'ph ' + (cls || '')}></span>`;
  return html`<img src=${IMG.thumbURL(file)} alt="" loading="lazy" class=${cls}
    onError=${e => { const t = e.currentTarget; if (t.dataset.f) return; t.dataset.f = '1'; t.src = IMG.imgURL(file); }} />`;
}
const mythName = (group, m) => group.myth.name[m] || m;
const mythColor = (group, m) => (group.myth.color && group.myth.color[m]) || 'var(--accent)';
/* 카드 한 칸 — 도감 칸 꼴. art 는 보여 줄 그림 파일(변형판은 자리에 따라 기본 그림을 쓴다) */
function Card({ card, art, group, onClick, cls, attrs, children }) {
  const w = card.variant === 'weather';
  return html`<button type="button" class=${'cell ' + (cls || '')} data-id=${card.id} onClick=${onClick} ...${attrs || {}}>
    <span class="face"><${Thumb} file=${art === undefined ? card.file : art} />
      ${card.variant !== 'base' && html`<span class="du-var" data-variant=${card.variant}>${W('duel.variant.' + card.variant)}</span>`}
      <span class=${'du-pw' + (card.hero ? ' hero' : '') + (w ? ' wx' : '')} data-row=${w ? card.row : undefined}>${w ? W('duel.weather.' + card.row) : card.power}</span>
      ${!w && html`<span class="du-row-tag" data-row=${card.row}>${W('range.short.' + card.row)}</span>`}
      ${children}</span>
    <span class="cap"><span class="cnm">${card.name}</span>
      <i>${mythName(group, card.myth)} · ${W('range.short.' + card.row)}${card.hero ? html`<span class="du-tag">${W('duel.hero')}</span>` : ''}</i></span>
  </button>`;
}
/* 가진 카드를 권 차례 → 이름 → 변형 차례로 */
function sortIds(data, ids) {
  const D = A.cardsOf(data), order = data.duel.bosses.map(b => b.myth);
  return ids.filter(id => D.cards[id]).sort((a, b) => { const x = D.cards[a], y = D.cards[b];
    return (order.indexOf(x.myth) - order.indexOf(y.myth)) || x.name.localeCompare(y.name, 'ko') || (A.VARIANTS.indexOf(x.variant) - A.VARIANTS.indexOf(y.variant)); });
}

/* ── 규칙 한눈에 — 로비의 "배우기" 와 대결의 ? 가 연다 ── */
function Rules({ onClose, onGuideAgain }) {
  return html`<section class="du-rules" role="dialog" aria-label=${W('duel.rules.title')}>
    <div class="du-rules-head"><h3>${W('duel.rules.title')}</h3><button type="button" class="du-btn" id="du-rules-close" onClick=${onClose}>${W('duel.close')}</button></div>
    <div class="du-rules-grid">${[1, 2, 3, 4].map(i => html`<div key=${i} class="du-rule-card"><b>${W('duel.rules.' + i + '.title')}</b><p>${W('duel.rules.' + i + '.text')}</p></div>`)}</div>
    ${onGuideAgain && html`<div class="du-rules-act"><button type="button" class="du-btn" id="du-guide-again" onClick=${onGuideAgain}>${W('duel.guide.again')}</button></div>`}
  </section>`;
}
/* 첫 판 길잡이 — 판의 상태에서 단계를 읽는다. 1 내기 → 2 상대 수 → 3 합과 패스 → 4 라운드 결과 → 5 진영 능력 → 6 변형판·날씨 */
const GUIDE_STEPS = 6;
function guideStep(st) {
  const log = st.log, mePlays = log.filter(e => e.t === 'play' && e.who === 'me').length, foePlays = log.filter(e => e.t === 'play' && e.who === 'foe').length;
  const passed = log.some(e => e.t === 'pass'), rounds = st.roundLog.length;
  let lastRound = -1; log.forEach((e, i) => { if (e.t === 'round') lastRound = i; });
  const mePlaysThisRound = log.slice(lastRound + 1).filter(e => e.t === 'play' && e.who === 'me').length;
  if (!mePlays) return 1;
  if (!foePlays) return 2;
  if (!passed && !rounds) return 3;
  if (rounds && !mePlaysThisRound) return 4;
  if (!st.me.faction.used && st.round < 3) return 5;
  return 6;
}
function Guide({ st, onSkip }) {
  const n = guideStep(st);
  return html`<div class="du-guide" data-step=${n}><small>${W('duel.guide.step', { n, total: GUIDE_STEPS })}</small><p>${W('duel.guide.' + n)}</p>
    <button type="button" class="du-btn" id="du-guide-skip" onClick=${onSkip}>${W('duel.guide.skip')}</button></div>`;
}

/* ── 대결 — 멀리건 ── */
function Mulligan({ data, group, st, actMatch }) {
  const D = A.cardsOf(data);
  const [swapped, setSwapped] = useState([]);
  const left = A.MULLIGAN - st.mulligans;
  return html`<section class="du-screen du-mull" data-screen="mulligan">
    <p class="sec">${W('duel.mull.title')}<span class="help">${W('duel.mull.note')}</span></p>
    <p class="du-mull-left">${W('duel.mull.left', { n: left })}</p>
    <div class="grid">${st.me.hand.map((id, i) => html`<${Card} key=${i} card=${D.cards[id]} art=${D.cards[D.cards[id].name].file} group=${group}
      cls=${'du-card' + (swapped.includes(i) ? ' swapped' : '')} onClick=${() => { if (swapped.includes(i) || left <= 0) return; if (actMatch(m => A.mulligan(m, i)).ok) setSwapped(swapped.concat([i])); }} />`)}</div>
    <button type="button" class="du-btn primary" id="du-mull-go" onClick=${() => actMatch(m => { A.confirm(data, m); return { ok: true }; })}>${W('duel.mull.go')}</button>
  </section>`;
}
/* 유닛의 보이는 값 — 영웅은 cur, 날씨 줄 비영웅은 1, 그 밖 cur */
const shown = (st, row, u) => u.hero ? u.cur : st.weather[row] ? 1 : u.cur;
const fxText = f => f.kind === 'dmg' ? '−' + f.n : f.kind === 'buff' ? '+' + f.n : f.kind === 'shield' ? '◈' : f.kind === 'rise' ? '✦' : '✕';
function Unit({ data, st, side, row, u, flip, onClick }) {
  const D = A.cardsOf(data), c = D.cards[u.id], base = D.cards[c.name], variant = c.variant !== 'base';
  const fx = st.last && st.last.fx.filter(f => f.side === side && f.at === u.at);
  return html`<button type="button" class=${'du-unit' + (u.hero ? ' hero' : '') + (u.cursed ? ' cursed' : '') + (u.shield ? ' shield' : '') + (variant ? ' variant' : '') + (flip ? ' flip' : '')}
    data-at=${u.at} data-id=${u.id} onClick=${onClick}>
    <span class="du-art">${variant
      ? html`<span class="du-face front"><${Thumb} file=${base.file} /></span><span class="du-face back"><${Thumb} file=${c.file} /></span>`
      : html`<span class="du-face"><${Thumb} file=${c.file} /></span>`}</span>
    <span class=${'du-pw' + (u.hero ? ' hero' : '') + (st.weather[row] && !u.hero ? ' dim' : '')}>${shown(st, row, u)}</span>
    ${fx && fx.map((f, i) => html`<span key=${st.log.length + '-' + i} class="du-fx" data-kind=${f.kind}>${fxText(f)}</span>`)}
  </button>`;
}
function Row({ data, st, side, row, sum, onDetail }) {
  const list = st[side].rows[row], last = st.last;
  /* 방금 놓인 카드 — 기본 그림에서 변형 그림으로 뒤집힌다 */
  let fresh = null;
  if (last && last.kind === 'play' && last.who === side) for (const u of list) if (u.id === last.id && (!fresh || u.at > fresh.at)) fresh = u;
  const dead = last && last.fx.filter(f => f.side === side && f.row === row && f.kind === 'dead');
  return html`<div class="du-row" data-side=${side} data-row=${row} data-weather=${st.weather[row] ? 'true' : 'false'}>
    <div class="du-row-head" data-row=${row}><span>${W('range.short.' + row)}</span>
      ${st.weather[row] && html`<span class="du-wx">${W('duel.weather.' + row)}</span>`}
      <span class="du-row-sum">${sum}</span>
      ${dead && dead.map((f, i) => html`<span key=${'d' + st.log.length + i} class="du-fx" data-kind="dead">✕</span>`)}</div>
    <div class="du-units">${list.map(u => html`<${Unit} key=${u.at} data=${data} st=${st} side=${side} row=${row} u=${u} flip=${u === fresh} onClick=${() => onDetail(u.id, false, u)} />`)}</div>
  </div>`;
}
/* 카드 상세 — 손패에서 열면 "내기" 가 붙는다. 변형판도 기본 그림(판에 놓일 때 뒤집힌다) */
function Detail({ data, group, st, id, unit, fromHand, canPlay, onPlay, onClose }) {
  const D = A.cardsOf(data), c = D.cards[id], base = D.cards[c.name], w = c.variant === 'weather';
  const sk = data.skills[data.cards.find(x => x.name === c.name).skill];
  return html`<div class="du-detail" data-id=${id} role="dialog" aria-label=${c.name}>
    <div class="du-detail-body">
      <span class="face"><${Thumb} file=${base.file} />${c.variant !== 'base' && html`<span class="du-var" data-variant=${c.variant}>${W('duel.variant.' + c.variant)}</span>`}</span>
      <div><h4>${c.name}${c.hero ? html`<span class="du-tag">${W('duel.hero')}</span>` : ''}</h4>
        <dl>
          <dt>${W('duel.row')}</dt><dd><span class="du-row-tag" data-row=${c.row}>${W('range.short.' + c.row)}</span>${!w ? ' · ' + W('duel.power') + ' ' + (unit ? unit.cur + (unit.cur !== c.power ? ' (' + c.power + ')' : '') : c.power) : ''}</dd>
          ${w ? html`<dt>${W('duel.weather.' + c.row)}</dt><dd>${W('duel.weather.text')}</dd>`
            : html`<dt>${W('duel.ability')} — ${W('duel.ability.' + c.ability)}${sk ? ' · ' + sk.name : ''}</dt><dd>${W('duel.ability.' + c.ability + '.text', { n: c.n })}</dd>`}
          ${c.variant === 'awaken' || c.variant === 'cursed' ? html`<dt>${W('duel.variant.' + c.variant)}</dt><dd>${W('duel.variant.' + c.variant + '.text')}</dd>` : ''}
          ${c.hero && html`<dt>${W('duel.hero')}</dt><dd>${W('duel.hero.text')}</dd>`}
          <dt>${W('card.myth')}</dt><dd>${mythName(group, c.myth)}${c.wielder ? ' · ' + c.wielder : ''}</dd>
        </dl>
        ${c.text && html`<p class="lore">${c.text}</p>`}</div>
    </div>
    <div class="du-detail-act">
      ${fromHand && html`<button type="button" class="du-btn primary" id="du-play" disabled=${!canPlay} onClick=${onPlay}>${w ? W('duel.weather.call', { w: W('duel.weather.' + c.row) }) : W('duel.play')}</button>`}
      <button type="button" class="du-btn" id="du-close" onClick=${onClose}>${W('duel.close')}</button>
    </div>
  </div>`;
}
/* ── 대결 — 판 ── */
function Match({ data, group, profile, st, actMatch, act }) {
  const D = A.cardsOf(data), boss = A.bossOf(data, st.boss), portrait = D.cards[boss.portrait];
  const sc = A.scores(data, st), L = A.legal(data, st, 'me'), mine = st.turn === 'me' && st.phase === 'play';
  const [detail, setDetail] = useState(null);   /* {id, fromHand, unit} */
  const [banner, setBanner] = useState(null), [help, setHelp] = useState(false);
  const rounds = useRef(st.roundLog.length);
  useEffect(() => {   /* 라운드가 끝난 수에는 결과 한 줄이 떴다 사라진다 */
    if (st.roundLog.length > rounds.current && !reduced()) { setBanner(st.roundLog.length); const t = setTimeout(() => setBanner(null), 1200); rounds.current = st.roundLog.length; return () => clearTimeout(t); }
    rounds.current = st.roundLog.length;
  }, [st.roundLog.length]);
  const lastRound = st.roundLog.length ? st.roundLog[st.roundLog.length - 1] : null;
  const roundText = (r, n) => W('duel.round.' + (r.winner === 'me' ? 'win' : r.winner === 'foe' ? 'lose' : 'draw'), { n, me: r.me, foe: r.foe });
  const open = (id, fromHand, unit) => setDetail({ id, fromHand, unit: unit || null });
  const flags = side => html`<span class="du-flags">${st[side].sealed && html`<span>${W('duel.sealed')}</span>`}${st[side].guard && html`<span>${W('duel.guard')}</span>`}${st[side].astra && html`<span>${W('duel.astra')}</span>`}</span>`;
  return html`<section class="du-screen du-board" data-screen="match">
    <div class="du-foe"><span class="face"><${Thumb} file=${portrait && portrait.file} /></span>
      <span><b>${boss.wielder}</b>${mythName(group, st.boss)} · ${W('duel.lv.' + st.level)}</span>
      <span class="du-foe-hand">${W('duel.foe.hand', { n: st.foe.hand.length })}</span>
      <span class="du-foe-grave">${W('duel.foe.grave', { n: st.foe.grave.length })}</span>
      <span class="du-foe-faction" data-used=${st.foe.faction.used ? 'true' : 'false'}>${data.duel.factions[st.boss].name}</span>${flags('foe')}</div>
    ${['ranged', 'reach', 'melee'].map(r => html`<${Row} key=${'f' + r} data=${data} st=${st} side="foe" row=${r} sum=${sc.foe.rows[r]} onDetail=${open} />`)}
    <div class="du-bar">
      <span class="du-score"><b data-side="me">${sc.me.total}</b>${st.round === 1 && st.coin === 'me' && html`<small class="du-first-bonus">${W('duel.first.bonus', { n: A.FIRST_BONUS })}</small>`}
        <span>:</span><b data-side="foe">${sc.foe.total}</b>${st.round === 1 && st.coin === 'foe' && html`<small class="du-first-bonus">${W('duel.first.bonus', { n: A.FIRST_BONUS })}</small>`}</span>
      <span class="du-round">${W('duel.round', { n: st.round })}</span>
      <span class="du-lives" data-me=${st.lives.me} data-foe=${st.lives.foe}>${W('duel.lives')} ${'♥'.repeat(st.lives.me)}${'♡'.repeat(A.LIVES - st.lives.me)} : ${'♥'.repeat(st.lives.foe)}${'♡'.repeat(A.LIVES - st.lives.foe)}</span>
      <span class="du-turn" data-turn=${st.turn || ''}>${st.passed.me ? W('duel.passed') : W(mine ? 'duel.turn.me' : 'duel.turn.foe')}</span>${flags('me')}
      <span class="du-bar-act">
        <button type="button" class="du-btn du-help" id="du-help" aria-label=${W('duel.rules.title')} title=${W('duel.rules.title')} onClick=${() => setHelp(true)}>?</button>
        <button type="button" class="du-btn" id="du-faction" disabled=${!L.faction} title=${data.duel.factions[profile.main].text} onClick=${() => actMatch(m => A.useFaction(data, m))}>${W('duel.faction.use', { name: data.duel.factions[profile.main].name })}</button>
        <button type="button" class="du-btn" id="du-pass" disabled=${!L.pass} onClick=${() => { setDetail(null); actMatch(m => A.pass(data, m)); }}>${W('duel.pass')}</button>
      </span>
      ${lastRound && html`<span class="du-last-round">${roundText(lastRound, st.roundLog.length)}</span>`}
    </div>
    ${['melee', 'reach', 'ranged'].map(r => html`<${Row} key=${'m' + r} data=${data} st=${st} side="me" row=${r} sum=${sc.me.rows[r]} onDetail=${open} />`)}
    <div class="du-dock">${!profile.tutorial && html`<${Guide} st=${st} onSkip=${() => act(p => { p.tutorial = true; })} />`}<p class="sec">${W('duel.hand', { n: st.me.hand.length })}</p>
    <div class="du-hand">${st.me.hand.map((id, i) => html`<${Card} key=${id + i} card=${D.cards[id]} art=${D.cards[D.cards[id].name].file} group=${group} cls="du-card" onClick=${() => open(id, true)} />`)}</div></div>
    ${detail && html`<${Detail} data=${data} group=${group} st=${st} id=${detail.id} unit=${detail.unit} fromHand=${detail.fromHand} canPlay=${mine && L.cards.includes(detail.id)}
      onPlay=${() => { setDetail(null); actMatch(m => A.play(data, m, detail.id)); }} onClose=${() => setDetail(null)} />`}
    ${help && html`<${Rules} onClose=${() => setHelp(false)} />`}
    ${banner && lastRound && html`<div class="du-banner">${roundText(lastRound, st.roundLog.length)}</div>`}
  </section>`;
}
/* ── 결과 — 승·패·무, 라운드 셋, 얻은 카드를 한 장씩 크게 ── */
function Result({ data, group, st, onLobby, onAgain }) {
  const D = A.cardsOf(data), o = st.outcome, [shown, setShown] = useState(0);
  const cards = (o && o.cards) || [];
  return html`<section class="du-screen du-result" data-screen="result" data-result=${o ? o.result : undefined}>
    ${o && html`<h2>${W('duel.result.' + o.result)}</h2>`}
    <p class="sec">${W('duel.result.rounds')}</p>
    <ul class="du-rounds">${st.roundLog.map((r, i) => html`<li key=${i} data-winner=${r.winner}>${W('duel.round', { n: i + 1 })} <b>${r.me}</b> : <b>${r.foe}</b></li>`)}</ul>
    ${o && html`<p class="sec">${W('duel.result.reward')}<span>${cards.length ? cards.length : ''}</span></p>`}
    ${o && !cards.length && html`<p class="du-reward-none">${W(o.result === 'win' ? 'duel.result.reward.all' : 'duel.result.reward.none')}</p>`}
    ${shown < cards.length && html`<div class="du-reveal">
      <${Card} key=${cards[shown]} card=${D.cards[cards[shown]]} group=${group} cls="du-card" />
      <button type="button" class="du-btn" id="du-reveal-next" onClick=${() => setShown(shown + 1)}>${W('duel.result.reveal')} ${shown + 1}/${cards.length}</button></div>`}
    <div class="du-result-act">
      <button type="button" class="du-btn primary" id="du-result-lobby" onClick=${onLobby}>${W('duel.result.lobby')}</button>
      <button type="button" class="du-btn" id="du-result-again" onClick=${onAgain}>${W('duel.result.again')}</button>
    </div>
  </section>`;
}
/* ── 전적 — 로비에서 열고 닫는 패널 ── */
function Stats({ data, group, profile, onClose }) {
  const D = A.cardsOf(data), v = A.statsView(data, profile), L = v.line;
  const cell = e => e.games ? W('duel.stats.cell', { win: e.win, games: e.games }) : W('duel.stats.none');
  const table = (cls, title, rows, key, name) => html`<table class=${cls}><thead><tr><th colspan="2">${title}</th></tr></thead>
    <tbody>${rows.map(r => html`<tr key=${r[key]} ...${{ ['data-' + (key === 'level' ? 'lv' : 'myth')]: r[key] }}><td>${name(r)}</td><td class="win">${cell(r)}</td></tr>`)}</tbody></table>`;
  return html`<section class="du-stats" aria-label=${W('duel.stats')}>
    <div class="du-stats-head"><h3>${W('duel.stats')}</h3><button type="button" class="du-btn" id="du-stats-close" onClick=${onClose}>${W('duel.stats.close')}</button></div>
    ${!L.games ? html`<p class="du-stats-empty">${W('duel.stats.empty')}</p>` : html`
      <p class="du-stats-line">${W('duel.stats.line', { games: L.games, win: L.win, lose: L.lose, draw: L.draw, streak: L.streak, best: L.best })}</p>
      <div class="du-stats-tables">
        ${table('du-stats-boss', W('duel.stats.byBoss'), v.byBoss, 'myth', r => A.bossOf(data, r.myth).wielder)}
        ${table('du-stats-level', W('duel.stats.byLevel'), v.byLevel, 'level', r => W('duel.lv.' + r.level))}
        ${table('du-stats-main', W('duel.stats.byMain'), v.byMain, 'myth', r => mythName(group, r.myth))}
      </div>
      <div class="du-stats-nums"><span class="du-stats-best">${W('duel.stats.best', { n: v.bestRound })}</span><span class="du-stats-rounds">${W('duel.stats.rounds', { n: v.avgRounds === null ? W('duel.stats.none') : v.avgRounds })}</span></div>
      <div class="du-stats-cards"><p class="sec">${W('duel.stats.cards')}<span class="help">${W('duel.stats.cards.note')}</span></p>
        <div class="grid">${v.cards.filter(c => D.cards[c.id]).map(c => html`<${Card} key=${c.id} card=${D.cards[c.id]} group=${group}>
          <span class="du-stat">${W('duel.stats.card', { played: c.played, rate: c.rate === null ? W('duel.stats.none') : Math.round(c.rate * 100) + '%' })}</span><//>`)}</div></div>
      ${v.factions.length ? html`<p class="sec">${W('duel.stats.factions')}</p><ul class="du-stats-factions">${v.factions.map(f => html`<li key=${f.myth} data-myth=${f.myth}>${data.duel.factions[f.myth].name} ${f.n}</li>`)}</ul>` : ''}`}
  </section>`;
}
/* ── 첫 고르기 — 주 신화권 ── */
function Pick({ data, group, onPick }) {
  const [myth, setMyth] = useState(null);
  return html`<section class="du-screen du-pick" data-screen="pick">
    <p class="sec">${W('duel.pick.title')}</p>
    <p class="note">${W('duel.pick.note')}</p>
    <div class="du-myths" role="group" aria-label=${W('duel.pick.title')}>${data.duel.bosses.map(b => html`<button key=${b.myth} type="button"
      class=${'du-myth' + (myth === b.myth ? ' on' : '')} data-myth=${b.myth} style=${'--mc:' + mythColor(group, b.myth)} aria-pressed=${myth === b.myth} onClick=${() => setMyth(b.myth)}>
      <span>${mythName(group, b.myth)}<small>${data.duel.factions[b.myth].name} · ${b.wielder}</small></span></button>`)}</div>
    <button type="button" class="du-btn primary" id="du-pick-go" disabled=${!myth} onClick=${() => onPick(myth)}>${W('duel.pick.go')}</button>
  </section>`;
}

/* ── 로비 — 덱 상태 · 컬렉션 · 난이도 · 주인 열하나 ── */
function Lobby({ data, group, profile, act, setScreen, onChallenge, stats, learn }) {
  const D = A.cardsOf(data), v = A.validateDeck(data, profile), max = A.collectionMax(data);
  const conquered = A.conquered(data, profile);
  return html`<section class="du-screen du-lobby" data-screen="lobby">
    <div class="du-head">
      <span>${W('duel.lobby.main')} <b class="du-main">${mythName(group, profile.main)}</b></span>
      <span class="du-deck" data-ok=${v.ok ? 'true' : 'false'}><b>${W('duel.lobby.deck', { n: v.n, max: A.DECK })}</b> ${W(v.ok ? 'duel.lobby.deck.ok' : 'duel.lobby.deck.bad')}</span>
      <span class="du-coll">${W('duel.lobby.collection', { n: profile.owned.length, max })}</span>
    </div>
    <div class="du-tools">
      <button type="button" class="du-btn" id="du-build" onClick=${() => setScreen('build')}>${W('duel.lobby.build')}</button>
      <button type="button" class="du-btn" id="du-stats" onClick=${() => setScreen('stats')}>${W('duel.lobby.stats')}</button>
      <button type="button" class="du-btn" id="du-learn" onClick=${() => setScreen('learn')}>${W('duel.learn')}</button>
    </div>
    ${learn && html`<${Rules} onClose=${() => setScreen('lobby')} onGuideAgain=${() => { act(p => { p.tutorial = false; }); setScreen('lobby'); }} />`}
    ${stats && html`<${Stats} data=${data} group=${group} profile=${profile} onClose=${() => setScreen('lobby')} />`}
    <p class="sec">${W('duel.lobby.level')}<span class="help">${W('duel.lv.note')}</span></p>
    <div class="du-lv" role="group" aria-label=${W('duel.lobby.level')}>${A.LEVELS.map(l => html`<button key=${l} type="button" data-lv=${l}
      class=${profile.level === l ? 'on' : ''} aria-pressed=${profile.level === l} onClick=${() => act(p => { p.level = l; })}>${W('duel.lv.' + l)}</button>`)}</div>
    ${conquered && html`<div class="du-conquered">${W('duel.lobby.conquered')}</div>`}
    <p class="sec">${W('duel.lobby.bosses')}<span class="help">${W('duel.lobby.bosses.note')}</span></p>
    <div class="du-bosses">${data.duel.bosses.map(b => { const c = D.cards[b.portrait]; return html`<button key=${b.myth} type="button" class="du-boss" data-myth=${b.myth}
      disabled=${!v.ok} onClick=${() => onChallenge(b.myth)}>
      <span class="face"><${Thumb} file=${c && c.file} /></span>
      <span><b>${b.wielder}</b><small>${mythName(group, b.myth)} · ${data.duel.factions[b.myth].name}</small>
        <small>${W('duel.boss.wins', { n: A.winsOf(profile, b.myth) })} · ${W('duel.boss.go')}</small></span></button>`; })}</div>
  </section>`;
}

/* ── 덱 짜기 — 주 권 · 규칙 줄 · 컬렉션 그리드 ── */
function Build({ data, group, profile, act, setScreen }) {
  const D = A.cardsOf(data), v = A.validateDeck(data, profile), ids = useMemo(() => sortIds(data, profile.owned), [profile.owned]);
  const rule = (key, text) => html`<span data-rule=${key} class=${v.problems.includes(key) ? 'bad' : ''}>${text}</span>`;
  return html`<section class="du-screen du-build" data-screen="build">
    <p class="sec">${W('duel.build')}<span class="help">${W('duel.build.note')}</span></p>
    <div class="du-main-pick" role="group" aria-label=${W('duel.lobby.main')}>${data.duel.bosses.map(b => html`<button key=${b.myth} type="button" data-myth=${b.myth}
      style=${'--mc:' + mythColor(group, b.myth)} class=${profile.main === b.myth ? 'on' : ''} aria-pressed=${profile.main === b.myth} onClick=${() => act(p => A.setMain(p, b.myth))}>${mythName(group, b.myth)}</button>`)}</div>
    <div class="du-rule" data-ok=${v.ok ? 'true' : 'false'}>
      ${rule('count', W('duel.build.rule.count', { n: v.n }))}${rule('main', W('duel.build.rule.main', { n: v.main }))}
      ${rule('hero', W('duel.build.rule.hero', { n: v.hero }))}${rule('weather', W('duel.build.rule.weather', { n: v.weather }))}
    </div>
    <p class="du-why">${v.problems.map(k => W('duel.why.' + k)).join(' · ')}</p>
    <button type="button" class="du-btn primary" id="du-build-done" onClick=${() => setScreen('lobby')}>${W('duel.build.done')}</button>
    <div class="grid">${ids.map(id => html`<${Card} key=${id} card=${D.cards[id]} group=${group} cls=${profile.deck.includes(id) ? 'in' : ''}
      attrs=${{ 'aria-pressed': profile.deck.includes(id) }} onClick=${() => act(p => A.toggleDeck(data, p, id))} />`)}</div>
  </section>`;
}

function App() {
  const loaded = useData();
  const [saved] = useState(load);
  const [profile, setProfile] = useState(saved.profile), [match, setMatch] = useState(saved.match);
  const [screen, setScreen] = useState('lobby');   /* 'lobby' | 'build' | 'stats' — 판이 있으면 판이 앞선다 */
  const data = loaded && loaded.data, group = loaded && loaded.group;
  const cleaned = useRef(false);
  if (data && !cleaned.current) {   /* 자료를 읽은 첫 그리기 — 모르는 id 를 걸러 낸 뒤에 그린다 */
    cleaned.current = true;
    const r = sanitise(data, profile, match);
    if (r.changed) { save(r.profile, r.match); setProfile(r.profile); setMatch(r.match); }
  }
  /* 판을 고치는 손 — 사본에 엔진 함수를 적용하고 저장 */
  const actMatch = fn => { const next = JSON.parse(JSON.stringify(match)); const r = fn(next) || { ok: true }; if (r.ok !== false) { save(profile, next); setMatch(next); } return r; };
  /* 상대 턴 — 0.6초 뒤 한 수. 움직임 줄이기면 바로 */
  useEffect(() => {
    if (!data || !match || match.phase !== 'play' || match.turn !== 'foe') return;
    const t = setTimeout(() => actMatch(m => A.aiTurn(data, m)), reduced() ? 0 : 600);
    return () => clearTimeout(t);
  }, [match, data]);
  /* 판이 끝나면 한 번만 정산 — 보상과 통계. st.rewarded 가 두 번을 막는다(새로고침해도) */
  useEffect(() => {
    if (!data || !match || match.phase !== 'done' || match.rewarded) return;
    const p = JSON.parse(JSON.stringify(profile)), m = JSON.parse(JSON.stringify(match));
    A.settle(data, p, m); p.tutorial = true; save(p, m); setProfile(p); setMatch(m);
  }, [match, data]);
  if (!loaded) return html`<${Shell}><p class="empty">${W('ui.loading')}</p><//>`;
  if (loaded.error) return html`<${Shell}><p class="empty">${W('ui.error', { message: loaded.error })}</p><//>`;
  /* 프로필을 고치는 손 — 사본을 고치고 저장 */
  const act = fn => { const next = JSON.parse(JSON.stringify(profile)); fn(next); save(next, match); setProfile(next); };
  const onPick = myth => { const p = A.newProfile(data, myth, seed()); save(p, null); setProfile(p); };
  const onChallenge = myth => { const m = A.newMatch(data, profile, myth, profile.level, seed()); save(profile, m); setMatch(m); };
  const onLobby = () => { save(profile, null); setMatch(null); setScreen('lobby'); };
  const onAgain = () => { const m = A.newMatch(data, profile, match.boss, match.level, seed()); save(profile, m); setMatch(m); };
  const which = !profile ? 'pick' : match && match.phase === 'mulligan' ? 'mulligan' : match && match.phase === 'play' ? 'match' : match ? 'result' : screen;
  return html`<${Shell}>
    ${which === 'pick' ? html`<${Pick} data=${data} group=${group} onPick=${onPick} />`
    : which === 'mulligan' ? html`<${Mulligan} data=${data} group=${group} st=${match} actMatch=${actMatch} />`
    : which === 'match' ? html`<${Match} data=${data} group=${group} profile=${profile} st=${match} actMatch=${actMatch} act=${act} />`
    : which === 'result' ? html`<${Result} data=${data} group=${group} st=${match} onLobby=${onLobby} onAgain=${onAgain} />`
    : which === 'build' ? html`<${Build} data=${data} group=${group} profile=${profile} act=${act} setScreen=${setScreen} />`
    : html`<${Lobby} data=${data} group=${group} profile=${profile} act=${act} setScreen=${setScreen} onChallenge=${onChallenge} stats=${which === 'stats'} learn=${which === 'learn'} />`}
  <//>`;
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

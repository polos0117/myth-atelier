<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f9f6ef">
<title>신화 무기 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth4">
<script src="lib/workspace-theme.js?v=myth3"></script>
<script src="lib/words.js?v=myth3"></script>
<script src="lib/img.js?v=myth1"></script>
<script src="lib/patch.js?v=1"></script>
<script src="lib/fresh.js?v=4"></script>
</head>
<body class="prompt-page lab-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import {h,render} from 'https://esm.sh/preact@10.24.3';
import {useState,useEffect,useRef} from 'https://esm.sh/preact@10.24.3/hooks';
import {WorkspaceHeader,ThemeGallery} from './lib/workspace-ui.js?v=myth3';
const W=window.W,IMG=window.AtelierImg;
/* 패치 기록 — docs/PATCH.md 를 그대로 읽는다. 열 때 한 번만 받아 온다.
   닫혀 있으면 단추만 그려 집 화면의 자리를 건드리지 않는다. */
function Patch(){
  const [open,setOpen]=useState(false),[log,setLog]=useState(null);
  useEffect(()=>{
    if(!open||log)return;
    fetch(window.AtelierPatch.PATH,{cache:'no-cache'})
      .then(r=>r.ok?r.text():Promise.reject(new Error(String(r.status))))
      .then(t=>setLog({entries:window.AtelierPatch.parse(t)}))
      .catch(()=>setLog({entries:[],failed:true}));
  },[open,log]);
  if(!open)return h('button',{type:'button',class:'patch-open',onClick:()=>setOpen(true)},
    h('span',{'aria-hidden':'true'},'◷'),W('home.patch.open'));
  return h('section',{class:'patch-panel','aria-label':W('home.patch')},
    h('div',{class:'patch-head'},
      h('div',null,h('h3',null,W('home.patch')),h('p',null,W('home.patch.note'))),
      h('button',{type:'button',class:'patch-close',onClick:()=>setOpen(false)},W('home.patch.close'))),
    !log?h('p',{class:'patch-empty'},W('home.patch.loading')):
    log.failed?h('p',{class:'patch-empty'},W('home.patch.fail')):
    !log.entries.length?h('p',{class:'patch-empty'},W('home.patch.none')):
    h('ul',{class:'patch-list'},log.entries.map((e,i)=>
      h('li',{class:'patch-entry',key:i},
        h('div',{class:'patch-when'},h('span',null,e.date),h('span',{class:'patch-who'},e.who)),
        h('strong',null,e.title),
        !!e.items.length&&h('ul',null,e.items.map((x,j)=>h('li',{key:j},x)))))));
}
/* 신전 홀 — 올라온 무기 그림이 제단 위 금 고리를 돈다. 그림이 없으면 이름표를 세운다.
   CSS 3D 뿐이라 라이브러리가 없고, 손이 닿으면 홀이 그쪽으로 살짝 기운다 */
const MOTES=[[8,11,0],[17,13,2],[26,9,5],[35,14,1],[44,10,7],[53,12,3],[62,9,6],[71,13,2],[80,11,8],[89,10,4],[95,12,1],[3,14,6]];
function Hall(){
  const [cards,setCards]=useState(null),[broken,setBroken]=useState({}),box=useRef(null);
  useEffect(()=>{
    let live=true;
    Promise.all([fetch('data/card.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{cards:[]}),IMG.load().catch(()=>({}))])
      .then(([cj,img])=>{
        if(!live)return;
        const all=(cj.cards||[]).map(c=>({name:c.name,file:IMG.portraitOf(img[c.name],'f')}));
        const shot=all.filter(c=>c.file).slice(0,12),rest=all.filter(c=>!c.file);
        while(shot.length<8&&rest.length)shot.push(rest.shift());
        setCards(shot);
      }).catch(()=>{if(live)setCards([]);});
    return()=>{live=false};
  },[]);
  const tilt=e=>{
    const el=box.current;if(!el)return;
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.setProperty('--ty',(x*10).toFixed(2)+'deg');el.style.setProperty('--tx',(-y*6).toFixed(2)+'deg');
  };
  const rest=()=>{const el=box.current;if(el){el.style.setProperty('--tx','0deg');el.style.setProperty('--ty','0deg');}};
  const n=cards?cards.length:0;
  return h('section',{class:'hall',ref:box,'aria-label':W('home.hall'),onPointerMove:tilt,onPointerLeave:rest},
    h('div',{class:'hall-halo','aria-hidden':'true'}),
    h('div',{class:'hall-fog','aria-hidden':'true'}),
    h('div',{class:'hall-scene','aria-hidden':'true'},
      h('div',{class:'hall-floor'}),
      [0,1,2,3,4,5].map(i=>h('div',{class:'hall-col',key:i})),
      h('div',{class:'hall-rings'},h('div',{class:'hall-ring'}),h('div',{class:'hall-ring'}),h('div',{class:'hall-ring'})),
      h('div',{class:'hall-carousel'},(cards||[]).map((c,i)=>{
        const a='--a:'+Math.round(i*360/n)+'deg';
        return c.file&&!broken[c.name]
          ?h('div',{class:'hall-card',key:c.name,style:a},
              h('img',{src:IMG.thumbURL(c.file),alt:'',loading:'lazy',decoding:'async',
                onError:()=>setBroken(b=>({...b,[c.name]:true}))}),h('b',null,c.name))
          :h('div',{class:'hall-card blank',key:c.name,style:a},c.name);
      })),
      MOTES.map(([x,d,w],i)=>h('span',{class:'hall-mote',key:i,style:'--x:'+x+'%;--d:'+d+'s;--w:-'+w+'s'}))),
    h('div',{class:'hall-copy'},
      h('div',{class:'eyebrow'},W('home.hall'),h('span',null,' / '+W('home.hall.note'))),
      h('h2',null,W('home.title')),h('p',null,W('home.intro')),
      h('span',{class:'lab-tag'},W('home.tag'))));
}
function App(){
  return h('div',null,
    h(WorkspaceHeader,{page:'index'}),
    h(Hall),
    h(Patch),
    h('div',{class:'lab-links'},['dex','auto','prompt'].map(key=>
      h('a',{class:'lab-link',href:key+'.html',key},
        h('small',null,W('home.'+key+'.code')),h('h3',null,W('home.'+key+'.title')),
        h('p',null,W('home.'+key+'.note')),h('span',{class:'lab-arrow','aria-hidden':'true'},'↗')))),
    h(ThemeGallery));
}
render(h(App),document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

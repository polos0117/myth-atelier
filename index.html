<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>신화 무기 공방</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth24">
<script src="lib/workspace-theme.js?v=myth8"></script>
<script src="lib/words.js?v=myth25"></script>
<script src="lib/img.js?v=myth5"></script>
<script src="lib/patch.js?v=1"></script>
<script src="lib/fresh.js?v=4"></script>
</head>
<body class="prompt-page lab-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import {h,render} from 'https://esm.sh/preact@10.24.3';
import {useState,useEffect,useRef} from 'https://esm.sh/preact@10.24.3/hooks';
import {WorkspaceHeader,ThemeGallery} from './lib/workspace-ui.js?v=myth9';
const W=window.W,IMG=window.AtelierImg;
/* 패치 기록 — docs/PATCH.md 를 그대로 읽는다. 열 때 한 번만 받아 온다.
   닫혀 있으면 단추만 그려 집 화면의 자리를 건드리지 않는다. */
function Patch(){
  const [open,setOpen]=useState(false),[log,setLog]=useState(null);
  useEffect(()=>{
    if(!open||log)return;
    fetch(window.AtelierPatch.PATH,{cache:'no-cache'})
      .then(r=>r.ok?r.text():Promise.reject(new Error(String(r.status))))
      .then(t=>setLog({entries:window.AtelierPatch.parse(t)}))
      .catch(()=>setLog({entries:[],failed:true}));
  },[open,log]);
  if(!open)return h('button',{type:'button',class:'patch-open',onClick:()=>setOpen(true)},
    h('span',{'aria-hidden':'true'},'◷'),W('home.patch.open'));
  return h('section',{class:'patch-panel','aria-label':W('home.patch')},
    h('div',{class:'patch-head'},
      h('div',null,h('h3',null,W('home.patch')),h('p',null,W('home.patch.note'))),
      h('button',{type:'button',class:'patch-close',onClick:()=>setOpen(false)},W('home.patch.close'))),
    !log?h('p',{class:'patch-empty'},W('home.patch.loading')):
    log.failed?h('p',{class:'patch-empty'},W('home.patch.fail')):
    !log.entries.length?h('p',{class:'patch-empty'},W('home.patch.none')):
    h('ul',{class:'patch-list'},log.entries.map((e,i)=>
      h('li',{class:'patch-entry',key:i},
        h('div',{class:'patch-when'},h('span',null,e.date),h('span',{class:'patch-who'},e.who)),
        h('strong',null,e.title),
        !!e.items.length&&h('ul',null,e.items.map((x,j)=>h('li',{key:j},x)))))));
}
/* 신전 홀 — 올라온 무기 그림이 제단 위 금 고리를 돈다. 그림이 없으면 이름표를 세운다.
   CSS 3D 뿐이라 라이브러리가 없고, 손이 닿으면 홀이 그쪽으로 살짝 기운다 */
const MOTES=[[8,11,0],[17,13,2],[26,9,5],[35,14,1],[44,10,7],[53,12,3],[62,9,6],[71,13,2],[80,11,8],[89,10,4],[95,12,1],[3,14,6]];
function Hall(){
  const [cards,setCards]=useState(null),[picked,setPicked]=useState(false),[broken,setBroken]=useState({}),[mode,setMode]=useState('base'),box=useRef(null);
  const [theme,setTheme]=useState(()=>IMG.hallTheme());
  useEffect(()=>{const on=()=>setTheme(IMG.hallTheme());addEventListener('atelier-appearance',on);return()=>removeEventListener('atelier-appearance',on);},[]);
  useEffect(()=>{
    let live=true;
    const get=f=>fetch(f,{cache:'no-cache'}).then(r=>r.ok?r.json():{});
    Promise.all([get('data/card.json'),get('data/group.json'),IMG.load().catch(()=>({}))])
      .then(([cj,group,img])=>{
        if(!live)return;
        const temple=(group.temple||{})[theme]||null;
        /* 기본·각성·저주 세 장. coverOf 는 없으면 한 단계 아래로 내려오므로 기본과 같으면 없는 것으로 친다 */
        /* 기본·각성·저주 세 장 — 입은 스킨이 있으면 스킨의 것(hallShotsOf) */
        const all=(cj.cards||[]).map(c=>({name:c.name,...IMG.hallShotsOf(img[c.name],c.name)}));
        /* 이 신전에 도감에서 모신 무기가 있으면 그 차례로. 없으면 이 신전의 신화권(만신전은 전부)에서 그림 있는 것을
           무작위로 열둘 — 그 권의 그림이 여덟이 안 되면 다른 권의 그림으로 채운다 */
        const myth=Object.fromEntries((cj.cards||[]).map(c=>[c.name,c.myth]));
        const by=Object.fromEntries(all.map(c=>[c.name,c])),picked=IMG.hallPicks(theme).map(n=>by[n]).filter(Boolean);
        const shuffle=l=>{for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]];}return l;};
        let shot;
        if(picked.length)shot=picked;
        else{
          shot=shuffle(all.filter(c=>c.file&&(!temple||myth[c.name]===temple))).slice(0,IMG.HALL_MAX);
          if(shot.length<8)shot=shot.concat(shuffle(all.filter(c=>c.file&&!shot.includes(c))).slice(0,IMG.HALL_MAX-shot.length));
          const rest=all.filter(c=>!c.file);while(shot.length<8&&rest.length)shot.push(rest.shift());
        }
        setPicked(!!picked.length);setCards(shot);
      }).catch(()=>{if(live)setCards([]);});
    return()=>{live=false};
  },[theme]);
  const tilt=e=>{
    const el=box.current;if(!el)return;
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.setProperty('--ty',(x*10).toFixed(2)+'deg');el.style.setProperty('--tx',(-y*6).toFixed(2)+'deg');
  };
  const rest=()=>{const el=box.current;if(el){el.style.setProperty('--tx','0deg');el.style.setProperty('--ty','0deg');}};
  const toggle=m=>setMode(v=>v===m?'base':m);
  const n=cards?cards.length:0;
  /* 썸네일이 아직 없으면(막 올린 그림) 원본으로 한 번 더, 그래도 안 되면 이름표 */
  const pic=(c,slot,file)=>h('img',{key:slot,class:(slot===(c[mode]&&!broken[c.name+mode]?mode:'file')?'on':''),src:IMG.thumbURL(file),alt:'',loading:'lazy',decoding:'async',
    onError:e=>{const t=e.currentTarget;if(!t.dataset.full){t.dataset.full='1';t.src=IMG.imgURL(file);return;}setBroken(b=>({...b,[c.name+slot]:true}));}});
  return h('section',{class:'hall',ref:box,'data-mode':mode,'aria-label':W('home.hall'),onPointerMove:tilt,onPointerLeave:rest},
    h('div',{class:'hall-halo','aria-hidden':'true'}),
    h('div',{class:'hall-fog','aria-hidden':'true'}),
    h('div',{class:'hall-scene','aria-hidden':'true'},
      h('div',{class:'hall-floor'}),
      [0,1,2,3,4,5].map(i=>h('div',{class:'hall-col',key:i},h('i'))),
      h('div',{class:'hall-back'},h('i')),
      h('div',{class:'hall-rings'},h('div',{class:'hall-ring'}),h('div',{class:'hall-ring'}),h('div',{class:'hall-ring'})),
      h('div',{class:'hall-carousel'},(cards||[]).map((c,i)=>{
        const a='--a:'+Math.round(i*360/n)+'deg';
        if(!c.file||broken[c.name+'file'])return h('div',{class:'hall-card blank',key:c.name,style:a,'data-name':c.name,'data-file':c.file||undefined},c.name);
        return h('div',{class:'hall-card',key:c.name,style:a,'data-name':c.name,'data-file':c.file},
          pic(c,'file',c.file),c.awaken&&pic(c,'awaken',c.awaken),c.cursed&&pic(c,'cursed',c.cursed),h('b',null,c.name));
      })),
      MOTES.map(([x,d,w],i)=>h('span',{class:'hall-mote',key:i,style:'--x:'+x+'%;--d:'+d+'s;--w:-'+w+'s'}))),
    h('div',{class:'hall-copy'},
      h('div',{class:'eyebrow'},W('home.hall'),h('span',null,' / '+W(mode==='base'?'home.hall.note':'home.hall.note.'+mode))),
      h('h2',null,W('home.title')),h('p',null,W('home.intro')),
      h('span',{class:'lab-tag'},W('home.tag')),
      h('span',{class:'hall-modes',role:'group','aria-label':W('home.hall.modes')},
        ['awaken','cursed'].map(m=>h('button',{key:m,type:'button',class:'hall-mode','data-mode':m,'aria-pressed':mode===m,onClick:()=>toggle(m)},W('home.hall.'+m)))),
      h('a',{class:'hall-pick',href:'dex.html'},W(picked?'home.hall.picked':'home.hall.pick',{temple:W('theme.'+theme)}),' ↗')));
}
function App(){
  return h('div',null,
    h(WorkspaceHeader,{page:'index'}),
    h(Hall),
    h(Patch),
    h('div',{class:'lab-links'},['dex','auto','run','draft','prompt'].map(key=>
      h('a',{class:'lab-link',href:key+'.html',key},
        h('small',null,W('home.'+key+'.code')),h('h3',null,W('home.'+key+'.title')),
        h('p',null,W('home.'+key+'.note')),h('span',{class:'lab-arrow','aria-hidden':'true'},'↗')))),
    h(ThemeGallery));
}
render(h(App),document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

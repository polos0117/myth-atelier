<!--
  박물관 — 도감의 그림을 3D 전시실에 걸고 걸어 다니며 본다. 가운데 둥근 홀에서 신화권마다 전시실이 뻗는다.
  액자는 도감이 쓰는 썸네일로 걸고, 가까이 선 액자만 원본으로 바꾼다. 상태(기본·각성·저주)를 바꾸면
  그림과 함께 전시실의 빛·안개·먼지가 바뀐다. 그림이 없는 상태는 기본 그림을 그 상태의 빛으로 물들인다.
  3D 는 Babylon.js(jsDelivr) — 빛 번짐·톤·가장자리 그늘, 가까운 액자에 옮겨 다는 스포트라이트, 대리석 바닥, 입자.
  화면이 읽는 그림 목록은 도감과 같이 data/img.json 뿐이다.
-->

<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=myth9';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, V = 'f';

/* ── 건물 치수(미터). 가운데 둥근 홀(반지름 R)에서 신화권마다 긴 전시실이 바퀴살처럼 뻗는다 ── */
/* 홀 반지름은 신화권 수에서 — 문 사이가 좁아지지 않게 늘어난다(아홉 권까지 14m). 방 길이는 그 권의 무기 수에서 */
const ROOM_W = 7, ROOM_H = 5, DOOR_H = 3.6, EYE = 1.65, STEP = 3.7, SPEED = 3.4;
const ART_W = 1.5, ART_H = 2.25, ART_SELF = 0.92, ART_LIT = 0.2;
let R = 14, HALF = 0, R_IN = 0;
function layout(n) {
  R = Math.max(14, 4.6 / Math.sin(Math.PI / Math.max(n, 2)) + 0.3);
  HALF = Math.asin((ROOM_W / 2) / R); R_IN = R * Math.cos(HALF) - 0.05;
}
/* 박물관 그림 — group.json 의 museum 에 적힌 것만 그림 저장소 ui/ 에서 받는다. 없으면 코드가 그린 것 그대로 */
const uiURL = f => IMG.BASE + 'ui/' + f;
function roomArt(data, myth, what) { const r = (data.group.museum && data.group.museum.rooms || {})[myth]; return Array.isArray(r) && r.includes(what) ? uiURL('museum_' + myth + '_' + what + '.webp') : null; }

function useData() {
  const [state, set] = useState(null);
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    Promise.all([get('data/card.json'), get('data/group.json'), get('data/skill.json'), IMG.load()])
      .then(([card, group, skill, img]) => set({ cards: card.cards, group, skills: skill.skills, img }))
      .catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}

/* 한 무기의 세 그림. 가장 그림이 많은 화풍의 것을 건다 */
function filesOf(entry) {
  const bs = IMG.styleMap(entry), keys = Object.keys(bs).filter(k => bs[k][V]);
  if (!keys.length) return null;
  const best = keys.sort((a, b) => IMG.shotsOf(bs[b], V).length - IMG.shotsOf(bs[a], V).length)[0], b = bs[best];
  return { base: b[V], awaken: IMG.awakenOf(b, V), cursed: IMG.cursedOf(b, V) };
}
/* 전시 차례 — 신화권 차례, 권 안에서는 값 높은 것부터(도감과 같다) */
function exhibits(data) {
  return data.group.myth.order.map((myth, i) => ({
    myth, index: i, angle: i * Math.PI * 2 / data.group.myth.order.length,
    cards: data.cards.filter(c => c.myth === myth).sort((a, b) => b.cost - a.cost || a.name.localeCompare(b.name, 'ko'))
  }));
}
const css = (name, fallback) => (getComputedStyle(document.documentElement).getPropertyValue(name).trim() || fallback);

/* ── 상태마다의 공기 — 안개·빛·벽·액자 테두리·조명·먼지·화면 효과(빛 번짐·가장자리 그늘·색 번짐). 기본은 지금 테마 색에서 온다 ── */
function moods() {
  const bg = css('--bg', '#121016'), card = css('--card2', '#2a2433'), gold = css('--gold', '#d9b45a');
  return {
    /* 기본 — 횃불 켠 궁전 전시실: 따뜻하게 밝고, 검은 대리석 바닥이 빛을 비추고, 붉은 휘장과 금 장식 */
    base:   { fog: '#2a1810', fogStart: 26, fogEnd: 110, hemi: 1.05, hemiC: '#ffe6c8', ground: '#8a6448', wall: '#5a4436', wallT: '#e8dccb', floor: '#ffffff', ceil: '#6a5038', frame: gold, emis: 0.3,
              spot: '#ffe2b8', spotI: 1.5, strip: '#ffe0a8', glow: 0.55, bloom: 0.35, thresh: 0.78, expo: 1.3, contrast: 1.2, vig: '#000000', vigW: 0.9, chroma: 0, grain: 0, sharp: 0.35,
              fire: ['#fff2c0', '#ff8a2a', '#c8360e'], fireL: '#ffa850', fireI: 1.4, mirror: 0.32, banner: 1,
              p: { rate: 70, c1: '#ffd9a0', c2: '#ff9a40', dir: 0.25, grav: 0.02, size: [0.012, 0.035], life: [3, 6] }, art: '#8c8c8c' },
    awaken: { fog: '#3b2a10', fogStart: 18, fogEnd: 90, hemi: 1.1, hemiC: '#ffe2a0', ground: '#8a6a30', wall: '#8a6a30', wallT: '#ffe2a8', floor: '#ffe0a0', ceil: '#4a3616', frame: '#ffd77a', emis: 0.9,
              spot: '#ffd98a', spotI: 1.6, strip: '#fff0b8', glow: 0.8, bloom: 0.35, thresh: 0.82, expo: 1.2, contrast: 1.15, vig: '#5a3a00', vigW: 1.4, chroma: 0, grain: 0, sharp: 0.3,
              fire: ['#ffffff', '#ffe27a', '#ffb347'], fireL: '#ffd98a', fireI: 1.8, mirror: 0.36, banner: 1,
              p: { rate: 260, c1: '#fff0b0', c2: '#ffb347', dir: 0.9, grav: 0.05, size: [0.02, 0.07], life: [2.5, 4.5] }, art: '#a09080', tint: '#ffe9b0' },
    cursed: { fog: '#16040a', fogStart: 4, fogEnd: 40, hemi: 0.5, hemiC: '#ff8a9a', ground: '#1e0a0e', wall: '#4a1418', wallT: '#8a3a44', floor: '#b05060', ceil: '#140608', frame: '#c0143c', emis: 0.9,
              spot: '#ff2d55', spotI: 1.4, strip: '#ff4d6d', glow: 0.75, bloom: 0.3, thresh: 0.85, expo: 1.05, contrast: 1.15, vig: '#4a000c', vigW: 2.6, chroma: 4, grain: 4, sharp: 0.2,
              fire: ['#ffc0e0', '#ff2d55', '#5a0030'], fireL: '#ff2d55', fireI: 1.3, mirror: 0.3, banner: 0.55,
              p: { rate: 200, c1: '#ff4d6d', c2: '#5a0010', dir: -0.6, grav: -0.2, size: [0.02, 0.06], life: [2.5, 5] }, art: '#8a6a70', tint: '#ff9aa8' }
  };
}
const C3 = hex => BABYLON.Color3.FromHexString(hex.length === 4 ? '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3] : hex.slice(0, 7));
const C4 = (hex, a) => { const c = C3(hex); return new BABYLON.Color4(c.r, c.g, c.b, a == null ? 1 : a); };

/* 글씨·무늬를 판에 — 명판·전시실 이름·대리석 */
function canvasTex(scene, w, h, draw, name) {
  const t = new BABYLON.DynamicTexture(name || 'dt', { width: w, height: h }, scene, true);
  draw(t.getContext(), w, h); t.update(true); t.anisotropicFilteringLevel = 4;
  return t;
}
function textTex(scene, lines, w, h, opt) {
  return canvasTex(scene, w, h, (g) => {
    g.fillStyle = opt.bg; g.fillRect(0, 0, w, h);
    if (opt.border) { g.strokeStyle = opt.border; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    lines.forEach((ln, i) => {
      g.fillStyle = ln.color || opt.color;
      g.font = (ln.bold ? '700 ' : '400 ') + ln.size + 'px "Noto Serif KR", serif';
      const y = lines.length === 1 ? h / 2 : h * ((i + 0.5) / lines.length * (opt.spread || 1) + (1 - (opt.spread || 1)) / 2);
      g.fillText(ln.text, w / 2, y);
    });
  }, 'text');
}
/* 검은 대리석 — 광택 나는 궁전 바닥. 흰·금 결과 이음매 */
function darkMarbleTex(scene) {
  return canvasTex(scene, 1024, 1024, (g, w, h) => {
    const tile = w / 2;
    for (let ty = 0; ty < 2; ty++) for (let tx = 0; tx < 2; tx++) {
      const x0 = tx * tile, y0 = ty * tile, base = (tx + ty) % 2 ? 22 : 30;
      g.fillStyle = 'rgb(' + base + ',' + (base - 3) + ',' + (base - 1) + ')'; g.fillRect(x0, y0, tile, tile);
      for (let i = 0; i < 900; i++) { const v = base + Math.random() * 18 | 0; g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',.35)'; g.fillRect(x0 + Math.random() * tile, y0 + Math.random() * tile, 3, 3); }
      g.save(); g.beginPath(); g.rect(x0, y0, tile, tile); g.clip(); g.lineCap = 'round';
      for (let k = 0; k < 9; k++) {
        const gold = Math.random() < 0.35;
        g.strokeStyle = gold ? 'rgba(210,170,90,' + (0.25 + Math.random() * 0.3) + ')' : 'rgba(200,196,190,' + (0.12 + Math.random() * 0.22) + ')';
        g.lineWidth = 0.6 + Math.random() * 2;
        g.beginPath(); let x = x0 + Math.random() * tile, y = y0; g.moveTo(x, y);
        while (y < y0 + tile) { x += (Math.random() - 0.5) * 70; y += 16 + Math.random() * 36; g.lineTo(x, y); }
        g.stroke();
      }
      g.restore();
      g.strokeStyle = 'rgba(190,150,80,.55)'; g.lineWidth = 3; g.strokeRect(x0 + 1.5, y0 + 1.5, tile - 3, tile - 3);
    }
  }, 'darkMarble');
}
/* 불꽃 — 아래가 희고 위로 갈수록 주황·붉게 사라지는 혀 */
function fireTex(scene) {
  return canvasTex(scene, 128, 256, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    const gr = g.createRadialGradient(w / 2, h * 0.78, 4, w / 2, h * 0.6, h * 0.55);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,.85)'); gr.addColorStop(0.6, 'rgba(255,255,255,.3)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath();
    g.moveTo(w * 0.5, 0); g.bezierCurveTo(w * 0.95, h * 0.45, w * 0.95, h * 0.9, w * 0.5, h); g.bezierCurveTo(w * 0.05, h * 0.9, w * 0.05, h * 0.45, w * 0.5, 0); g.fill();
  }, 'fire');
}
/* 휘장 — 짙은 붉은 천에 금 테와 무늬, 가운데 신화권 색 둥근 문장 */
function bannerTex(scene, color) {
  return canvasTex(scene, 256, 640, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, w, 0);
    gr.addColorStop(0, '#3a0808'); gr.addColorStop(0.5, '#7a1414'); gr.addColorStop(1, '#3a0808');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#d9b45a'; g.lineWidth = 8; g.strokeRect(14, 14, w - 28, h - 60);
    g.lineWidth = 2; g.strokeRect(26, 26, w - 52, h - 84);
    for (let y = 60; y < h - 90; y += 46) { g.fillStyle = 'rgba(217,180,90,.35)'; g.beginPath(); g.moveTo(w / 2, y); g.lineTo(w / 2 + 12, y + 12); g.lineTo(w / 2, y + 24); g.lineTo(w / 2 - 12, y + 12); g.fill(); }
    g.fillStyle = color; g.beginPath(); g.arc(w / 2, h * 0.36, 52, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#d9b45a'; g.lineWidth = 6; g.stroke();
    g.fillStyle = '#d9b45a'; g.beginPath(); g.arc(w / 2, h * 0.36, 16, 0, Math.PI * 2); g.fill();
    /* 아래 술 */
    for (let x = 18; x < w - 12; x += 16) { g.fillStyle = '#c9a04a'; g.fillRect(x, h - 48, 6, 40); }
  }, 'banner');
}
function dotTex(scene) {
  return canvasTex(scene, 64, 64, (g) => {
    const gr = g.createRadialGradient(32, 32, 1, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,255,255,.5)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  }, 'dot');
}

/* ── 박물관 한 채(Babylon.js). 화면(Preact)과는 콜백으로만 이야기한다.
   좌표: 왼손 좌표계 — rotation.y = θ 면 +z 가 (sin θ, 0, cos θ) 로. 방 i 는 그 쪽으로 뻗는다 ── */
function buildMuseum(host, data, hooks) {
  if (!window.BABYLON) { hooks.onNoGL(); return null; }
  const canvas = document.createElement('canvas');
  canvas.tabIndex = 0; canvas.setAttribute('aria-label', W('museum.canvas'));
  host.appendChild(canvas);
  let engine;
  try { engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: false, powerPreference: 'high-performance' }, false); }
  catch (e) { canvas.remove(); hooks.onNoGL(); return null; }
  if (!engine._gl) { canvas.remove(); hooks.onNoGL(); return null; }
  const phone = matchMedia('(pointer: coarse)').matches;
  engine.setHardwareScalingLevel(1 / Math.min(devicePixelRatio || 1, phone ? 1.6 : 2));
  const scene = new BABYLON.Scene(engine);
  scene.fogMode = BABYLON.Scene.FOGMODE_LINEAR;
  scene.skipPointerMovePicking = true;
  const camera = new BABYLON.UniversalCamera('eye', new BABYLON.Vector3(0, EYE, 0), scene);
  camera.minZ = 0.05; camera.maxZ = 140; camera.fov = 1.15; camera.inputs.clear();
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  const halls = exhibits(data), texCache = new Map();
  layout(halls.length);
  /* 받은 그림으로 바꿔 끼운다 — 못 받으면 그대로 둔다 */
  const swapped = { floor: 0, wall: 0, banner: 0 };

    scene.clearColor = C4(m.fog); scene.fogColor = C3(m.fog); scene.fogStart = m.fogStart; scene.fogEnd = m.fogEnd;
    hemi.intensity = m.hemi; hemi.diffuse = C3(m.hemiC); hemi.groundColor = C3(m.ground);
    wallMat.diffuseColor = C3(m.wall); texWalls.forEach(w => { w.diffuseColor = w.diffuseTexture ? C3(m.wallT) : C3(m.wall); }); ceilMat.diffuseColor = C3(m.ceil); ceilMat.emissiveColor = C3(m.ceil).scale(0.35);
    floorMats.forEach(mt => { mt.diffuseColor = C3(m.floor); }); mirror.level = m.mirror;
    banners.forEach(b => { b.diffuseColor = new BABYLON.Color3(m.banner, m.banner, m.banner); });
    flameMat.emissiveColor = C3(m.fire[1]).scale(0.75); fires.forEach(l => { l.diffuse = C3(m.fireL); });
    pipe.sharpen.edgeAmount = m.sharp;
    frameMat.diffuseColor = C3(m.frame); frameMat.emissiveColor = C3(m.frame).scale(m.emis * 0.4); railMat.diffuseColor = C3(m.frame); railMat.emissiveColor = C3(m.frame).scale(m.emis * 0.3);
    stripMat.emissiveColor = C3(m.strip); rimMat.emissiveColor = C3(m.frame).scale(mode === 'base' ? 0.5 : 1); glowPlane.emissiveColor = C3(m.spot).scale(mode === 'base' ? 0.3 : 0.45);
    glow.intensity = m.glow;
    spots.forEach(s => { s.diffuse = C3(m.spot); s.specular = C3(m.spot); });
    pipe.bloomWeight = m.bloom; pipe.bloomThreshold = m.thresh;
    pipe.imageProcessing.exposure = m.expo; pipe.imageProcessing.contrast = m.contrast;
    pipe.imageProcessing.vignetteColor = C4(m.vig, 0); pipe.imageProcessing.vignetteWeight = m.vigW;
    pipe.chromaticAberrationEnabled = m.chroma > 0; if (m.chroma) pipe.chromaticAberration.aberrationAmount = m.chroma;
    pipe.grain.intensity = m.grain; pipe.grain.animated = true;
    const p = m.p;
    ps.emitRate = phone ? p.rate * 0.6 : p.rate; ps.color1 = C4(p.c1, 0.9); ps.color2 = C4(p.c2, 0.7); ps.colorDead = C4(p.c2, 0);
    ps.direction1 = new BABYLON.Vector3(-0.15, p.dir, -0.15); ps.direction2 = new BABYLON.Vector3(0.15, p.dir * 1.6, 0.15);
    ps.gravity = new BABYLON.Vector3(0, p.grav, 0); ps.minSize = p.size[0]; ps.maxSize = p.size[1]; ps.minLifeTime = p.life[0]; ps.maxLifeTime = p.life[1];
    ps.minEmitPower = 0.2; ps.maxEmitPower = 0.6;
    frames.forEach(fr => { fr.shown = null; hang(fr, fr.full); });
  }
  applyMood();

  /* ── 걷기 ── */
  const me = { x: 0, z: -R * 0.5, yaw: 0, pitch: 0 }, keys = {}, stick = { x: 0, y: 0 };
  function inRoom(x, z) {
    for (const hall of halls) {
      const c = Math.cos(hall.angle), s = Math.sin(hall.angle), lx = x * c - z * s, lz = x * s + z * c;
      if (lz > R_IN - 1.2 && lz < R_IN + hall.L - 0.6 && Math.abs(lx) < ROOM_W / 2 - 0.5) return hall;
    }
    return null;
  }
  function free(x, z) { const r = Math.hypot(x, z); return (r < R - 1.1 && r > 1.8) || !!inRoom(x, z); }
  function whereAmI() { const hall = inRoom(me.x, me.z); return hall && (Math.cos(hall.angle) * me.z + Math.sin(hall.angle) * me.x) > R_IN - 0.2 ? hall : null; }
  function goto(i) {
    if (i == null) { me.x = 0; me.z = -R * 0.5; me.yaw = 0; me.pitch = 0; return; }
    const a = halls[i].angle, d = R_IN + 1.2; me.x = Math.sin(a) * d; me.z = Math.cos(a) * d; me.yaw = a; me.pitch = 0;
  }
  const onKey = down => e => {
    if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'q', 'e'].includes(k)) { keys[k] = down; if (hooks.isFree()) e.preventDefault(); }
  };
  const kd = onKey(true), ku = onKey(false);
  addEventListener('keydown', kd); addEventListener('keyup', ku);
  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: 0 }; canvas.setPointerCapture(e.pointerId); canvas.focus({ preventScroll: true }); });
  canvas.addEventListener('pointermove', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
    me.yaw += dx * 0.005; me.pitch = Math.max(-0.6, Math.min(0.7, me.pitch + dy * 0.004));
  });
  canvas.addEventListener('pointerup', e => {
    if (!drag || drag.id !== e.pointerId) return;
    const click = drag.moved < 8; drag = null;
    if (!click) return;
    const r = canvas.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * engine.getRenderWidth(), sy = (e.clientY - r.top) / r.height * engine.getRenderHeight();
    const hit = scene.pick(sx, sy, m => pickable.has(m));
    if (hit && hit.hit && hit.distance < 14) hooks.onOpen(hit.pickedMesh.metadata.frame.card.name);
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });

  /* ── 그리기 ── */
  let focus = null, room = undefined, lastSpot = '';
  scene.onBeforeRenderObservable.add(() => {
    const dt = Math.min(0.12, engine.getDeltaTime() / 1000), now = performance.now();
    if (hooks.isFree()) {
      let mf = (keys.w || keys.arrowup ? 1 : 0) - (keys.s || keys.arrowdown ? 1 : 0) - stick.y, ms = (keys.d ? 1 : 0) - (keys.a ? 1 : 0) + stick.x;
      const turn = (keys.arrowright || keys.e ? 1 : 0) - (keys.arrowleft || keys.q ? 1 : 0);
      me.yaw += turn * dt * 1.8;
      const len = Math.hypot(mf, ms); if (len > 1) { mf /= len; ms /= len; }
      const fx = Math.sin(me.yaw), fz = Math.cos(me.yaw), stepLen = SPEED * dt;
      const nx = me.x + (fx * mf + fz * ms) * stepLen, nz = me.z + (fz * mf - fx * ms) * stepLen;
      if (free(nx, me.z)) me.x = nx;
      if (free(me.x, nz)) me.z = nz;
    }
    camera.position.set(me.x, EYE, me.z); camera.rotation.set(me.pitch, me.yaw, 0);
    const fwdX = Math.sin(me.yaw), fwdZ = Math.cos(me.yaw);
    /* 가까이 선 액자 — 4m 안, 바라보는 쪽. 스포트라이트는 가까운 넷에 */
    let best = null, bd = 1e9; const near = [];
    for (const fr of frames) {
      const dx = fr.world.x - me.x, dz = fr.world.z - me.z, d = Math.hypot(dx, dz);
      if (d < 7.5 && (fr.hall.index === room || room == null && d < 5)) near.push([d, fr]);
      if (d > 4.2) continue;
      const facing = (dx * fwdX + dz * fwdZ) / (d || 1), front = -(dx * fr.normal.x + dz * fr.normal.z) / (d || 1);
      if (facing < 0.45 || front < 0.2) continue;
      if (d < bd) { bd = d; best = fr; }
    }
    near.sort((x, y) => x[0] - y[0]);
    const lit = near.slice(0, spots.length).map(x => x[1]), sig = lit.map(f => f.card.name).join();
    if (sig !== lastSpot) {
      lastSpot = sig;
      spots.forEach((s, i) => {
        const fr = lit[i]; if (!fr) { s.intensity = 0; return; }
        s.position.set(fr.world.x + fr.normal.x * 1.7, 4.3, fr.world.z + fr.normal.z * 1.7);
        s.direction = new BABYLON.Vector3(fr.world.x - s.position.x, 2.05 - 4.3, fr.world.z - s.position.z).normalize();
        s.angle = 0.95; s.exponent = 3;
      });
    }
    const m = mood[mode];
    const fl = mode === 'cursed' ? 0.8 + Math.sin(now / 90) * 0.1 + (Math.random() < 0.05 ? -0.45 : 0) : mode === 'awaken' ? 0.9 + Math.sin(now / 500) * 0.1 : 1;
    spots.forEach((s, i) => { if (lit[i]) s.intensity = m.spotI * fl; });
    if (mode === 'cursed') glow.intensity = m.glow * (0.8 + fl * 0.25);
    /* 불꽃 일렁임, 가까운 화로 둘에 불빛 */
    for (const f of flames) { const t = now / 1000 + f.seed; f.m.scaling.y = 0.9 + Math.sin(t * 9) * 0.08 + Math.sin(t * 23) * 0.05; f.m.scaling.x = 1 + Math.sin(t * 13) * 0.07; }
    let n1 = -1, n2 = -1, d1 = 1e9, d2 = 1e9;
    for (let i = 0; i < brazierPos.length; i++) { const d = (brazierPos[i].x - me.x) ** 2 + (brazierPos[i].z - me.z) ** 2; if (d < d1) { d2 = d1; n2 = n1; d1 = d; n1 = i; } else if (d < d2) { d2 = d; n2 = i; } }
    [n1, n2].forEach((bi, i) => { const l = fires[i]; if (bi < 0) { l.intensity = 0; return; } const bp = brazierPos[bi]; l.position.set(bp.x, 1.9, bp.z); l.intensity = m.fireI * (0.85 + Math.sin(now / 70 + i * 3) * 0.08 + Math.sin(now / 173) * 0.07); });
    if (best && !best.full && bd < 5.5) hang(best, true);
    if (best !== focus) { focus = best; hooks.onFocus(best ? best.card.name : null); }
    const hall = whereAmI(), here = hall ? hall.index : null;
    if (here !== room) { room = here; hooks.onRoom(here); }
    ps.emitter.set(me.x, 0, me.z);
    halo.rotation.x = Math.PI / 2 + Math.sin(now / 1600) * 0.25; halo.rotation.z = now / 2000;
  });
  engine.runRenderLoop(() => scene.render());
  const ro = new ResizeObserver(() => engine.resize()); ro.observe(host);

  return {
    setMode(m) { mode = m; applyMood(); },
    setTheme() { mood = moods(); applyMood(); },
    goto,
    stick(x, y) { stick.x = x; stick.y = y; },
    frames: frames.length, halls: halls.length, engine: 'babylon',
    plan: () => ({ R, R_IN, roomW: ROOM_W, rooms: halls.map(h => ({ angle: h.angle, L: h.L, n: h.cards.length })), swapped: { ...swapped } }),
    state: () => ({ x: me.x, z: me.z, yaw: me.yaw, room, focus: focus && focus.card.name, mode, loaded: [...texCache.values()].filter(t => t.ready).length }),
    fileOf(name) { const fr = frames.find(f => f.card.name === name); if (!fr || !fr.files) return null; const own = fr.files[mode]; return { file: own || fr.files.base, own: !!own || mode === 'base' }; },
    dispose() { ro.disconnect(); removeEventListener('keydown', kd); removeEventListener('keyup', ku); engine.stopRenderLoop(); scene.dispose(); engine.dispose(); canvas.remove(); }
  };
}

/* 폰 손잡이 */
function Stick({ onMove }) {
  const ref = useRef(null), [knob, setKnob] = useState([0, 0]);
  const at = e => { const r = ref.current.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2 - 14;
    let x = e.clientX - cx, y = e.clientY - cy; const d = Math.hypot(x, y); if (d > max) { x *= max / d; y *= max / d; } setKnob([x, y]); onMove(x / max, y / max); };
  const end = () => { setKnob([0, 0]); onMove(0, 0); };
  return html`<div class="mu-stick" ref=${ref} aria-hidden="true"
    onPointerDown=${e => { e.stopPropagation(); e.currentTarget.setPointerCapture(e.pointerId); at(e); }}
    onPointerMove=${e => { if (e.currentTarget.hasPointerCapture(e.pointerId)) at(e); }} onPointerUp=${end} onPointerCancel=${end}>
    <i style=${'transform:translate(' + knob[0] + 'px,' + knob[1] + 'px)'}></i></div>`;
}

function Detail({ data, name, mode, api, onClose }) {
  useEffect(() => { const k = e => { if (e.key === 'Escape') onClose(); }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
  const c = data.cards.find(x => x.name === name); if (!c) return null;
  const pic = api && api.fileOf(name), sk = data.skills[c.skill] || {};
  return html`<div class="mu-detail" role="dialog" aria-label=${c.name} data-detail=${c.name} onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
    <div style=${'--cc:' + data.group.myth.color[c.myth]}>
      ${pic ? html`<img src=${IMG.imgURL(pic.file)} alt=${c.name} />` : html`<div class="mu-empty">${W('museum.pending')}</div>`}
      <div>
        <h3>${c.name}</h3>
        <small>${c.en} · ${data.group.myth.name[c.myth]} · ${data.group.kind.name[c.kind]} · ${W('card.cost.n', { n: c.cost })}</small>
        <small>${W('card.wielder')} — ${c.wielder}</small>
        <p>${c.text}</p>
        <p><b>${sk.name}</b> — ${sk.text}</p>
        ${mode === 'cursed' && c.curse && html`<p class="curse">${c.curse.text}</p>`}
        ${pic && !pic.own && html`<small>${W('museum.tinted.' + mode)}</small>`}
        <div class="row"><a href=${'dex.html?card=' + encodeURIComponent(c.name)} id="mu-to-dex">${W('museum.dex')}</a>
          <button type="button" id="mu-close" onClick=${onClose}>${W('museum.close')}</button></div>
      </div>
    </div>
  </div>`;
}

function App() {
  const data = useData();
  const host = useRef(null), api = useRef(null);
  const [mode, setMode] = useState('base'), [room, setRoom] = useState(null), [focus, setFocus] = useState(null), [open, setOpen] = useState(null);
  const [noGL, setNoGL] = useState(false);
  const openRef = useRef(null); openRef.current = open;
  const touch = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;
  useEffect(() => {
    if (!data || data.error || !host.current) return;
    const a = buildMuseum(host.current, data, {
      onNoGL: () => setNoGL(true), onFocus: setFocus, onRoom: setRoom, onOpen: setOpen, onLoad: () => {},
      isFree: () => !openRef.current
    });
    api.current = a;
    window.__museum = a;
    const onTheme = () => a && a.setTheme();
    addEventListener('atelier-appearance', onTheme);
    return () => { removeEventListener('atelier-appearance', onTheme); a && a.dispose(); };
  }, [data]);
  useEffect(() => { api.current && api.current.setMode(mode); }, [mode]);
  const shell = inner => html`<main><${WorkspaceHeader} page="dex" />${inner}</main>`;
  if (!data) return shell(html`<p class="mu-empty">${W('ui.loading')}</p>`);
  if (data.error) return shell(html`<p class="mu-empty">${W('ui.error', { message: data.error })}</p>`);
  const halls = data.group.myth.order, c = focus && data.cards.find(x => x.name === focus);
  return shell(html`
    <div class="mu-bar">
      <div class="mu-modes" role="group" aria-label=${W('home.hall.modes')}>
        ${['base', 'awaken', 'cursed'].map(m => html`<button key=${m} type="button" class=${'mu-btn ' + m} data-mode=${m} aria-pressed=${mode === m} onClick=${() => setMode(m)}>${W('museum.mode.' + m)}</button>`)}
      </div>
      <a class="mu-btn" href="dex.html">${W('museum.back')}</a>
      <div class="mu-rooms" role="group" aria-label=${W('museum.rooms')}>
        <button type="button" class="mu-btn" data-room="" aria-pressed=${room == null} onClick=${() => api.current && api.current.goto(null)}>${W('museum.lobby')}</button>
        ${halls.map((k, i) => html`<button key=${k} type="button" class="mu-btn" data-room=${i} aria-pressed=${room === i} style=${'--cc:' + data.group.myth.color[k]}
          onClick=${() => api.current && api.current.goto(i)}>${data.group.myth.name[k]}</button>`)}
      </div>
    </div>
    <div class=${'mu-stage' + (c ? ' has-caption' : '')} ref=${host} data-mode=${mode} data-room=${room == null ? '' : room}>
      ${noGL && html`<p class="mu-empty">${W('museum.nogl')} <a href="dex.html">${W('museum.back')}</a></p>`}
      <span class="mu-where">${room == null ? W('museum.lobby') : W('museum.room', { name: data.group.myth.name[halls[room]] })} · ${W('museum.mode.' + mode)}</span>
      <span class="mu-help">${W(touch ? 'museum.help.touch' : 'museum.help.pc')}</span>
      ${c && html`<div class="mu-caption" data-focus=${c.name} style=${'--cc:' + data.group.myth.color[c.myth]}>
        <button type="button" id="mu-more" onClick=${() => setOpen(c.name)}>${W('museum.more')}</button>
        <b>${c.name}</b><small>${data.group.myth.name[c.myth]} · ${data.group.kind.name[c.kind]} · ${c.wielder}</small>
        <p>${mode === 'cursed' && c.curse ? c.curse.text : c.text}</p></div>`}
      ${touch && !open && html`<${Stick} onMove=${(x, y) => api.current && api.current.stick(x, y)} />`}
      ${open && html`<${Detail} key=${open + mode} data=${data} name=${open} mode=${mode} api=${api.current} onClose=${() => setOpen(null)} />`}
    </div>`);
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>

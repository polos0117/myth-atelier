<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>신화 무기 공방</title>
<!--
  그림 프롬프트 생성기. 문장은 lib/prompt-spec.js(표)와 lib/prompt-myth.js(조립)에서 온다 —
  여기는 고르고 보여 주고 복사할 뿐이다. 설정은 무기마다 이 브라우저에 남는다.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth23">
<style>
* {box-sizing:border-box}
html,body {margin:0;padding:0}
.pm-grid {display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.pm-panel {padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:grid;gap:10px;min-width:0}
/* 격자 칸은 기본이 min-width:auto 라 안의 긴 줄이 칸을 넓힌다 — 줄이 줄어들어 옆으로 구르게 0 으로 */
.pm-panel > *,.pm-group > *,.pm-id > *,.pm-param > * {min-width:0;max-width:100%}
.pm-panel h2 {margin:0;font:700 11px/1.6 ui-monospace,monospace;letter-spacing:.1em;color:var(--accent)}
.pm-panel label {display:grid;gap:5px;font-size:12px;color:var(--muted)}
.pm-panel select,.pm-panel input[type=text],.pm-panel input[type=number] {width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);color:var(--text);font:inherit;font-size:13px}
.pm-note {margin:0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
.pm-id {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pm-id .custom {grid-column:1/-1}
.pm-group {border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:0 10px 10px}
.pm-group summary {display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-size:13px;font-weight:700;list-style:none}
.pm-group summary::-webkit-details-marker {display:none}
.pm-group summary::after {content:'+';color:var(--accent);font:18px ui-monospace,monospace}
.pm-group[open] summary::after {content:'−'}
.pm-group summary i {font-style:normal;font-size:11px;color:var(--accent);margin-left:auto}
.pm-group .pm-note {margin:0 0 8px}
.pm-group .pm-id select,.pm-group .pm-id input {background:var(--card)}
.pm-param {display:grid;gap:8px;min-width:0}
.pm-scene {display:grid;gap:6px}
.pm-scene-tools {display:flex;gap:6px;flex-wrap:wrap}
.pm-scene-tools .pm-btn {min-height:36px;padding:5px 10px;font-size:11px}
.pm-scene-tools .pm-btn[aria-pressed="true"] {border-color:var(--accent);color:var(--accent)}
.pm-scene input[type=text] {margin-top:2px}
.pm-param.wide {grid-column:1/-1}
.pm-extras {display:grid;gap:6px}
.pm-check {display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card2);font-size:12px;color:var(--text);cursor:pointer}
.pm-check input {width:18px;height:18px;margin:2px 0 0;flex:none}
.pm-check b {display:block;font-size:12px}
.pm-check small {display:block;color:var(--muted);font-size:11px;line-height:1.5}
/* 팔레트 — 색 동그라미. 자동은 빗금, 직접 입력은 무지개 */
.pm-colors {display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.pm-color {display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;min-height:70px;padding:6px 3px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.pm-color i {display:block;flex:none;width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px #0004;background:var(--card2)}
.pm-color.auto i {background:repeating-linear-gradient(45deg,var(--card2) 0 4px,var(--line) 4px 8px)}
.pm-color.custom i {background:conic-gradient(#e08aa8,#e3c574,#7fd8c0,#2f6fd0,#7e5aa8,#e08aa8)}
.pm-color span {font-size:10px;line-height:13px;text-align:center;overflow-wrap:anywhere}
.pm-color[aria-pressed="true"] {border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px var(--accent)}
/* 견본 그림 — 가로로 구른다 */
.pm-figures-head {display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.pm-figures-head .pm-btn {min-height:36px;padding:5px 10px;font-size:11px}
.pm-figures-head .pm-btn[aria-pressed="true"] {border-color:var(--accent);color:var(--accent)}
.pm-figures {min-width:0;max-width:100%;display:grid;gap:6px}
.pm-figure-row {display:flex;width:100%;gap:8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;padding:4px 2px 10px;scrollbar-width:thin;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.pm-figure {flex:0 0 84px;width:84px;height:158px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--muted);font:inherit;cursor:pointer;scroll-snap-align:start;overflow:hidden}
.pm-figure img {display:block;width:auto;height:auto;max-width:72px;max-height:112px;object-fit:contain;pointer-events:none}
.pm-figure b {display:block;width:72px;font-size:10px;line-height:13px;text-align:center;white-space:normal;overflow-wrap:anywhere;max-height:26px;overflow:hidden}
.pm-figure[aria-pressed="true"] {border-color:var(--accent);background:var(--accent-soft);color:var(--text);box-shadow:inset 0 -3px var(--accent)}
.pm-out {display:grid;gap:8px}
.pm-out textarea {width:100%;min-height:360px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--text);font:13px/1.7 ui-monospace,monospace;resize:vertical}
.pm-bar {display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.pm-bar .pm-btn {min-height:44px;padding:8px 14px;background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:8px;font:inherit;font-size:13px;font-weight:700}
:is([data-theme="daylight"],[data-theme="blossom"],[data-theme="sand"]) .pm-bar .pm-btn {color:#fff}
.pm-bar .pm-btn.quiet {background:var(--card2);color:var(--text);border-color:var(--line)}
.pm-file {padding:10px 12px;border:1px dashed var(--line);border-radius:8px;font:700 13px ui-monospace,monospace;overflow-wrap:anywhere;color:var(--text)}
.pm-pick2 {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px}
@media (max-width:420px) {.pm-pick2 {grid-template-columns:1fr}}
.pm-card {display:flex;gap:12px;align-items:center;padding:10px;background:var(--card2);border-radius:10px}
.pm-card .face {flex:none;width:64px;aspect-ratio:2/3;border-radius:8px;background:var(--card);overflow:hidden;display:grid;place-items:center;color:var(--muted);font:9px ui-monospace,monospace;text-align:center}
.pm-card .face img {width:100%;height:100%;object-fit:cover;display:block}
.pm-card b {display:block;font-size:15px}
.pm-card small {display:block;color:var(--muted);font-size:12px;line-height:1.5}
.pm-tag {display:inline-block;margin-top:4px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:700 10px ui-monospace,monospace}
@media(min-width:1000px){.pm-grid {grid-template-columns:360px minmax(0,1fr);align-items:start}}
</style>
<script src="lib/workspace-theme.js?v=myth7"></script>
<script src="lib/words.js?v=myth23"></script>
<script src="lib/fresh.js?v=4"></script>
<script src="lib/img.js?v=myth5"></script>
<script src="lib/prompt-spec.js?v=6"></script>
<script src="lib/prompt-myth.js?v=4"></script>
<script src="lib/prompt-random.js?v=1"></script>
</head>
<body class="prompt-page">
<div class="wrap"><div id="app"></div></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect, useMemo } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=myth8';
const html = htm.bind(h);
const W = window.W, S = window.AtelierSpec, P = window.AtelierPrompt, IMG = window.AtelierImg, R = window.AtelierSceneRandom;
const STORE = 'myth_prompt_v1';

function readStore() { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } }
function writeStore(v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch {} }
function useData() {
  const [state, set] = useState(null);
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    Promise.all([get('data/card.json'), get('data/group.json'), get('data/skill.json'), IMG.load()])
      .then(([card, group, skill, img]) => set({ data: { cards: card.cards, group, skills: skill.skills }, img }))
      .catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}
const DEFAULT = () => ({ style: S.DEFAULT_STYLE, output: 'portrait', action: '', casualIndex: 1, scene: '', params: {}, casual: { cat: 'everyday_basic', ex: '', pose: '', orient: '', expr: '', outfit: '', scene: '', axes: {}, locks: {} } });

function Select({ id, label, value, options, onChange }) {
  return html`<label for=${id}>${label}
    <select id=${id} value=${value} onChange=${e => onChange(e.currentTarget.value)}>
      ${options.map(([v, name]) => html`<option key=${v} value=${v}>${name}</option>`)}
    </select></label>`;
}

/* 일상컷 장면 — 갈래·예시·자세·방향·표정·의상·장소·강도 축. 칸마다 랜덤과 잠금 */
function Casual({ sc, update }) {
  const set = patch => update({ casual: { ...sc, ...patch } });
  const lock = k => set({ locks: { ...(sc.locks || {}), [k]: !(sc.locks || {})[k] } });
  const roll = k => update({ casual: R.randomize(sc, k) });
  const cats = S.CASUAL_CATS.filter(r => r[3] !== 'm').map(r => [r[0], r[1]]);
  const exRows = S.CASUAL_EXAMPLES[sc.cat] || [];
  const exOpts = exRows.map(r => [r[0], r[0] && r[0] !== '__custom__' ? r[1] + ' · ' + W('prompt.casual.tier.' + (r[3] || 'basic')) : r[1]]);
  const note = k => k === 'ex' ? (S.CASUAL_EX_NOTE[sc.ex] || '') : '';
  const field = (k, label, value, options, onChange, extra) => html`<div class="pm-scene" key=${k}>
    <${Select} id=${'pm-casual-' + k.replace('.', '-')} label=${label} value=${value} options=${options} onChange=${onChange} />
    <div class="pm-scene-tools">
      <button type="button" class="pm-btn quiet" data-random=${k} disabled=${!R.canRandomize(sc, k)} aria-label=${W('prompt.casual.random.field', { label })} onClick=${() => roll(k)}>${W('prompt.casual.random')}</button>
      <button type="button" class="pm-btn quiet" data-lock=${k} aria-pressed=${!!(sc.locks || {})[k]} aria-label=${W('prompt.casual.lock.field', { label })} onClick=${() => lock(k)}>${(sc.locks || {})[k] ? W('prompt.casual.locked') : W('prompt.casual.lock')}</button>
    </div>
    ${extra}
  </div>`;
  return html`<h2>${W('prompt.casual')}</h2>
    <p class="pm-note">${W('prompt.casual.note')}</p>
    <div class="pm-scene-tools"><button type="button" class="pm-btn quiet" id="pm-casual-random-all"
      disabled=${!Object.keys(R.fields(sc)).some(k => R.canRandomize(sc, k))} onClick=${() => roll(null)}>${W('prompt.casual.random.all')}</button></div>
    ${field('cat', W('prompt.casual.category'), sc.cat || '', cats, v => set({ cat: v, ex: '' }),
      sc.cat === '__custom__' && html`<input type="text" id="pm-casual-catCustom" value=${sc.catCustom || ''} onInput=${e => set({ catCustom: e.currentTarget.value })} />`)}
    ${exRows.length > 1 && field('ex', W('prompt.casual.example'), sc.ex || '', exOpts, v => set({ ex: v }),
      html`${note('ex') && html`<p class="pm-note">${note('ex')}</p>`}
        ${sc.ex === '__custom__' && html`<input type="text" id="pm-casual-exCustom" value=${sc.exCustom || ''} onInput=${e => set({ exCustom: e.currentTarget.value })} />`}`)}
    ${field('pose', W('prompt.casual.pose'), sc.pose || '', S.CASUAL_POSES, v => set({ pose: v }))}
    ${field('orient', W('prompt.casual.orient'), sc.orient || '', S.CASUAL_ORIENTS, v => set({ orient: v }))}
    ${field('expr', W('prompt.casual.expr'), sc.expr || '', S.CASUAL_EXPRESSIONS, v => set({ expr: v }))}
    <label for="pm-casual-outfit">${W('prompt.casual.outfit')}<input id="pm-casual-outfit" type="text" value=${sc.outfit || ''} onInput=${e => set({ outfit: e.currentTarget.value })} /></label>
    <label for="pm-casual-scene">${W('prompt.casual.scene')}<input id="pm-casual-scene" type="text" value=${sc.scene || ''} onInput=${e => set({ scene: e.currentTarget.value })} /></label>
    <details class="pm-group" data-group="axes">
      <summary><span>${W('prompt.casual.axes')}</span><i>${Object.values(sc.axes || {}).filter(v => v && v !== 'AUTO').length ? W('prompt.group.set', { n: Object.values(sc.axes || {}).filter(v => v && v !== 'AUTO').length }) : ''}</i></summary>
      <p class="pm-note">${W('prompt.casual.axes.note')}</p>
      ${S.CASUAL_AXES.map(ax => field('axes.' + ax, S.CASUAL_AXIS_LABELS[ax][1], (sc.axes || {})[ax] || 'AUTO',
        S.CASUAL_AXIS_OPTIONS[ax].map(v => [v, v === 'AUTO' ? W('prompt.auto') : (S.CASUAL_AXIS_GUIDES[ax][v] ? v + ' — ' + S.CASUAL_AXIS_GUIDES[ax][v][0] : v)]),
        v => set({ axes: { ...(sc.axes || {}), [ax]: v } })))}
    </details>`;
}
function App() {
  const loaded = useData();
  const [store, setStore] = useState(readStore);
  const [card, setCard] = useState(() => readStore().__card || '');
  const [myth, setMyth] = useState(() => readStore().__myth || '');
  const [copied, setCopied] = useState(false);
  const st = useMemo(() => ({ ...DEFAULT(), ...(store[card] || {}), card }), [store, card]);
  const update = patch => {
    const next = { ...store, [card]: { ...(store[card] || {}), ...patch }, __card: card };
    setStore(next); writeStore(next);
  };
  const pickCard = name => { setCard(name); const next = { ...store, __card: name }; setStore(next); writeStore(next); };
  /* 지역을 바꾸면 무기 칸은 비운다 — 다른 지역의 무기가 남아 있으면 헷갈린다 */
  const pickMyth = m => { setMyth(m); setCard(''); const next = { ...store, __myth: m, __card: '' }; setStore(next); writeStore(next); };
  if (!loaded) return html`<div><${WorkspaceHeader} page="prompt" /><p class="pm-note">${W('ui.loading')}</p></div>`;
  if (loaded.error) return html`<div><${WorkspaceHeader} page="prompt" /><p class="pm-note">${W('ui.error', { message: loaded.error })}</p></div>`;
  const { data, img } = loaded, g = data.group;
  const c = P.cardOf(data, card);
  const text = c ? P.build(st, data) : '';
  const file = c ? P.fileName(st, c) : '';
  const portrait = c && IMG.portraitOf(img[c.name], 'f', st.style);
  const copy = () => { navigator.clipboard && navigator.clipboard.writeText(text).then(() => { setCopied(true); setTimeout(() => setCopied(false), 1500); }); };
  const cards = g.myth.order.flatMap(m => data.cards.filter(x => x.myth === m).slice().sort((a, b) => b.cost - a.cost || a.name.localeCompare(b.name, 'ko')));
  const drawn = x => !!IMG.portraitOf(img[x.name], 'f');
  /* 지역은 고른 무기의 것이 먼저, 없으면 저장된 것, 그것도 없으면 첫 지역 */
  const region = (c && c.myth) || (g.myth.order.includes(myth) ? myth : g.myth.order[0]);

  return html`<div>
    <${WorkspaceHeader} page="prompt" />
    <div class="pm-grid">
      <div class="pm-panel">
        <h2>${W('prompt.card')}</h2>
        <div class="pm-pick2">
          <label for="pm-myth">${W('prompt.card.region')}
            <select id="pm-myth" value=${region} onChange=${e => pickMyth(e.currentTarget.value)}>
              ${g.myth.order.map(m => { const list = cards.filter(x => x.myth === m); return html`<option key=${m} value=${m}>${W('prompt.card.region.n', { name: g.myth.name[m], n: list.filter(drawn).length, total: list.length })}</option>`; })}
            </select></label>
          <label for="pm-card">${W('prompt.card.pick')}
            <select id="pm-card" value=${card} onChange=${e => pickCard(e.currentTarget.value)}>
              <option value="">—</option>
              ${cards.filter(x => x.myth === region).map(x => html`<option key=${x.name} value=${x.name}>${x.name} · ${g.kind.name[x.kind]} · ${W('card.cost.n', { n: x.cost })}${drawn(x) ? '' : ' · ' + W('prompt.card.noart')}</option>`)}
            </select></label>
        </div>
        ${c && html`<div class="pm-card">
          <span class="face">${portrait ? html`<img src=${IMG.thumbURL(portrait)} alt="" />` : W('art.none')}</span>
          <div><b>${c.name}</b><small>${c.en} · ${g.myth.name[c.myth]} · ${g.kind.name[c.kind]}</small><small>${c.wielder}</small>
            <span class="pm-tag">${portrait ? W('prompt.art.have') : W('prompt.art.none')}</span></div>
        </div>`}
        <${Select} id="pm-style" label=${W('prompt.style')} value=${st.style} options=${S.STYLES.map(s => [s[0], s[1]])} onChange=${v => update({ style: v })} />
        <${Select} id="pm-output" label=${W('prompt.output')} value=${st.output} options=${Object.keys(S.OUTPUTS).map(k => [k, S.OUTPUTS[k].name])} onChange=${v => update({ output: v })} />
        <p class="pm-note">${S.OUTPUTS[st.output].note}</p>
        ${st.output === 'skin' && c && ((c.skins || []).length
          ? html`<${Select} id="pm-skin" label=${W('prompt.skin')} value=${P.skinOf(st, c).key} options=${c.skins.map(k => [k.key, k.name])} onChange=${v => update({ skin: v })} />
            <${Select} id="pm-skin-state" label=${W('prompt.skin.state')} value=${P.skinState(st)} options=${['base', 'awaken', 'cursed'].map(x => [x, W('prompt.skin.state.' + x)])} onChange=${v => update({ skinState: v })} />
            <p class="pm-note">${W('prompt.skin.note')}</p>`
          : html`<p class="pm-note">${W('prompt.skin.none')}</p>`)}
        ${st.output === 'casual' && html`<label for="pm-casual">${W('prompt.casual.index')}
          <select id="pm-casual" value=${String(st.casualIndex || 1)} onChange=${e => update({ casualIndex: +e.currentTarget.value })}>
            ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => html`<option key=${n} value=${String(n)}>${n}</option>`)}
          </select></label>`}
        ${st.output === 'casual' && c ? html`<${Casual} sc=${st.casual || DEFAULT().casual} update=${update} />` : html`
        <h2>${W('prompt.design')}</h2>
        <p class="pm-note">${W('prompt.design.note')}</p>
        <${Select} id="pm-design" label=${W('prompt.design.kind')} value=${st.design || 'mecha'} options=${S.DESIGNS.map(d => [d[0], d[1] + ' — ' + d[2]])} onChange=${v => update({ design: v })} />
        <div class="pm-extras" role="group" aria-label=${W('prompt.extras')}>
          ${S.EXTRAS.map(([k, ko, note]) => html`<label key=${k} class="pm-check" title=${note}>
            <input type="checkbox" id=${'pm-extra-' + k} checked=${!!(st.extras && st.extras[k])}
              onChange=${e => update({ extras: { ...(st.extras || {}), [k]: e.currentTarget.checked } })} />
            <span><b>${ko}</b><small>${note}</small></span></label>`)}
        </div>
        ${st.output === 'portrait' && c && html`<${Select} id="pm-action" label=${W('prompt.posture')} value=${st.action || ''}
          options=${[['', W('prompt.posture.none')], ...S.ACTIONS[c.kind].map(a => [a[0], a[1]])]} onChange=${v => update({ action: v })} />`}
        ${st.output === 'awaken' && html`<p class="pm-note">${W('prompt.awaken.note')}</p>`}
        <label for="pm-scene">${W('prompt.scene')}
          <input id="pm-scene" type="text" value=${st.scene} placeholder=${W('prompt.scene.hint')} onInput=${e => update({ scene: e.currentTarget.value })} /></label>

        <h2>${W('prompt.identity')}</h2>
        <p class="pm-note">${W('prompt.identity.note')}</p>
        ${S.PARAM_GROUPS.map(([gk, gko, gnote], gi) => {
          const mine = S.PARAMS.filter(p => p.group === gk), set = mine.filter(p => st.params[p.key]).length;
          return html`<details class="pm-group" key=${gk} data-group=${gk} open=${gi === 0}>
            <summary><span>${gko}</span><i>${set ? W('prompt.group.set', { n: set }) : ''}</i></summary>
            <p class="pm-note">${gnote}</p>
            <div class="pm-id">${mine.map(p => {
              const setP = v => update({ params: { ...st.params, [p.key]: v } }), val = st.params[p.key] || '';
              const visual = S.FIGURE_VALUES[p.key], color = S.COLOR_KEYS[p.key];
              return html`<div key=${p.key} class=${'pm-param' + (visual || color ? ' wide' : '')}>
                <${Select} id=${'pm-' + p.key} label=${p.ko} value=${val} options=${p.options} onChange=${setP} />
                ${color && html`<div class="pm-colors" role="group" data-color-picker=${p.key} aria-label=${W('prompt.color.pick', { label: p.ko })}>
                  ${p.options.map(([v, t]) => html`<button key=${v} type="button" data-value=${v} aria-pressed=${val === v} title=${t}
                    class=${'pm-color' + (!v ? ' auto' : v === '__custom__' ? ' custom' : '')} onClick=${() => setP(v)}>
                    <i aria-hidden="true" style=${S.COLOR_HEX[v] ? 'background:' + S.COLOR_HEX[v] : ''}></i>
                    <span>${!v ? W(p.key === 'eyeColor2' ? 'prompt.eye.same' : 'prompt.auto') : v === '__custom__' ? W('prompt.custom') : t.split(' — ').pop()}</span></button>`)}
                </div>`}
                ${visual && html`<div class="pm-figures" data-figure-picker=${p.key}>
                  <div class="pm-figures-head"><span>${W('prompt.figure.pick', { label: p.ko })}</span>
                    <button type="button" class="pm-btn quiet" data-value="" aria-pressed=${!val} onClick=${() => setP('')}>${W('prompt.auto')}</button></div>
                  <div class="pm-figure-row" role="group" aria-label=${W('prompt.figure.pick', { label: p.ko })}>
                    ${visual.map(v => { const t = (p.options.find(o => o[0] === v) || [v, v])[1]; return html`<button key=${v} type="button" class="pm-figure" data-value=${v}
                      aria-pressed=${val === v} title=${t} onClick=${() => setP(v)}>
                      <img src=${P.figureURL(p.key, v)} alt="" loading="lazy" draggable="false" onError=${e => { e.currentTarget.style.visibility = 'hidden'; }} />
                      <b>${t.split(' — ')[0]}</b></button>`; })}
                  </div>
                </div>`}
                ${val === '__custom__' && html`<label class="custom" for=${'pm-' + p.key + '-custom'}>${p.ko} · ${W('prompt.custom')}
                  <input id=${'pm-' + p.key + '-custom'} type="text" value=${st.params[p.key + '_custom'] || ''}
                    onInput=${e => update({ params: { ...st.params, [p.key + '_custom']: e.currentTarget.value } })} /></label>`}
              </div>`; })}</div>
          </details>`;
        })}
        `}
        ${st.output === 'casual' && c && html`${S.PARAM_GROUPS.filter(g => g[0] === 'shot').map(([gk, gko, gnote]) => {
          const mine = S.PARAMS.filter(p => p.group === gk && ['frame', 'lens'].includes(p.key));
          return html`<details class="pm-group" key=${gk} data-group=${gk}>
            <summary><span>${gko}</span><i></i></summary>
            <div class="pm-id">${mine.map(p => html`<${Select} key=${p.key} id=${'pm-' + p.key} label=${p.ko} value=${st.params[p.key] || ''} options=${p.options} onChange=${v => update({ params: { ...st.params, [p.key]: v } })} />`)}</div>
          </details>`; })}`}
        ${c && html`<button class="pm-btn quiet" id="pm-reset" type="button" onClick=${() => { const next = { ...store, __card: card }; delete next[card]; setStore(next); writeStore(next); }}>${W('prompt.reset')}</button>`}
      </div>

      <div class="pm-panel pm-out">
        <h2>${W('prompt.result')}</h2>
        <textarea id="prompt-output" readonly value=${text} placeholder=${W('prompt.card.pick')}></textarea>
        <div class="pm-bar">
          <button class="pm-btn" id="pm-copy" type="button" disabled=${!text} onClick=${copy}>${copied ? W('prompt.copied') : W('prompt.copy')}</button>
          <span>${W('prompt.words', { n: P.words(text) })}</span>
        </div>
        ${c && html`<h2>${W('prompt.file')}</h2><div class="pm-file" id="pm-file">${file}</div><p class="pm-note">${W('prompt.file.note')}</p>`}
      </div>
    </div>
  </div>`;
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>

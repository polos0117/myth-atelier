<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121016">
<title>신화 무기 공방</title>
<!-- 던전 — 로그라이크 덱빌딩. 무기 셋을 데려가 아홉 칸의 길을 간다. 이기면 금화와 전리품, 상점에서 덱을 다듬는다.
     규칙은 lib/run.js 가 갖고, 여기는 그리기와 저장뿐이다. 길은 이 브라우저(localStorage)에 남는다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<link rel="stylesheet" href="lib/workspace.css?v=myth31">
<style>
.dex-page > #app {display:flex;flex-direction:column;min-height:0;height:100%}
.dex-page > #app > main {flex:1 1 auto;min-height:0}
.collection-scroll {display:block}
/* 싸움 화면 — 그림을 줄여 한 화면에, 손패는 늘 아래에 붙는다. 상대 위엔 다음 행동, 동료 위엔 받을 피해 */
.rn-battle .rn-arena {grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.rn-battle .rn-side {padding:8px}
.rn-battle .rn-party .rn-figs,.rn-battle .rn-enemy .rn-figs {grid-auto-columns:minmax(0,150px);gap:8px}
.rn-battle .rn-fig .face {aspect-ratio:4/5}
.rn-battle .rn-fig .info {padding:5px 7px 7px}
.rn-battle .rn-fig .nm {font-size:12px}
.rn-battle .rn-fig .hp {margin:4px 0 3px}
.rn-intent,.rn-incoming {position:absolute;left:6px;right:6px;bottom:6px;z-index:2;padding:4px 6px;border-radius:5px;font:800 12px/1.3 var(--display);text-align:center;backdrop-filter:blur(4px);overflow-wrap:anywhere}
.rn-intent {background:#2a0a10dd;color:#ffd6dd;border:1px solid #ff6b84;box-shadow:0 0 12px #c0143c66}
.rn-intent::before {content:'⚔ '}
.rn-intent.all {background:#3a0a1add;border-color:#ff2d55;color:#fff;box-shadow:0 0 16px #ff2d5588}
.rn-intent.all::before {content:'✸ '}
.rn-intent.stun {background:#1a1a2add;border-color:#8fc7ff;color:#cfe6ff;box-shadow:none}
.rn-intent.stun::before {content:'✶ '}
.rn-incoming {background:#0009;color:#ff9aa9;border:1px solid #ff6b8488;font-size:11px}
.rn-incoming::before {content:'▼ '}
.rn-incoming.taunt {color:#cfe6ff;border-color:#8fc7ff}
.rn-dock {position:sticky;bottom:0;z-index:5;margin:8px -4px 0;padding:6px 4px 8px;background:linear-gradient(180deg,transparent,var(--bg) 18px);}
.rn-dock .rn-deck {margin:4px 0 6px}
.rn-dock .rn-hand {grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.rn-dock .rn-card {min-height:92px}
@media (max-width:760px) {
  .rn-battle .rn-arena {grid-template-columns:1fr}
  .rn-battle .rn-party .rn-figs,.rn-battle .rn-enemy .rn-figs {grid-auto-columns:minmax(0,1fr)}
  .rn-battle .rn-fig .face {aspect-ratio:3/2}
  .rn-battle .rn-fig .face img {object-position:center 12%}
  .rn-battle .rn-fig .tag {display:none}
  .rn-battle .rn-fig .info {padding:4px 5px 5px}
  .rn-battle .rn-fig .nm i {display:none}
  .rn-battle .rn-side > h3 {margin-bottom:4px}
  .rn-battle .rn-arena {gap:6px}
  .rn-intent,.rn-incoming {font-size:10px;padding:3px 4px;left:3px;right:3px;bottom:3px}
  .rn-dock .rn-hand {display:flex;overflow-x:auto;gap:6px;padding-bottom:2px;scroll-snap-type:x mandatory}
  .rn-dock .rn-card {flex:0 0 128px;min-height:86px;scroll-snap-align:start}
}
.note {margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6;word-break:keep-all}
.empty {padding:36px 0;text-align:center;color:var(--muted);font-size:13px}
</style>
<script src="lib/workspace-theme.js?v=myth8"></script>
<script src="lib/words.js?v=myth41"></script>
<script src="lib/fresh.js?v=4"></script>
<script src="lib/img.js?v=myth5"></script>
<script src="lib/run.js?v=6"></script>
</head>
<body class="dex-page rn-page">
<div id="app"></div>
<script type="module">
import { h, render } from 'https://esm.sh/preact@10.24.3';
import { useState, useEffect } from 'https://esm.sh/preact@10.24.3/hooks';
import htm from 'https://esm.sh/htm@3.1.1';
import { WorkspaceHeader } from './lib/workspace-ui.js?v=myth13';
const html = htm.bind(h);
const W = window.W, IMG = window.AtelierImg, R = window.AtelierRun;
const STORE = 'myth_run_v1', HANDOFF = 'myth_handoff_v1', V = 'f';

function Shell({ children }) {
  return html`<main>
    <${WorkspaceHeader} page="run" />
    <div class="collection-scroll" tabindex="0">${children}</div>
  </main>`;
}
function useData() {
  const [state, set] = useState(null);
  useEffect(() => {
    const get = f => fetch(f, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
    Promise.all([get('data/card.json'), get('data/skill.json'), get('data/run.json'), get('data/group.json'), get('data/wielder.json'), get('data/draft.json'), IMG.load()])
      .then(([card, skill, run, group, wielder, draft, img]) => { const art = {}; card.cards.forEach(c => { if (IMG.portraitOf(img[c.name], V)) art[c.name] = 1; }); set({ data: { cards: card.cards, skills: skill.skills, run, art, wielders: wielder.wielders, draft }, group, img }); })
      .catch(e => set({ error: String((e && e.message) || e) }));
  }, []);
  return state;
}
function load() { try { const j = JSON.parse(localStorage.getItem(STORE)); return j && j.party ? j : null; } catch { return null; } }
function save(st) { try { if (st) localStorage.setItem(STORE, JSON.stringify(st)); else localStorage.removeItem(STORE); } catch {} }
function seed() { return (Date.now() ^ Math.floor(Math.random() * 1e9)) | 0; }
function loadHandoff() { try { const j = JSON.parse(localStorage.getItem(HANDOFF)); return j && j.pairs && j.pairs.length ? j : null; } catch { return null; } }
function clearHandoff() { try { localStorage.removeItem(HANDOFF); } catch {} }
/* 판 그림 — 고른 스킨이 있으면 스킨의 상태 그림, 그 상태 그림이 없으면 스킨 기본에 효과(.skin-fx)를 덮는다 */
function artOf(img, name, state) { return IMG.dressOf(img[name], name, V, state === 'awaken' ? 3 : 1, state === 'cursed'); }
function faceOf(img, name) { return IMG.dressOf(img[name], name, V, 1, false).file; }

/* 전신 그림 한 장 — 상태에 따라 각성·저주 그림으로 넘어간다 */
function Figure({ img, name, state, hp, maxHp, shield, dead, sub, gauge, gaugeMax, target, onClick, kindName, intent, incoming }) {
  const art = artOf(img, name, state), file = art.file, pct = Math.round(hp / maxHp * 100);
  return html`<button type="button" class=${'rn-fig' + (dead ? ' dead' : '') + (target ? ' target' : '') + (art.fx ? ' skinned' : '')} data-name=${name} data-state=${state}
    data-skin=${art.skin || undefined} onClick=${onClick} disabled=${!onClick}>
    <span class="face">${file ? html`<img src=${IMG.imgURL(file)} alt="" />` : html`<span class="ph">${name}</span>`}${art.fx ? html`<i class="skin-fx"></i>` : ''}
      <span class="tag">${dead ? W('run.figure.dead') : W('run.state.' + state)}</span>
      ${intent && !dead ? html`<span class=${'rn-intent ' + intent.k} title=${W('run.intent.title')}>${intent.k === 'stun' ? W('run.intent.stun') : intent.k === 'all' ? W('run.intent.all', intent) : W('run.intent.hit', intent)}</span>` : ''}
      ${incoming && !dead ? html`<span class=${'rn-incoming' + (incoming.taunt ? ' taunt' : '')} title=${incoming.taunt ? W('run.incoming.taunt') : ''}>${W('run.incoming', incoming)}</span>` : ''}</span>
    <span class="info">
      <span class="nm">${name}<i>${sub || kindName}</i></span>
      <span class="hp"><u class=${pct < 35 ? 'low' : ''} style=${'width:' + pct + '%'}></u></span>
      <span class="num">${W('run.hp', { hp, max: maxHp })}${shield ? html`<span class="shield">+${shield}</span>` : ''}</span>
      ${gaugeMax && !dead ? html`<span class="pips" title=${W('run.gauge', { n: Math.min(gauge, gaugeMax), max: gaugeMax })}>${Array.from({ length: gaugeMax }, (_, i) => html`<i key=${i} class=${(state === 'awaken' || i < gauge) ? 'on' : ''}></i>`)}</span>` : ''}
    </span>
  </button>`;
}

/* 카드 한 장 — 손패·전리품·상점·덱 빼기가 같은 모양을 쓴다 */
function Card({ data, group, c, on, disabled, onClick, tag, attr }) {
  const s = R.spec(data, c), card = R.cardOf(data, c.owner);
  return html`<button type="button" class=${'rn-card' + (on ? ' on' : '') + (s.rare ? ' rare' : '')} data-key=${s.key} data-owner=${c.owner} ...${attr || {}}
    style=${'--cc:' + (group.kind.color ? group.kind.color[card.kind] : 'var(--gold)')} disabled=${disabled} onClick=${onClick}>
    <span class="who">${c.owner}${s.unique ? html`<b>${W('run.card.unique')}</b>` : ''}${s.rare ? html`<b>${W('run.card.rare')}</b>` : ''}</span>
    <span class="nm">${s.name}</span><span class="tx">${s.text}</span><span class="cost">${s.cost}</span>${tag ? html`<span class="got">${tag}</span>` : ''}</button>`;
}
/* 금화와 덱 — 쓰러진 무기의 카드는 싸움에 안 나오니 세지 않는다 */
function Purse({ st }) {
  const alive = new Set(R.living(st).map(m => m.name)), n = (st.deck || []).filter(c => alive.has(c.owner)).length;
  return html`<p class="rn-purse" data-gold=${st.gold || 0}><b>${W('run.purse', { g: st.gold || 0, n })}</b></p>`;
}

function Pick({ data, group, img, onStart }) {
  const [sel, setSel] = useState([]);
  const cards = data.cards.slice().sort((a, b) => (IMG.portraitOf(img[b.name], V) ? 1 : 0) - (IMG.portraitOf(img[a.name], V) ? 1 : 0) || b.cost - a.cost);
  const toggle = n => setSel(s => s.includes(n) ? s.filter(x => x !== n) : s.length < 3 ? s.concat(n) : s);
  return html`<div>
    <div class="rn-head"><h2>${W('run.pick.title')}</h2><p class="help">${W('run.pick.note')}</p></div>
    <div class="rn-bar"><b>${W('run.pick.count', { n: sel.length })}</b>
      <button type="button" class="rn-btn primary" disabled=${sel.length !== 3} onClick=${() => onStart(sel)}>${W('run.pick.start')}</button></div>
    <div class="rn-pick">${cards.map(c => { const f = faceOf(img, c.name); return html`<button type="button" key=${c.name} class=${'cell' + (sel.includes(c.name) ? ' on' : '')} data-name=${c.name} aria-pressed=${sel.includes(c.name)} onClick=${() => toggle(c.name)}>
      <span class="face">${f ? html`<img src=${IMG.thumbURL(f)} alt="" loading="lazy" />` : ''}</span>
      <span class="cap">${c.name}<i>${group.kind.name[c.kind]} · ${W('card.cost.n', { n: c.cost })}</i></span></button>`; })}</div>
  </div>`;
}

/* 드래프트에서 온 짝 여섯 — 셋을 고르면 나머지는 예비 */
function Sortie({ data, group, img, hand, onStart, onPlain }) {
  const [sel, setSel] = useState([]);
  const toggle = i => setSel(s => s.includes(i) ? s.filter(x => x !== i) : s.length < 3 ? s.concat(i) : s);
  const tag = p => { const c = R.cardOf(data, p.w), o = R.wielderOf(data, p.o), t = [];
    if (o && c.wielder === o.name) t.push(W('run.pair.own')); if (o && o.favor === c.kind) t.push(W('run.pair.favor')); return t.join(' · '); };
  const kHp = [0.9, 1.0, 1.2][hand.rank] || 1;
  return html`<div class="rn-sortie">
    <div class="rn-head"><h2>${W('run.sortie.title')}</h2><p class="help">${W('run.sortie.note')}</p></div>
    <p class="rn-note">${W('run.sortie.rank', { rank: hand.rank + 1, k: kHp })}</p>
    <div class="rn-bar"><b>${W('run.pick.count', { n: sel.length })}</b>
      <button type="button" class="rn-btn primary" data-sortie-start="1" disabled=${sel.length !== 3} onClick=${() => onStart(sel.map(i => hand.pairs[i]), hand.pairs.filter((_, i) => !sel.includes(i)))}>${W('run.pick.start')}</button>
      <button type="button" class="rn-btn quiet" data-plain="1" onClick=${onPlain}>${W('run.sortie.plain')}</button></div>
    <div class="rn-pick">${hand.pairs.map((p, i) => { const f = faceOf(img, p.w), c = R.cardOf(data, p.w); return html`<button type="button" key=${i} class=${'cell' + (sel.includes(i) ? ' on' : '')} data-name=${p.w} aria-pressed=${sel.includes(i)} onClick=${() => toggle(i)}>
      <span class="face">${f ? html`<img src=${IMG.thumbURL(f)} alt="" loading="lazy" />` : ''}</span>
      <span class="cap">${p.w} × ${p.o}<i>${group.kind.name[c.kind]} · ${p.s}</i>${tag(p) ? html`<i>${tag(p)}</i>` : ''}</span></button>`; })}</div>
  </div>`;
}

function Map({ st, data, onGo }) {
  const list = R.nodes(data);
  return html`<div>
    <div class="rn-head"><h2>${W('run.map.title')}</h2><p class="help">${W('run.map.note')}</p></div>
    <${Purse} st=${st} />
    <div class="rn-map">${list.map((k, i) => html`<div key=${i} class=${'rn-node ' + k + (i < st.node ? ' done' : '') + (i === st.node ? ' here' : '')} data-index=${i}><b>${i + 1}</b>${W('run.node.' + k)}</div>`)}</div>
    <div class="rn-bar"><button type="button" class="rn-btn primary" onClick=${onGo}>${W('run.map.go')}</button></div>
  </div>`;
}

function Party({ st, data, img, group, gaugeMax, incoming }) {
  return html`<div class="rn-figs">${st.party.map(m => { const c = R.cardOf(data, m.name); return html`<${Figure} key=${m.name} img=${img} name=${m.name} state=${R.stateOf(st, m)}
    hp=${m.hp} maxHp=${m.maxHp} shield=${m.shield} dead=${!m.alive} kindName=${m.wielder || group.kind.name[c.kind]}
    gauge=${st.battle ? st.battle.gauge[m.name] : 0} gaugeMax=${gaugeMax ? (m.gaugeMax || gaugeMax) : 0} incoming=${incoming ? incoming[m.name] : null} />`; })}</div>
    ${st.reserve && st.reserve.length ? html`<p class="rn-note rn-reserve">${W('run.reserve', { n: st.reserve.length })} · ${st.reserve.map(r => r.w + ' × ' + r.o).join(' · ')}</p>` : ''}`;
}

function Log({ log }) {
  const line = e => {
    const p = { a: e.a, b: e.b, d: e.d, name: e.name, n: e.enemies ? e.enemies.join(' · ') : '' };
    if (e.k === 'ask') return W('run.log.ask', p) + (e.feud ? ' — ' + W('run.ask.feud') : '');
    return W('run.log.' + e.k, p);
  };
  const bad = { ehit: 1, eskill: 1, fall: 1, curse: 1, bleed: 1, lose: 1 };
  return html`<div class="rn-log">${log.slice(-8).map((e, i) => html`<div key=${i} class=${bad[e.k] ? 'bad' : ''}>${e.k === 'awaken' || e.k === 'win' ? html`<b>${line(e)}</b>` : line(e)}</div>`)}</div>`;
}

function Battle({ st, data, img, group, act }) {
  const b = st.battle, T = R.tune(data), [pick, setPick] = useState(null);
  const foes = b.enemies, alive = R.foes(st);
  const playCard = (i) => {
    const s = R.spec(data, b.hand[i]);
    if (s.mult && !s.all && alive.length > 1) { setPick(pick === i ? null : i); return; }
    setPick(null); act(x => R.play(x, data, i, 0));
  };
  const onEnemy = (idx) => { if (pick === null) return; const i = pick; setPick(null); act(x => R.play(x, data, i, idx)); };
  /* 다음 턴에 동료가 받을 피해 — 상대의 예고를 더한다. 도발 중이면 한 대 공격은 도발한 동료에게 */
  const incoming = {}, add = (n, d, taunt) => { const o = incoming[n] || (incoming[n] = { d: 0 }); o.d += d; if (taunt) o.taunt = true; };
  const living = R.living(st);
  alive.forEach(e => { const it = e.intent; if (!it || e.stunned) return;
    if (it.k === 'all') living.forEach(p => add(p.name, it.d));
    else add(b.taunt && living.some(p => p.name === b.taunt) ? b.taunt : it.b, it.d, !!b.taunt); });
  return html`<div class="rn-battle">
    <div class="rn-head"><h2>${b.boss ? W('run.node.boss') : W('run.node.fight')} <small class="rn-note">${W('run.battle.turn', { n: b.turn })}</small></h2>
      <p>${W('run.battle.deck', { n: b.deck.length, m: b.discard.length })}</p></div>
    <div class="rn-arena">
      <section class="rn-side rn-party"><h3>${W('run.party')}</h3><${Party} st=${st} data=${data} img=${img} group=${group} gaugeMax=${T.gauge} incoming=${incoming} /></section>
      <section class="rn-side rn-enemy"><h3>${W('run.enemy')}${b.boss ? ' · ' + W('run.battle.boss') : ''}</h3>
        <div class="rn-figs">${foes.map((e, i) => { const c = R.cardOf(data, e.name); const idx = alive.indexOf(e); return html`<${Figure} key=${e.name} img=${img} name=${e.name} state="base" hp=${e.hp} maxHp=${e.maxHp} dead=${!e.alive}
          kindName=${e.wielder || group.kind.name[c.kind]} target=${pick !== null && e.alive} onClick=${pick !== null && e.alive ? (() => onEnemy(idx)) : null}
          intent=${e.stunned ? { k: 'stun' } : e.intent} />`; })}</div></section>
    </div>
    <div class="rn-dock">
    <div class="rn-deck"><span class="rn-mana">${W('run.battle.mana')} ${Array.from({ length: T.mana }, (_, i) => html`<i key=${i} class=${i < b.mana ? 'on' : ''}></i>`)}</span>
      <span class=${pick !== null ? '' : 'help'}>${pick !== null ? W('run.battle.target', { name: R.spec(data, b.hand[pick]).name }) : W('run.battle.hand')}</span>
      <button type="button" class="rn-btn" onClick=${() => { setPick(null); act(x => R.endTurn(x, data)); }}>${W('run.battle.end')}</button></div>
    <div class="rn-hand">${b.hand.map((c, i) => { const s = R.spec(data, c), owner = st.party.find(p => p.name === c.owner);
      const can = owner && owner.alive && s.cost <= b.mana;
      return html`<${Card} key=${c.id} data=${data} group=${group} c=${c} on=${pick === i} disabled=${!can} onClick=${() => playCard(i)} />`; })}</div>
    </div>
    <${Log} log=${st.log} />
    ${b.ask && html`<div class="rn-ask" role="dialog"><div>
      <h3>${W('run.ask.title', { name: b.ask })}</h3><p>${W('run.ask.text')}${(st.party.find(p => p.name === b.ask) || {}).feud ? ' ' + W('run.ask.feud') : ''}</p>
      <div class="rn-bar"><button type="button" class="rn-btn primary" data-answer="yes" onClick=${() => act(x => R.answerCurse(x, data, true))}>${W('run.ask.yes')}</button>
        ${(st.party.find(p => p.name === b.ask) || {}).feud ? '' : html`<button type="button" class="rn-btn quiet" data-answer="no" onClick=${() => act(x => R.answerCurse(x, data, false))}>${W('run.ask.no')}</button>`}</div>
    </div></div>`}
  </div>`;
}

function Choice({ st, data, img, group, kind, act }) {
  const ok = m => m.alive && (kind === 'shrine' ? !m.awakened : !m.cursed);
  const any = st.party.some(ok);
  return html`<div>
    <div class="rn-head"><h2>${W('run.' + kind + '.title')}</h2><p>${W('run.' + kind + '.note')}</p></div>
    <div class="rn-choice">${st.party.map(m => { const c = R.cardOf(data, m.name); return html`<div key=${m.name}>
      <${Figure} img=${img} name=${m.name} state=${R.stateOf(st, m)} hp=${m.hp} maxHp=${m.maxHp} dead=${!m.alive} kindName=${group.kind.name[c.kind]} />
      <div class="rn-bar"><button type="button" class="rn-btn" data-choose=${m.name} disabled=${!ok(m)}
        onClick=${() => act(x => kind === 'shrine' ? R.chooseShrine(x, data, m.name) : R.chooseGate(x, data, m.name))}>${W('run.' + kind + '.pick')}</button></div></div>`; })}</div>
    <div class="rn-bar">${kind === 'gate' || !any ? html`<button type="button" class="rn-btn quiet" data-pass="1" onClick=${() => act(x => kind === 'gate' ? R.chooseGate(x, data, null) : (x.phase = 'map', { ok: true }))}>${W('run.pass')}</button>` : ''}
      ${kind === 'shrine' && !any ? html`<span class="rn-note">${W('run.shrine.none')}</span>` : ''}</div>
  </div>`;
}

/* 이긴 뒤 — 금화, 그리고 셋 중 한 장 */
function Result({ st, data, img, group, act }) {
  const rw = st.reward, taken = rw ? rw.taken : null, offer = rw && rw.cards.length;
  return html`<div class="rn-result">
    <div class="rn-head"><h2>${W('run.result.win')}</h2><p class="help">${W('run.result.note')}</p></div>
    ${rw ? html`<p class="rn-gold">${W('run.loot.gold', { n: rw.gold })}</p>` : ''}
    <${Purse} st=${st} />
    ${offer ? html`<section class="rn-loot"><h3 class="rn-sub">${W('run.loot.title')}</h3><p class="rn-note help">${W('run.loot.note')}</p>
      <div class="rn-offer">${rw.cards.map((c, i) => html`<${Card} key=${i} data=${data} group=${group} c=${c} attr=${{ 'data-loot': i }}
        on=${taken === i} tag=${taken === i ? W('run.loot.taken') : ''} disabled=${taken !== null}
        onClick=${() => act(x => R.takeReward(x, data, i))} />`)}</div></section>` : ''}
    <div class="rn-bar"><button type="button" class=${'rn-btn' + (offer && taken === null ? ' quiet' : ' primary')} data-next="1" onClick=${() => act(x => R.proceed(x, data))}>
      ${offer && taken === null ? W('run.loot.skip') : W('run.result.next')}</button></div>
    <${Party} st=${st} data=${data} img=${img} group=${group} />
    <${Log} log=${st.log} /></div>`;
}

/* 상점 — 카드 사기, 그리고 빼기·치유·정화 한 번씩 */
function Shop({ st, data, img, group, act }) {
  const [rm, setRm] = useState(false);
  const S = data.run.shop, sh = st.shop, gold = st.gold || 0;
  const alive = new Set(R.living(st).map(m => m.name)), cursed = st.party.filter(m => m.alive && m.cursed);
  const canHeal = R.living(st).some(p => !p.cursed && p.hp < p.maxHp);
  const mine = o => st.deck.filter(x => x.owner === o).length;
  return html`<div class="rn-shop">
    <div class="rn-head"><h2>${W('run.shop.title')}</h2><p class="help">${W('run.shop.note')}</p></div>
    <${Purse} st=${st} />
    <h3 class="rn-sub">${W('run.shop.cards')}</h3>
    <div class="rn-offer">${sh.cards.map((c, i) => html`<div class="rn-ware" key=${i}>
      <${Card} data=${data} group=${group} c=${c} on=${c.sold} tag=${c.sold ? W('run.shop.sold') : ''} disabled=${true} />
      <button type="button" class="rn-btn" data-buy=${i} disabled=${c.sold || gold < c.price} onClick=${() => act(x => R.buy(x, data, i))}>${c.sold ? W('run.shop.sold') : W('run.shop.price', { n: c.price })}</button></div>`)}</div>
    <h3 class="rn-sub">${W('run.shop.care')}</h3>
    <div class="rn-bar rn-care">
      <button type="button" class="rn-btn" data-remove="1" aria-pressed=${rm} disabled=${sh.removed || gold < S.remove} onClick=${() => setRm(!rm)}>${sh.removed ? W('run.shop.done') : W('run.shop.remove', { n: S.remove })}</button>
      <button type="button" class="rn-btn" data-heal="1" disabled=${sh.healed || !canHeal || gold < S.heal} onClick=${() => act(x => R.shopHeal(x, data))}>${sh.healed ? W('run.shop.done') : W('run.shop.heal', { p: Math.round(S.healRatio * 100), n: S.heal })}</button>
      ${cursed.length ? cursed.map(m => html`<button type="button" key=${m.name} class="rn-btn" data-purify=${m.name} disabled=${sh.purified || gold < S.purify} onClick=${() => act(x => R.purify(x, data, m.name))}>${W('run.shop.purify', { name: m.name, n: S.purify })}</button>`)
        : html`<button type="button" class="rn-btn" disabled>${W('run.shop.purify.none')}</button>`}
    </div>
    ${rm && !sh.removed ? html`<div class="rn-remove"><div class="rn-bar"><span class="rn-note">${W('run.shop.remove.note')}</span>
        <button type="button" class="rn-btn quiet" onClick=${() => setRm(false)}>${W('run.shop.remove.cancel')}</button></div>
      <div class="rn-offer small">${st.deck.map((c, i) => alive.has(c.owner) ? html`<${Card} key=${i} data=${data} group=${group} c=${c} attr=${{ 'data-deck': i }}
        disabled=${mine(c.owner) <= 1} onClick=${() => { setRm(false); act(x => R.removeCard(x, data, i)); }} />` : '')}</div></div>` : ''}
    <div class="rn-bar"><button type="button" class="rn-btn primary" data-leave="1" onClick=${() => act(x => R.leaveShop(x))}>${W('run.shop.leave')}</button></div>
    <${Party} st=${st} data=${data} img=${img} group=${group} />
    <${Log} log=${st.log} /></div>`;
}

function End({ st, kind, onAgain }) {
  const a = st.party.filter(m => m.awakened).length, c = st.party.filter(m => m.cursed).length;
  return html`<div class=${'rn-end ' + kind}><h2>${W('run.' + kind + '.title')}</h2>
    <p>${W('run.' + kind + '.note', { n: st.node + 1, a, c })}</p>
    <button type="button" class="rn-btn primary" onClick=${onAgain}>${W('run.again')}</button></div>`;
}

function App() {
  const loaded = useData();
  const [st, setSt] = useState(load), [hand, setHand] = useState(loadHandoff);
  if (!loaded) return html`<${Shell}><p class="empty">${W('ui.loading')}</p></${Shell}>`;
  if (loaded.error) return html`<${Shell}><p class="empty">${W('ui.error', { message: loaded.error })}</p></${Shell}>`;
  const { data, group, img } = loaded;
  const act = fn => { const next = JSON.parse(JSON.stringify(st)); const r = fn(next); if (!r || r.ok !== false) { save(next); setSt(next); } };
  const again = () => { save(null); setSt(null); };
  let body;
  if (!st && hand) body = html`<${Sortie} data=${data} group=${group} img=${img} hand=${hand}
    onStart=${(pairs, reserve) => { const s = R.newRun(data, seed(), null, { pairs, reserve, foes: hand.foes, boss: hand.boss, rank: hand.rank }); clearHandoff(); setHand(null); save(s); setSt(s); }}
    onPlain=${() => { clearHandoff(); setHand(null); }} />`;
  else if (!st) body = html`<${Pick} data=${data} group=${group} img=${img} onStart=${names => { const s = R.newRun(data, seed(), names); save(s); setSt(s); }} />`;
  else if (st.phase === 'map') body = html`<${Map} st=${st} data=${data} onGo=${() => act(x => R.proceed(x, data))} />`;
  else if (st.phase === 'battle') body = html`<${Battle} st=${st} data=${data} img=${img} group=${group} act=${act} />`;
  else if (st.phase === 'result') body = html`<${Result} st=${st} data=${data} img=${img} group=${group} act=${act} />`;
  else if (st.phase === 'shop' && st.shop) body = html`<${Shop} st=${st} data=${data} img=${img} group=${group} act=${act} />`;
  else if (st.phase === 'shrine' || st.phase === 'gate') body = html`<${Choice} st=${st} data=${data} img=${img} group=${group} kind=${st.phase} act=${act} />`;
  else if (st.phase === 'rest') body = html`<div>
    <div class="rn-head"><h2>${W('run.rest.title')}</h2><p class="help">${W('run.rest.note')}</p></div>
    <${Party} st=${st} data=${data} img=${img} group=${group} />
    <div class="rn-bar"><button type="button" class="rn-btn primary" data-rest="1" onClick=${() => act(x => R.rest(x, data))}>${W('run.rest.go')}</button></div></div>`;
  else body = html`<${End} st=${st} kind=${st.phase} onAgain=${again} />`;
  return html`<${Shell}>${body}
    ${st && !['won', 'lost'].includes(st.phase) ? html`<div class="rn-bar"><span class="rn-note">${W('run.saved')}</span>
      <button type="button" class="rn-btn quiet" data-abandon="1" onClick=${again}>${W('run.abandon')}</button></div>` : ''}
  </${Shell}>`;
}
render(html`<${App} />`, document.getElementById('app'));
window.AtelierFresh.watch();
</script>
</body>
</html>
